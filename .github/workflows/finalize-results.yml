name: Finalize Results Calendar

on:
  workflow_run:
    workflows: ["Update NSE Results Calendar"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  finalize-results:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete symbol-wise results map
        run: |
          python <<'PY'
          import json

          with open("data/symbols.json", "r", encoding="utf-8") as f:
              symbols = json.load(f)

          with open("data/results.json", "r", encoding="utf-8") as f:
              results = json.load(f)

          current = results.get("symbolWise", [])
          by_symbol = {
              str(item.get("symbol", "")).strip().upper(): item
              for item in current
              if item.get("symbol")
          }

          final = []

          for stock in symbols:
              symbol = str(stock.get("symbol", "")).strip().upper()
              if not symbol:
                  continue

              item = by_symbol.get(symbol, {})

              final.append({
                  "symbol": symbol,
                  "company": stock.get("name", ""),
                  "lastResult": item.get("lastResult"),
                  "upcomingResults": item.get("upcomingResults", []),
              })

          final.sort(key=lambda x: x["symbol"])

          results["symbolWise"] = final
          results["symbolCount"] = len(final)

          with open("data/results.json", "w", encoding="utf-8") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)

          print("Symbol-wise results:", len(final))
          print("Symbols with last result:", sum(1 for x in final if x.get("lastResult")))
          print("Symbols with upcoming results:", sum(1 for x in final if x.get("upcomingResults")))
          PY

      - name: Commit and push finalized results
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json

          if git diff --cached --quiet; then
            echo "No finalization changes."
            exit 0
          fi

          git commit -m "Ensure results map covers all symbols"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            sleep 5
          done

          exit 1
