name: Update Stocks Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5" # 18:00 IST, Monday-Friday

concurrency:
  group: market-data-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Organize existing stock data into A-Z folders
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import re

          data_dir = Path("data")
          data_dir.mkdir(exist_ok=True)

          protected_files = {
              "symbols.json",
              "indices.json",
              "price-bands.json",
              "price-band-changes.json",
              "results.json",
              "fii_dii.json",
              "market_sentiment.json",
          }

          def bucket(symbol):
              first = symbol[:1].upper()
              return first if re.fullmatch(r"[A-Z]", first) else "0-9"

          moved = 0
          skipped = 0

          for src in data_dir.glob("*.json"):
              if src.name in protected_files:
                  print(f"PROTECTED: {src}")
                  skipped += 1
                  continue

              symbol = src.stem.upper()

              if not re.fullmatch(r"[A-Z0-9._-]+", symbol):
                  print(f"SKIP INVALID STOCK NAME: {src}")
                  continue

              dest_dir = data_dir / bucket(symbol)
              dest_dir.mkdir(exist_ok=True)
              dest = dest_dir / src.name

              if src.resolve() != dest.resolve():
                  shutil.move(str(src), str(dest))
                  moved += 1

          print(f"Moved existing stock JSON files: {moved}")
          print(f"Protected non-stock files: {skipped}")
          PY

      - name: Download stock market data
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from datetime import datetime, timezone

          import pandas as pd
          import yfinance as yf

          DATA_DIR = Path("data")
          DATA_DIR.mkdir(exist_ok=True)

          with open("symbols.txt", "r", encoding="utf-8") as f:
              symbols = list(dict.fromkeys(
                  line.strip().upper()
                  for line in f
                  if line.strip()
              ))

          print(f"Found {len(symbols)} unique stock symbols")

          def bucket(symbol):
              first = symbol[:1].upper()
              return first if re.fullmatch(r"[A-Z]", first) else "0-9"

          def get_latest_date(df):
              if df is None or df.empty:
                  return None

              try:
                  dates = pd.to_datetime(df.index)

                  if getattr(dates, "tz", None) is not None:
                      dates = dates.tz_localize(None)

                  return dates.max().strftime("%Y-%m-%d")
              except Exception:
                  return None

          def normalize_dataframe(df, ticker):
              if df is None or df.empty:
                  return None

              if isinstance(df.columns, pd.MultiIndex):
                  try:
                      level0 = df.columns.get_level_values(0)
                      level1 = df.columns.get_level_values(1)

                      if ticker in level0:
                          df = df[ticker].copy()

                      elif ticker in level1:
                          df = df.xs(
                              ticker,
                              axis=1,
                              level=1
                          ).copy()

                  except Exception:
                      pass

              return df

          def save_candles(symbol, stock_df, dest_dir):
              if stock_df is None or stock_df.empty:
                  return 0

              candles = []

              for dt, row in stock_df.iterrows():
                  try:
                      close = float(row["Close"])

                      if pd.isna(close) or close <= 0:
                          continue

                      open_price = float(row["Open"])
                      high = float(row["High"])
                      low = float(row["Low"])
                      volume = int(float(row["Volume"]))

                      if any(
                          pd.isna(x)
                          for x in [
                              open_price,
                              high,
                              low
                          ]
                      ):
                          continue

                      timestamp = pd.Timestamp(dt)

                      if timestamp.tzinfo is not None:
                          timestamp = timestamp.tz_localize(None)

                      candles.append({
                          "time": timestamp.strftime("%Y-%m-%d"),
                          "open": round(open_price, 2),
                          "high": round(high, 2),
                          "low": round(low, 2),
                          "close": round(close, 2),
                          "volume": volume
                      })

                  except Exception:
                      continue

              if not candles:
                  return 0

              unique = {
                  item["time"]: item
                  for item in candles
              }

              candles = [
                  unique[key]
                  for key in sorted(unique)
              ]

              dest_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              output = dest_dir / f"{symbol}.json"

              with open(
                  output,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      candles,
                      f,
                      separators=(",", ":")
                  )

              return len(candles)

          def download_batch(tickers):
              """
              Download one 5-year batch.

              threads=False is intentional.
              This avoids unreliable parallel Yahoo responses
              where the latest trading session can occasionally
              be missing for some tickers.
              """

              for attempt in range(1, 4):

                  try:
                      print(
                          f"Batch download attempt "
                          f"{attempt}/3"
                      )

                      downloaded = yf.download(
                          tickers=tickers,
                          period="5y",
                          interval="1d",
                          auto_adjust=False,
                          group_by="ticker",
                          threads=False,
                          progress=False,
                          timeout=90,
                      )

                      if (
                          downloaded is not None
                          and not downloaded.empty
                      ):
                          return downloaded

                      print(
                          "Batch returned no data."
                      )

                  except Exception as e:
                      print(
                          f"Batch error: {e}"
                      )

                  if attempt < 3:
                      time.sleep(5 * attempt)

              return None

          def download_single(symbol):
              """
              Individual fallback for a stock whose latest
              candle is missing from the batch response.
              """

              ticker = f"{symbol}.NS"

              for attempt in range(1, 4):

                  try:
                      print(
                          f"INDIVIDUAL RETRY: {symbol} "
                          f"(attempt {attempt}/3)"
                      )

                      stock = yf.Ticker(ticker)

                      df = stock.history(
                          period="5y",
                          interval="1d",
                          auto_adjust=False
                      )

                      if df is not None and not df.empty:
                          return df

                  except Exception as e:
                      print(
                          f"Individual error "
                          f"{symbol}: {e}"
                      )

                  if attempt < 3:
                      time.sleep(5 * attempt)

              return None

          # --------------------------------------------------------
          # Determine expected latest trading date.
          #
          # We first download batches normally. We don't hard-code
          # "today" because weekends and NSE holidays exist.
          #
          # The first successful batch gives us the latest date
          # currently available from Yahoo.
          # --------------------------------------------------------

          BATCH_SIZE = 50

          successful_batches = 0
          failed_batches = 0
          individual_retries = 0
          successful_stocks = 0
          failed_stocks = 0

          expected_latest_date = None

          for start in range(
              0,
              len(symbols),
              BATCH_SIZE
          ):

              batch = symbols[
                  start:start + BATCH_SIZE
              ]

              tickers = [
                  f"{symbol}.NS"
                  for symbol in batch
              ]

              print("\n" + "=" * 70)
              print(
                  f"Batch "
                  f"{start // BATCH_SIZE + 1}: "
                  f"{start + 1}-"
                  f"{start + len(batch)} / "
                  f"{len(symbols)}"
              )
              print("=" * 70)

              downloaded = download_batch(tickers)

              if (
                  downloaded is None
                  or downloaded.empty
              ):
                  print(
                      "BATCH FAILED: "
                      "No data returned."
                  )

                  failed_batches += 1

                  # Try every stock individually if the entire
                  # batch failed.
                  for symbol in batch:

                      stock_df = download_single(symbol)

                      if stock_df is None:
                          print(
                              f"FAILED: {symbol}"
                          )
                          failed_stocks += 1
                          continue

                      count = save_candles(
                          symbol,
                          stock_df,
                          DATA_DIR / bucket(symbol)
                      )

                      latest = get_latest_date(
                          stock_df
                      )

                      print(
                          f"INDIVIDUAL SUCCESS: "
                          f"{symbol} -> "
                          f"{count} candles, "
                          f"latest={latest}"
                      )

                      successful_stocks += 1
                      individual_retries += 1

                  continue

              successful_batches += 1

              # ----------------------------------------------------
              # First determine latest date returned by Yahoo.
              # ----------------------------------------------------

              batch_latest_dates = []

              for symbol in batch:

                  ticker = f"{symbol}.NS"

                  try:
                      stock_df = normalize_dataframe(
                          downloaded,
                          ticker
                      )

                      latest = get_latest_date(
                          stock_df
                      )

                      if latest:
                          batch_latest_dates.append(
                              latest
                          )

                  except Exception:
                      pass

              if batch_latest_dates:
                  batch_latest = max(
                      batch_latest_dates
                  )

                  if expected_latest_date is None:
                      expected_latest_date = (
                          batch_latest
                      )

                  print(
                      f"Yahoo batch latest date: "
                      f"{batch_latest}"
                  )

                  print(
                      f"Reference latest date: "
                      f"{expected_latest_date}"
                  )

              # ----------------------------------------------------
              # Save each stock.
              #
              # Stocks not containing the batch latest date will
              # be individually retried.
              # ----------------------------------------------------

              for symbol in batch:

                  ticker = f"{symbol}.NS"

                  try:
                      stock_df = normalize_dataframe(
                          downloaded,
                          ticker
                      )

                      latest = get_latest_date(
                          stock_df
                      )

                      # ------------------------------------------------
                      # No data for ticker
                      # ------------------------------------------------
                      if stock_df is None or stock_df.empty:

                          print(
                              f"NO DATA: {symbol}"
                          )

                          retry_df = download_single(
                              symbol
                          )

                          if (
                              retry_df is not None
                              and not retry_df.empty
                          ):
                              retry_latest = (
                                  get_latest_date(
                                      retry_df
                                  )
                              )

                              count = save_candles(
                                  symbol,
                                  retry_df,
                                  DATA_DIR / bucket(symbol)
                              )

                              print(
                                  f"RETRY SUCCESS: "
                                  f"{symbol} -> "
                                  f"{count} candles, "
                                  f"latest={retry_latest}"
                              )

                              successful_stocks += 1
                              individual_retries += 1

                          else:
                              print(
                                  f"FAILED: {symbol}"
                              )
                              failed_stocks += 1

                          continue

                      # ------------------------------------------------
                      # Latest date missing from batch
                      # ------------------------------------------------
                      if (
                          expected_latest_date
                          and latest
                          and latest
                          < expected_latest_date
                      ):

                          print(
                              f"STALE DATA: {symbol} "
                              f"-> {latest} "
                              f"(expected "
                              f"{expected_latest_date})"
                          )

                          print(
                              "Starting individual retry..."
                          )

                          retry_df = download_single(
                              symbol
                          )

                          if (
                              retry_df is not None
                              and not retry_df.empty
                          ):

                              retry_latest = (
                                  get_latest_date(
                                      retry_df
                                  )
                              )

                              if (
                                  retry_latest
                                  and retry_latest
                                  > latest
                              ):

                                  stock_df = retry_df
                                  latest = retry_latest

                                  individual_retries += 1

                                  print(
                                      f"RETRY FIXED: "
                                      f"{symbol} -> "
                                      f"{latest}"
                                  )

                              else:

                                  print(
                                      f"RETRY DID NOT "
                                      f"IMPROVE: "
                                      f"{symbol} -> "
                                      f"{retry_latest}"
                                  )

                      # ------------------------------------------------
                      # Save data
                      # ------------------------------------------------

                      count = save_candles(
                          symbol,
                          stock_df,
                          DATA_DIR / bucket(symbol)
                      )

                      if count:
                          print(
                              f"SUCCESS: {symbol} -> "
                              f"{count} candles, "
                              f"latest={latest}"
                          )

                          successful_stocks += 1

                      else:
                          print(
                              f"NO VALID DATA: "
                              f"{symbol}"
                          )

                          failed_stocks += 1

                  except Exception as e:

                      print(
                          f"ERROR: {symbol} -> {e}"
                      )

                      failed_stocks += 1

              # Small delay between batches
              time.sleep(2)

          # --------------------------------------------------------
          # FINAL SUMMARY
          # --------------------------------------------------------

          print("\n")
          print("=" * 70)
          print("STOCK DOWNLOAD COMPLETE")
          print("=" * 70)
          print(
              f"Total symbols       : {len(symbols)}"
          )
          print(
              f"Successful batches  : {successful_batches}"
          )
          print(
              f"Failed batches      : {failed_batches}"
          )
          print(
              f"Successful stocks   : {successful_stocks}"
          )
          print(
              f"Failed stocks       : {failed_stocks}"
          )
          print(
              f"Individual retries  : {individual_retries}"
          )
          print(
              f"Reference latest    : "
              f"{expected_latest_date}"
          )
          print("=" * 70)

          PY

      - name: Show stock data summary
        run: |
          echo "Stock JSON files:"
          find data \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name "*.json" \
            ! -path "data/indices/*" \
            | wc -l

      - name: Verify latest stock dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          data_dir = Path("data")

          latest_dates = Counter()
          total = 0
          invalid = 0

          protected = {
              "symbols.json",
              "indices.json",
              "price-bands.json",
              "price-band-changes.json",
              "results.json",
              "fii_dii.json",
              "market_sentiment.json",
          }

          print("")
          print("=" * 70)
          print("FINAL STOCK DATA DATE VERIFICATION")
          print("=" * 70)

          for path in sorted(data_dir.glob("*/*.json")):

              if path.name in protected:
                  continue

              if path.parent.name == "indices":
                  continue

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

                  if (
                      not isinstance(data, list)
                      or not data
                  ):
                      invalid += 1
                      print(
                          f"INVALID/EMPTY: {path}"
                      )
                      continue

                  dates = [
                      item.get("time")
                      for item in data
                      if isinstance(item, dict)
                      and item.get("time")
                  ]

                  if not dates:
                      invalid += 1
                      print(
                          f"NO DATE: {path}"
                      )
                      continue

                  latest = max(dates)

                  latest_dates[latest] += 1
                  total += 1

              except Exception as e:
                  invalid += 1
                  print(
                      f"VERIFY ERROR: "
                      f"{path}: {e}"
                  )

          print("")
          print(
              f"Valid stock files : {total}"
          )
          print(
              f"Invalid/empty     : {invalid}"
          )

          print("")
          print("Latest date distribution:")

          for date, count in (
              latest_dates
              .most_common(10)
          ):
              print(
                  f"  {date}: {count} stocks"
              )

          print("=" * 70)
          PY

      - name: Commit and push stock data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git reset -- \
            data/symbols.json \
            data/indices.json \
            data/price-bands.json \
            data/price-band-changes.json \
            data/results.json \
            data/fii_dii.json \
            data/market_sentiment.json \
            2>/dev/null || true

          git reset -- \
            data/P/price-bands.json \
            data/P/price-band-changes.json \
            data/R/results.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No stock data changes."
            exit 0
          fi

          git commit -m "Update stock market data"

          for attempt in 1 2 3 4 5; do

            echo "Push attempt $attempt/5..."

            git fetch origin main

            if git rebase origin/main; then

              if git push origin main; then
                echo "Stock data push successful."
                exit 0
              fi

            else

              echo "Rebase failed. Aborting and retrying..."

              git rebase --abort || true

            fi

            sleep 5

          done

          echo "ERROR: Could not push stock data after 5 attempts."
          exit 1
