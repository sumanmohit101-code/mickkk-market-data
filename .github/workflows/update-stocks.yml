name: Update Stocks Market Data on: workflow_dispatch: schedule: - cron: "30 11 * * 1-5" # 17:00 IST, Monday-Friday concurrency: group: market-data-main cancel-in-progress: false permissions: contents: write jobs: update-stocks: runs-on: ubuntu-latest timeout-minutes: 120 steps: - name: Checkout repository uses: actions/checkout@v4 with: fetch-depth: 0 - name: Setup Python uses: actions/setup-python@v5 with: python-version: "3.12" - name: Install dependencies run: | python -m pip install --upgrade pip pip install yfinance pandas - name: Organize existing stock data into A-Z folders run: | python - <<'PY' from pathlib import Path import shutil import re data_dir = Path("data") data_dir.mkdir(exist_ok=True) protected_files = { "symbols.json", "indices.json", "price-bands.json", "price-band-changes.json", "results.json", "fii_dii.json", "market_sentiment.json", } def bucket(symbol): first = symbol[:1].upper() return first if re.fullmatch(r"[A-Z]", first) else "0-9" moved = 0 skipped = 0 for src in data_dir.glob("*.json"): if src.name in protected_files: print(f"PROTECTED: {src}") skipped += 1 continue symbol = src.stem.upper() if not re.fullmatch(r"[A-Z0-9._-]+", symbol): print(f"SKIP INVALID STOCK NAME: {src}") continue dest_dir = data_dir / bucket(symbol) dest_dir.mkdir(exist_ok=True) dest = dest_dir / src.name if src.resolve() != dest.resolve(): shutil.move(str(src), str(dest)) moved += 1 print(f"Moved existing stock JSON files: {moved}") print(f"Protected non-stock files: {skipped}") PY - name: Download stock market data run: | python - <<'PY' import json import re import time from pathlib import Path import pandas as pd import yfinance as yf DATA_DIR = Path("data") DATA_DIR.mkdir(exist_ok=True) with open("symbols.txt", "r", encoding="utf-8") as f: symbols = list(dict.fromkeys( line.strip().upper() for line in f if line.strip() )) print(f"Found {len(symbols)} unique stock symbols") def bucket(symbol): first = symbol[:1].upper() return first if re.fullmatch(r"[A-Z]", first) else "0-9" def save_candles(symbol, stock_df, dest_dir): if stock_df is None or stock_df.empty: return 0 candles = [] for dt, row in stock_df.iterrows(): try: close = float(row["Close"]) if pd.isna(close) or close <= 0: continue open_price = float(row["Open"]) high = float(row["High"]) low = float(row["Low"]) volume = int(float(row["Volume"])) if any(pd.isna(x) for x in [open_price, high, low]): continue candles.append({ "time": pd.Timestamp(dt).strftime("%Y-%m-%d"), "open": round(open_price, 2), "high": round(high, 2), "low": round(low, 2), "close": round(close, 2), "volume": volume }) except Exception: continue if not candles: return 0 unique = {item["time"]: item for item in candles} candles = [unique[key] for key in sorted(unique)] dest_dir.mkdir(parents=True, exist_ok=True) output = dest_dir / f"{symbol}.json" with open(output, "w", encoding="utf-8") as f: json.dump(candles, f, separators=(",", ":")) return len(candles) BATCH_SIZE = 50 for start in range(0, len(symbols), BATCH_SIZE): batch = symbols[start:start + BATCH_SIZE] tickers = [f"{symbol}.NS" for symbol in batch] print("\n" + "=" * 70) print( f"Batch {start // BATCH_SIZE + 1}: " f"{start + 1}-{start + len(batch)} / {len(symbols)}" ) print("=" * 70) downloaded = None for attempt in range(1, 4): try: downloaded = yf.download( tickers=tickers, period="5y", interval="1d", auto_adjust=False, group_by="ticker", threads=True, progress=False, timeout=60, ) if downloaded is not None and not downloaded.empty: break print(f"Batch returned no data, attempt {attempt}/3") except Exception as e: print(f"Batch error on attempt {attempt}/3: {e}") time.sleep(5 * attempt) if downloaded is None or downloaded.empty: print("BATCH FAILED: no data returned") continue for symbol in batch: ticker = f"{symbol}.NS" try: if isinstance(downloaded.columns, pd.MultiIndex): level0 = downloaded.columns.get_level_values(0) level1 = downloaded.columns.get_level_values(1) if ticker in level0: stock_df = downloaded[ticker].copy() elif ticker in level1: stock_df = downloaded.xs( ticker, axis=1, level=1 ).copy() else: print(f"NO DATA: {symbol}") continue else: stock_df = downloaded.copy() count = save_candles( symbol, stock_df, DATA_DIR / bucket(symbol) ) if count: print(f"SUCCESS: {symbol} -> {count} candles") else: print(f"NO VALID DATA: {symbol}") except Exception as e: print(f"ERROR: {symbol} -> {e}") time.sleep(2) print("\nFinished downloading stock market data.") PY - name: Show stock data summary run: | echo "Stock JSON files:" find data \ -mindepth 2 \ -maxdepth 2 \ -type f \ -name "*.json" \ ! -path "data/indices/*" \ | wc -l - name: Commit and push stock data run: | set -e git config user.name "github-actions[bot]" git config user.email "41898282+github-actions[bot]@users.noreply.github.com" # Stage generated files before any rebase. The previous workflow # tried to rebase while thousands of generated JSON files were # unstaged, which caused: "cannot rebase: You have unstaged changes." git add data/ git reset -- \ data/symbols.json \ data/indices.json \ data/price-bands.json \ data/price-band-changes.json \ data/results.json \ data/fii_dii.json \ data/market_sentiment.json \ 2>/dev/null || true git reset -- \ data/P/price-bands.json \ data/P/price-band-changes.json \ data/R/results.json \ 2>/dev/null || true if git diff --cached --quiet; then echo "No stock data changes." exit 0 fi git commit -m "Update stock market data" for attempt in 1 2 3 4 5; do echo "Push attempt $attempt/5..." git fetch origin main if git rebase origin/main; then if git push origin main; then echo "Stock data push successful." exit 0 fi else echo "Rebase failed. Aborting and retrying..." git rebase --abort || true fi sleep 5 done echo "ERROR: Could not push stock data after 5 attempts." exit 1
