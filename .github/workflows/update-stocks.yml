name: Update Stocks Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5" # 18:00 IST, Monday-Friday

concurrency:
  group: market-data-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      # ------------------------------------------------------------
      # ORGANIZE EXISTING STOCK FILES
      # ------------------------------------------------------------
      - name: Organize existing stock data into A-Z folders
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import re

          data_dir = Path("data")
          data_dir.mkdir(exist_ok=True)

          protected_files = {
              "symbols.json",
              "indices.json",
              "price-bands.json",
              "price-band-changes.json",
              "results.json",
              "fii_dii.json",
              "market_sentiment.json",
          }

          def bucket(symbol):
              first = symbol[:1].upper()
              return first if re.fullmatch(r"[A-Z]", first) else "0-9"

          moved = 0
          skipped = 0

          for src in data_dir.glob("*.json"):

              if src.name in protected_files:
                  print(f"PROTECTED: {src}")
                  skipped += 1
                  continue

              symbol = src.stem.upper()

              if not re.fullmatch(r"[A-Z0-9._-]+", symbol):
                  print(f"SKIP INVALID STOCK NAME: {src}")
                  continue

              dest_dir = data_dir / bucket(symbol)
              dest_dir.mkdir(exist_ok=True)

              dest = dest_dir / src.name

              if src.resolve() != dest.resolve():
                  shutil.move(str(src), str(dest))
                  moved += 1

          print(f"Moved existing stock JSON files: {moved}")
          print(f"Protected non-stock files: {skipped}")
          PY

      # ------------------------------------------------------------
      # INCREMENTAL STOCK DATA UPDATE
      #
      # Existing stock:
      #   Fetch only last 15 calendar days
      #   Merge with existing history
      #
      # Missing stock JSON:
      #   Fetch complete 5 years
      #
      # Latest date is verified and retried.
      # ------------------------------------------------------------
      - name: Download and update stock market data
        run: |
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from datetime import datetime, timedelta

          import pandas as pd
          import yfinance as yf


          DATA_DIR = Path("data")
          DATA_DIR.mkdir(exist_ok=True)

          SYMBOLS_FILE = Path("symbols.txt")

          if not SYMBOLS_FILE.exists():
              raise SystemExit("ERROR: symbols.txt not found")

          with open(SYMBOLS_FILE, "r", encoding="utf-8") as f:
              symbols = list(dict.fromkeys(
                  line.strip().upper()
                  for line in f
                  if line.strip()
              ))

          print(f"Found {len(symbols)} unique stock symbols")


          def bucket(symbol):
              first = symbol[:1].upper()
              return first if re.fullmatch(r"[A-Z]", first) else "0-9"


          def output_path(symbol):
              return DATA_DIR / bucket(symbol) / f"{symbol}.json"


          def load_existing(symbol):
              path = output_path(symbol)

              if not path.exists():
                  return []

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if not isinstance(data, list):
                      print(f"INVALID EXISTING DATA: {symbol}")
                      return []

                  return data

              except Exception as e:
                  print(f"ERROR READING {symbol}: {e}")
                  return []


          def normalize_candles(stock_df):
              if stock_df is None or stock_df.empty:
                  return []

              candles = []

              for dt, row in stock_df.iterrows():
                  try:
                      close = float(row["Close"])

                      if pd.isna(close) or close <= 0:
                          continue

                      open_price = float(row["Open"])
                      high = float(row["High"])
                      low = float(row["Low"])
                      volume = int(float(row["Volume"]))

                      if any(
                          pd.isna(x)
                          for x in [open_price, high, low]
                      ):
                          continue

                      timestamp = pd.Timestamp(dt)

                      # Remove timezone if present
                      if timestamp.tzinfo is not None:
                          timestamp = timestamp.tz_localize(None)

                      candles.append({
                          "time": timestamp.strftime("%Y-%m-%d"),
                          "open": round(open_price, 2),
                          "high": round(high, 2),
                          "low": round(low, 2),
                          "close": round(close, 2),
                          "volume": volume
                      })

                  except Exception:
                      continue

              unique = {
                  item["time"]: item
                  for item in candles
              }

              return [
                  unique[key]
                  for key in sorted(unique)
              ]


          def save_merged(symbol, existing, new_candles):
              merged = {}

              # Existing history first
              for item in existing:
                  try:
                      date = item["time"]

                      if date:
                          merged[date] = item

                  except Exception:
                      continue

              # New data replaces old data for same date
              for item in new_candles:
                  merged[item["time"]] = item

              final_data = [
                  merged[key]
                  for key in sorted(merged)
              ]

              if not final_data:
                  return 0

              path = output_path(symbol)
              path.parent.mkdir(parents=True, exist_ok=True)

              temp_path = path.with_suffix(".json.tmp")

              with open(temp_path, "w", encoding="utf-8") as f:
                  json.dump(
                      final_data,
                      f,
                      separators=(",", ":")
                  )

              temp_path.replace(path)

              return len(final_data)


          def fetch_incremental(symbol):
              """
              Existing stock:
              Fetch last 15 calendar days.
              """

              ticker = f"{symbol}.NS"

              for attempt in range(1, 4):

                  try:
                      print(
                          f"  Incremental fetch {symbol} "
                          f"(attempt {attempt}/3)"
                      )

                      df = yf.download(
                          ticker,
                          period="15d",
                          interval="1d",
                          auto_adjust=False,
                          progress=False,
                          threads=False,
                          timeout=60,
                      )

                      if df is None or df.empty:
                          print("  No incremental data returned")
                          time.sleep(5 * attempt)
                          continue

                      # yfinance can sometimes return MultiIndex columns
                      if isinstance(df.columns, pd.MultiIndex):
                          try:
                              if ticker in df.columns.get_level_values(1):
                                  df = df.xs(
                                      ticker,
                                      axis=1,
                                      level=1
                                  )
                              elif ticker in df.columns.get_level_values(0):
                                  df = df[ticker]
                          except Exception:
                              pass

                      candles = normalize_candles(df)

                      if candles:
                          return candles

                      print("  No valid candles returned")

                  except Exception as e:
                      print(
                          f"  Incremental error for {symbol}: {e}"
                      )

                  time.sleep(5 * attempt)

              return []


          def fetch_full_history(symbol):
              """
              New stock:
              Fetch complete 5 years of daily history.
              """

              ticker = f"{symbol}.NS"

              for attempt in range(1, 4):

                  try:
                      print(
                          f"  FULL HISTORY fetch {symbol} "
                          f"(attempt {attempt}/3)"
                      )

                      df = yf.download(
                          ticker,
                          period="5y",
                          interval="1d",
                          auto_adjust=False,
                          progress=False,
                          threads=False,
                          timeout=60,
                      )

                      if df is None or df.empty:
                          print("  No full history returned")
                          time.sleep(5 * attempt)
                          continue

                      if isinstance(df.columns, pd.MultiIndex):
                          try:
                              if ticker in df.columns.get_level_values(1):
                                  df = df.xs(
                                      ticker,
                                      axis=1,
                                      level=1
                                  )
                              elif ticker in df.columns.get_level_values(0):
                                  df = df[ticker]
                          except Exception:
                              pass

                      candles = normalize_candles(df)

                      if candles:
                          return candles

                      print("  No valid full-history candles")

                  except Exception as e:
                      print(
                          f"  Full history error for {symbol}: {e}"
                      )

                  time.sleep(5 * attempt)

              return []


          def fetch_latest_single(symbol):
              """
              Final fallback:
              Fetch recent data for one ticker using Ticker.history().
              """

              ticker = f"{symbol}.NS"

              for attempt in range(1, 4):

                  try:
                      print(
                          f"  SINGLE-TICKER RETRY {symbol} "
                          f"(attempt {attempt}/3)"
                      )

                      stock = yf.Ticker(ticker)

                      df = stock.history(
                          period="15d",
                          interval="1d",
                          auto_adjust=False
                      )

                      if df is None or df.empty:
                          print("  Single ticker returned no data")
                          time.sleep(5 * attempt)
                          continue

                      candles = normalize_candles(df)

                      if candles:
                          return candles

                  except Exception as e:
                      print(
                          f"  Single ticker error for {symbol}: {e}"
                      )

                  time.sleep(5 * attempt)

              return []


          # --------------------------------------------------------
          # PROCESS STOCKS ONE BY ONE
          #
          # We intentionally do NOT download 5 years every day.
          # --------------------------------------------------------

          updated = 0
          full_downloads = 0
          retries = 0
          failed = 0

          today = datetime.utcnow().date()

          print("\n" + "=" * 70)
          print("INCREMENTAL STOCK DATA UPDATE")
          print("=" * 70)
          print(f"UTC date: {today}")
          print("Existing stocks -> last 15 days")
          print("Missing stocks  -> full 5 years")
          print("=" * 70)


          for index, symbol in enumerate(symbols, start=1):

              print(
                  f"\n[{index}/{len(symbols)}] {symbol}"
              )

              existing = load_existing(symbol)

              path = output_path(symbol)

              # ----------------------------------------------------
              # CASE 1: Existing historical data
              # ----------------------------------------------------
              if path.exists() and existing:

                  print(
                      f"  Existing candles: {len(existing)}"
                  )

                  old_dates = [
                      item.get("time")
                      for item in existing
                      if item.get("time")
                  ]

                  old_latest = (
                      max(old_dates)
                      if old_dates
                      else "NONE"
                  )

                  print(
                      f"  Existing latest date: {old_latest}"
                  )

                  new_candles = fetch_incremental(symbol)

                  if not new_candles:
                      print(
                          f"  WARNING: No new data for {symbol}"
                      )
                      failed += 1
                      continue

                  new_latest = max(
                      item["time"]
                      for item in new_candles
                  )

                  print(
                      f"  Incremental latest date: {new_latest}"
                  )

                  # ------------------------------------------------
                  # IMPORTANT:
                  #
                  # If Yahoo gives an older date, do a dedicated
                  # single-ticker retry.
                  # ------------------------------------------------

                  if old_latest >= new_latest:

                      print(
                          "  Latest date did not advance."
                      )

                      retry_candles = fetch_latest_single(symbol)

                      if retry_candles:
                          retry_latest = max(
                              item["time"]
                              for item in retry_candles
                          )

                          print(
                              f"  Retry latest date: "
                              f"{retry_latest}"
                          )

                          if retry_latest > old_latest:
                              new_candles = retry_candles
                              new_latest = retry_latest
                              retries += 1
                          else:
                              print(
                                  f"  No newer candle found "
                                  f"for {symbol}"
                              )

                      else:
                          print(
                              "  Single ticker retry failed."
                          )

                  count = save_merged(
                      symbol,
                      existing,
                      new_candles
                  )

                  print(
                      f"  SAVED: {symbol} -> "
                      f"{count} total candles"
                  )

                  updated += 1

              # ----------------------------------------------------
              # CASE 2: No existing stock history
              # ----------------------------------------------------
              else:

                  print(
                      "  No existing history found."
                  )

                  print(
                      "  Downloading complete 5-year history..."
                  )

                  candles = fetch_full_history(symbol)

                  if not candles:
                      print(
                          f"  FAILED FULL DOWNLOAD: {symbol}"
                      )
                      failed += 1
                      continue

                  count = save_merged(
                      symbol,
                      [],
                      candles
                  )

                  latest = max(
                      item["time"]
                      for item in candles
                  )

                  print(
                      f"  FULL HISTORY SAVED: {symbol}"
                  )
                  print(
                      f"  Candles: {count}"
                  )
                  print(
                      f"  Latest: {latest}"
                  )

                  full_downloads += 1

              # Small delay to reduce Yahoo request pressure
              time.sleep(0.5)


          # --------------------------------------------------------
          # FINAL SUMMARY
          # --------------------------------------------------------

          print("\n")
          print("=" * 70)
          print("STOCK UPDATE COMPLETE")
          print("=" * 70)
          print(f"Stocks processed      : {len(symbols)}")
          print(f"Stocks updated        : {updated}")
          print(f"Full history downloads: {full_downloads}")
          print(f"Latest-date retries   : {retries}")
          print(f"Failed stocks         : {failed}")
          print("=" * 70)

          if failed:
              print(
                  f"WARNING: {failed} stock(s) could not be updated."
              )

          PY

      # ------------------------------------------------------------
      # VERIFY FINAL STOCK DATA
      # ------------------------------------------------------------
      - name: Verify latest stock dates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          data_dir = Path("data")

          total = 0
          missing = 0
          latest_dates = Counter()

          print("")
          print("=" * 70)
          print("FINAL STOCK DATA VERIFICATION")
          print("=" * 70)

          for path in sorted(data_dir.glob("*/*.json")):

              if path.parent.name in {
                  "indices",
                  ".git",
              }:
                  continue

              if path.name in {
                  "symbols.json",
                  "indices.json",
                  "price-bands.json",
                  "price-band-changes.json",
                  "results.json",
                  "fii_dii.json",
                  "market_sentiment.json",
              }:
                  continue

              try:
                  with open(path, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  if not isinstance(data, list) or not data:
                      print(
                          f"EMPTY/INVALID: {path}"
                      )
                      missing += 1
                      continue

                  dates = [
                      item.get("time")
                      for item in data
                      if item.get("time")
                  ]

                  if not dates:
                      print(
                          f"NO DATES: {path}"
                      )
                      missing += 1
                      continue

                  latest = max(dates)

                  total += 1
                  latest_dates[latest] += 1

              except Exception as e:
                  print(
                      f"VERIFY ERROR: {path}: {e}"
                  )
                  missing += 1

          print("")
          print(f"Valid stock files: {total}")
          print(f"Invalid/empty     : {missing}")
          print("")
          print("Latest date distribution:")

          for date, count in latest_dates.most_common(10):
              print(
                  f"  {date}: {count} stocks"
              )

          print("=" * 70)

          if missing:
              print(
                  "WARNING: Some stock files are invalid or empty."
              )
          PY

      # ------------------------------------------------------------
      # SHOW STOCK DATA SUMMARY
      # ------------------------------------------------------------
      - name: Show stock data summary
        run: |
          echo "Stock JSON files:"
          find data \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name "*.json" \
            ! -path "data/indices/*" \
            | wc -l

      # ------------------------------------------------------------
      # COMMIT AND PUSH
      # ------------------------------------------------------------
      - name: Commit and push stock data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git reset -- \
            data/symbols.json \
            data/indices.json \
            data/price-bands.json \
            data/price-band-changes.json \
            data/results.json \
            data/fii_dii.json \
            data/market_sentiment.json \
            2>/dev/null || true

          git reset -- \
            data/P/price-bands.json \
            data/P/price-band-changes.json \
            data/R/results.json \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No stock data changes."
            exit 0
          fi

          git commit -m "Update stock market data"

          for attempt in 1 2 3 4 5; do

            echo "Push attempt $attempt/5..."

            git fetch origin main

            if git rebase origin/main; then

              if git push origin main; then
                echo "Stock data push successful."
                exit 0
              fi

            else

              echo "Rebase failed. Aborting and retrying..."

              git rebase --abort || true

            fi

            sleep 5

          done

          echo "ERROR: Could not push stock data after 5 attempts."
          exit 1
