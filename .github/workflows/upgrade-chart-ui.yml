name: Upgrade GitHub Charts UI

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/upgrade-chart-ui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.event.head_commit.message != 'Apply GitHub Charts UI [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject GitHub Charts features
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          marker = "<!-- MICKKK_GITHUB_UI_V2 -->"
          if marker in html:
              print("Charts UI already upgraded.")
              raise SystemExit(0)

          css = r'''
          <style>
          /* MICKKK_GITHUB_UI_V2 */
          .gh-watch-toggle{position:fixed;right:12px;top:56px;z-index:600;background:var(--card);border:1px solid var(--border);color:var(--accent);padding:6px 10px;border-radius:6px;font:700 11px var(--mono);cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.35)}
          .gh-watch-toggle:hover{border-color:var(--accent);background:rgba(0,212,255,.08)}
          .gh-watch-panel{position:fixed;right:0;top:48px;bottom:24px;width:320px;z-index:590;background:rgba(14,19,24,.98);border-left:1px solid var(--border);box-shadow:-15px 0 35px rgba(0,0,0,.35);display:none;flex-direction:column;backdrop-filter:blur(12px)}
          .gh-watch-panel.open{display:flex}
          body.light-theme .gh-watch-panel{background:rgba(255,255,255,.98)}
          .gh-watch-head{padding:9px 10px;border-bottom:1px solid var(--border);display:flex;gap:5px;align-items:center}
          .gh-watch-head select{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 7px;font:700 11px var(--mono)}
          .gh-watch-head button,.gh-watch-actions button{background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:5px;cursor:pointer}
          .gh-watch-head button{width:28px;height:28px}
          .gh-watch-head button:hover,.gh-watch-actions button:hover{color:var(--accent);border-color:var(--accent)}
          .gh-watch-actions{display:flex;gap:5px;padding:7px 10px;border-bottom:1px solid var(--border)}
          .gh-watch-actions button{flex:1;padding:5px 6px;font:600 10px var(--font)}
          .gh-watch-body{flex:1;overflow:auto;padding:7px}
          .gh-watch-title{display:flex;justify-content:space-between;align-items:center;color:var(--accent);font:700 10.5px var(--mono);padding:4px 3px 7px}
          .gh-watch-item{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:5px;cursor:pointer}
          .gh-watch-item:hover{background:var(--card2)}
          .gh-watch-item.active{background:rgba(0,212,255,.08);border-left:2px solid var(--accent)}
          .gh-watch-item .sym{font:700 10.5px var(--mono);color:var(--text);min-width:76px}
          .gh-watch-item .nm{font:9px var(--font);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
          .gh-watch-item .rm{color:var(--muted);border:0;background:transparent;cursor:pointer;opacity:0}
          .gh-watch-item:hover .rm{opacity:1}.gh-watch-item .rm:hover{color:var(--red)}
          .gh-section{border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
          .gh-event-card{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:7px;margin-bottom:6px;font-size:10px}
          .gh-event-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.gh-event-row span:first-child{color:var(--muted)}.gh-event-row b{color:var(--text)}
          .gh-event-pill{display:inline-block;padding:1px 5px;border-radius:3px;background:rgba(255,171,0,.15);color:var(--amber);font:700 9px var(--mono)}
          .gh-alert{display:flex;align-items:center;justify-content:space-between;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:5px;font:10px var(--mono)}
          .gh-alert button{border:0;background:transparent;color:var(--muted);cursor:pointer}.gh-alert button:hover{color:var(--red)}
          .gh-fii-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.gh-fii-box{background:var(--card);border:1px solid var(--border);padding:6px;border-radius:6px;font:9.5px var(--mono)}
          .gh-fii-box b{display:block;color:var(--text);margin-bottom:2px}.gh-muted{color:var(--muted);font-size:9px;line-height:1.4}.gh-empty{padding:12px;text-align:center;color:var(--muted);font-size:10px}
          .gh-modal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}.gh-modal.open{display:flex}.gh-modal-box{width:min(720px,92vw);max-height:80vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
          .gh-modal-row{display:flex;justify-content:space-between;gap:8px;padding:6px;border-bottom:1px solid var(--border);font:9px var(--mono)}
          @media(max-width:860px){.gh-watch-panel{width:min(320px,86vw)}.gh-watch-toggle{top:54px;right:8px}}
          </style>
          '''

          ui = r'''
          <button class="gh-watch-toggle" id="gh-watch-toggle" onclick="ghTogglePanel()">☷ Lists & Events</button>
          <aside class="gh-watch-panel" id="gh-watch-panel">
            <div class="gh-watch-head">
              <select id="gh-watch-select" onchange="ghSelectList(this.value)"></select>
              <button onclick="ghAddList()" title="New watchlist">＋</button>
              <button onclick="ghRenameList()" title="Rename">✎</button>
              <button onclick="ghDeleteList()" title="Delete">×</button>
              <button onclick="ghTogglePanel(false)" title="Hide">›</button>
            </div>
            <div class="gh-watch-actions">
              <button onclick="ghAddCurrent()">＋ Current</button>
              <button onclick="ghSetAlert()">🔔 Alert</button>
              <button onclick="ghShowAlerts()">📋 Alerts</button>
            </div>
            <div class="gh-watch-body">
              <div class="gh-watch-title"><span>WATCHLIST</span><span id="gh-watch-count"></span></div>
              <div id="gh-watch-items"></div>
              <div class="gh-section">
                <div class="gh-watch-title"><span>CORPORATE EVENTS</span><span id="gh-event-status"></span></div>
                <div id="gh-event-summary"></div>
              </div>
              <div class="gh-section">
                <div class="gh-watch-title"><span>FII / DII</span><button class="tbtn" style="padding:2px 5px;font-size:9px" onclick="ghOpenFii()">History</button></div>
                <div id="gh-fii-summary"></div>
              </div>
              <div class="gh-section">
                <div class="gh-watch-title"><span>DATA SOURCE</span></div>
                <div class="gh-muted">Daily candles + symbols + corporate events + FII/DII are read directly from the GitHub repository. Alerts and watchlists are stored in this browser.</div>
              </div>
            </div>
          </aside>

          <div class="gh-modal" id="gh-fii-modal" onclick="if(event.target===this)ghCloseFii()">
            <div class="gh-modal-box">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font:700 13px var(--mono);color:var(--accent)">FII / DII HISTORY</b><button class="tbtn" onclick="ghCloseFii()">Close</button></div>
              <div id="gh-fii-history"></div>
            </div>
          </div>
          '''

          js = r'''
          <script>
          // MICKKK_GITHUB_UI_V2
          const GH_UI_BASE = (typeof GITHUB_DATA_BASE !== 'undefined') ? GITHUB_DATA_BASE : 'https://raw.githubusercontent.com/sumanmohit101-code/mickkk-market-data/main/data/';
          let ghWatchlists = JSON.parse(localStorage.getItem('MICKKK_GH_WATCHLISTS') || 'null');
          let ghActiveList = localStorage.getItem('MICKKK_GH_ACTIVE_LIST') || 'My Watchlist';
          let ghCorporate = null;
          let ghFii = null;
          let ghAlerts = JSON.parse(localStorage.getItem('MICKKK_GH_ALERTS') || '[]');
          let ghEventsEnabled = true;
          let ghOriginalSetMarkers = null;
          let ghEventMarkers = [];

          function ghSave(){ localStorage.setItem('MICKKK_GH_WATCHLISTS', JSON.stringify(ghWatchlists)); localStorage.setItem('MICKKK_GH_ACTIVE_LIST', ghActiveList); }
          function ghInitLists(){
            if (!Array.isArray(ghWatchlists) || !ghWatchlists.length) ghWatchlists = [{name:'My Watchlist',items:[]}];
            if (!ghWatchlists.some(x=>x.name===ghActiveList)) ghActiveList=ghWatchlists[0].name;
            ghSave(); ghRenderLists();
          }
          function ghCurrentList(){ return ghWatchlists.find(x=>x.name===ghActiveList) || ghWatchlists[0]; }
          function ghTogglePanel(force){ const p=document.getElementById('gh-watch-panel'); if(!p)return; const open=typeof force==='boolean'?force:!p.classList.contains('open'); p.classList.toggle('open',open); if(open){ghRenderLists();ghRenderEvents();ghRenderFii();} }
          function ghAddList(){ const n=prompt('Watchlist name:'); if(!n||!n.trim())return; if(ghWatchlists.some(x=>x.name.toLowerCase()===n.trim().toLowerCase()))return; ghWatchlists.push({name:n.trim(),items:[]}); ghActiveList=n.trim(); ghSave(); ghRenderLists(); }
          function ghRenameList(){ const w=ghCurrentList(); if(!w)return; const n=prompt('Rename watchlist:',w.name); if(!n||!n.trim())return; w.name=n.trim(); ghActiveList=w.name; ghSave(); ghRenderLists(); }
          function ghDeleteList(){ const w=ghCurrentList(); if(!w)return; if(!confirm('Delete watchlist “'+w.name+'”?'))return; ghWatchlists=ghWatchlists.filter(x=>x!==w); if(!ghWatchlists.length)ghWatchlists=[{name:'My Watchlist',items:[]}]; ghActiveList=ghWatchlists[0].name; ghSave(); ghRenderLists(); }
          function ghSelectList(n){ ghActiveList=n; ghSave(); ghRenderLists(); }
          function ghAddCurrent(){ if(!currentSymbol)return; const w=ghCurrentList(); if(!w)return; if(!w.items.some(x=>x.symbol===currentSymbol)) w.items.push({symbol:currentSymbol,name:currentName||currentSymbol}); ghSave(); ghRenderLists(); }
          function ghRemove(sym){ const w=ghCurrentList(); if(!w)return; w.items=w.items.filter(x=>x.symbol!==sym); ghSave(); ghRenderLists(); }
          function ghRenderLists(){
            const s=document.getElementById('gh-watch-select'), b=document.getElementById('gh-watch-items'), c=document.getElementById('gh-watch-count'); if(!s||!b)return;
            s.innerHTML=ghWatchlists.map(x=>`<option value="${escapeHtml(x.name)}" ${x.name===ghActiveList?'selected':''}>${escapeHtml(x.name)}</option>`).join('');
            const w=ghCurrentList(); const items=(w&&w.items)||[]; if(c)c.textContent=items.length;
            b.innerHTML=items.length?items.map(x=>`<div class="gh-watch-item ${x.symbol===currentSymbol?'active':''}" onclick="ghLoad('${escapeHtml(x.symbol)}')"><span class="sym">${escapeHtml(x.symbol)}</span><span class="nm">${escapeHtml(x.name||'')}</span><button class="rm" onclick="event.stopPropagation();ghRemove('${escapeHtml(x.symbol)}')">×</button></div>`).join(''):`<div class="gh-empty">No stocks yet.<br>Open a stock and press “＋ Current”.</div>`;
          }
          function ghLoad(sym){ const x=(allSymbols||[]).find(y=>y.symbol===sym); if(typeof loadSymbol==='function') loadSymbol(sym,x?x.name:sym); }

          async function ghJson(file){ const r=await fetch(`${GH_UI_BASE}${file}?v=${Date.now()}`); if(!r.ok)throw new Error(file+' '+r.status); return await r.json(); }
          function ghNormalizeSymbol(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
          function ghSymbolEvents(){
            if(!ghCorporate||!Array.isArray(ghCorporate.symbolWise))return null;
            const k=ghNormalizeSymbol(currentSymbol); return ghCorporate.symbolWise.find(x=>ghNormalizeSymbol(x.symbol)===k)||null;
          }
          function ghFormatDate(v){ if(!v)return '—'; const s=String(v).slice(0,10); const d=new Date(s+'T00:00:00'); return isNaN(d)?s:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
          function ghEventLabel(x){ const t=String(x.type||'').toUpperCase(); const p=String(x.purpose||x.description||'').toUpperCase(); if(t.includes('BOARD'))return 'BM'; if(t.includes('BULK'))return 'BD'; if(t.includes('BLOCK'))return 'BL'; if(p.includes('DIVIDEND'))return 'DIV'; if(p.includes('BONUS'))return 'BON'; if(p.includes('SPLIT'))return 'SPL'; if(p.includes('RIGHT'))return 'RT'; if(t.includes('RESULT'))return 'RES'; return 'EVT'; }
          function ghRenderEvents(){
            const el=document.getElementById('gh-event-summary'), st=document.getElementById('gh-event-status'); if(!el)return;
            const row=ghSymbolEvents(); if(!row){el.innerHTML='<div class="gh-empty">Corporate-event data not loaded yet.</div>';return;}
            const nextR=(row.upcomingResults||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)))[0];
            const lastR=row.lastResult;
            const future=[...(row.corporateActions||[]),...(row.boardMeetings||[]),...(row.bulkDeals||[]),...(row.blockDeals||[])].filter(x=>x&&x.date).sort((a,b)=>String(a.date).localeCompare(String(b.date))); const nextE=future.find(x=>String(x.date)>=new Date().toISOString().slice(0,10))||future[0];
            if(st)st.textContent='';
            el.innerHTML=`<div class="gh-event-card"><div class="gh-event-row"><span>Last Result</span><b>${lastR?ghFormatDate(lastR.resultDate):'—'}</b></div><div class="gh-event-row"><span>Next Result</span><b>${nextR?ghFormatDate(nextR.date):'—'}</b></div><div class="gh-event-row"><span>Next Event</span><b>${nextE?'<span class="gh-event-pill">'+ghEventLabel(nextE)+'</span> '+ghFormatDate(nextE.date):'—'}</b></div></div>`;
          }
          function ghSetEventMarkers(){
            if(!candleSeries)return;
            const row=ghSymbolEvents(); ghEventMarkers=[]; if(!row||!ghEventsEnabled)return;
            const add=(date,text)=>{const t=String(date||'').slice(0,10); if(!t)return; if((rawDailyCandles||[]).some(c=>String(c.time).slice(0,10)===t))ghEventMarkers.push({time:t,position:'aboveBar',color:'#ffab00',shape:'circle',text});};
            if(row.lastResult)add(row.lastResult.resultDate,'RES');
            (row.corporateActions||[]).forEach(x=>add(x.date,ghEventLabel(x))); (row.boardMeetings||[]).forEach(x=>add(x.date,'BM')); (row.bulkDeals||[]).forEach(x=>add(x.date,'BD')); (row.blockDeals||[]).forEach(x=>add(x.date,'BL'));
            ghEventMarkers.sort((a,b)=>String(a.time).localeCompare(String(b.time)));
            if(ghOriginalSetMarkers)ghOriginalSetMarkers.call(candleSeries,[]);
            if(typeof rebuildChart==='function')setTimeout(()=>rebuildChart(),0);
          }

          function ghPersistAlerts(){localStorage.setItem('MICKKK_GH_ALERTS',JSON.stringify(ghAlerts));}
          function ghSetAlert(){
            if(!currentSymbol)return alert('Select a stock first.');
            const p=parseFloat(prompt(`Target price for ${currentSymbol}:`,'')); if(!isFinite(p)||p<=0)return;
            const c=(prompt('Condition: ABOVE or BELOW','ABOVE')||'ABOVE').trim().toUpperCase(); if(c!=='ABOVE'&&c!=='BELOW')return;
            ghAlerts.push({id:Date.now().toString(),symbol:currentSymbol,targetPrice:p,condition:c,triggered:false,createdAt:new Date().toISOString()}); ghPersistAlerts(); ghRenderAlerts();
          }
          function ghDeleteAlert(id){ghAlerts=ghAlerts.filter(x=>x.id!==id);ghPersistAlerts();ghRenderAlerts();}
          function ghRenderAlerts(){
            const el=document.getElementById('gh-watch-items'); if(!el)return;
            const w=ghCurrentList(); const items=(w&&w.items)||[];
            const alertsHtml=ghAlerts.length?ghAlerts.map(a=>`<div class="gh-alert"><span><b style="color:var(--accent)">${escapeHtml(a.symbol)}</b> ${a.condition==='ABOVE'?'>=':'<='} ₹${Number(a.targetPrice).toFixed(2)}</span><button onclick="ghDeleteAlert('${a.id}')">×</button></div>`).join(''):`<div class="gh-empty">No active alerts.</div>`;
            el.innerHTML=(items.length?items.map(x=>`<div class="gh-watch-item ${x.symbol===currentSymbol?'active':''}" onclick="ghLoad('${escapeHtml(x.symbol)}')"><span class="sym">${escapeHtml(x.symbol)}</span><span class="nm">${escapeHtml(x.name||'')}</span><button class="rm" onclick="event.stopPropagation();ghRemove('${escapeHtml(x.symbol)}')">×</button></div>`).join(''):'')+`<div class="gh-section"><div class="gh-watch-title"><span>ACTIVE ALERTS</span></div>${alertsHtml}</div>`;
          }
          function ghShowAlerts(){ghTogglePanel(true);ghRenderAlerts();}
          function ghCheckAlerts(){
            if(!currentSymbol||!rawDailyCandles||!rawDailyCandles.length)return; const last=Number(rawDailyCandles[rawDailyCandles.length-1].close); if(!isFinite(last))return;
            let changed=false; ghAlerts.forEach(a=>{if(a.symbol!==currentSymbol||a.triggered)return; const hit=a.condition==='ABOVE'?last>=a.targetPrice:last<=a.targetPrice; if(hit){a.triggered=true;changed=true;try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();o.stop(ac.currentTime+.6)}catch(e){} alert(`🚨 PRICE ALERT: ${a.symbol} ₹${last.toFixed(2)} reached target ₹${a.targetPrice.toFixed(2)}`)}}); if(changed){ghPersistAlerts();ghRenderAlerts();}}

          function ghRenderFii(){
            const el=document.getElementById('gh-fii-summary'); if(!el)return; if(!ghFii){el.innerHTML='<div class="gh-empty">FII/DII data not loaded.</div>';return;}
            const d=Array.isArray(ghFii.data)?ghFii.data.slice(-4).reverse():[]; el.innerHTML=`<div class="gh-fii-grid">${d.map(x=>`<div class="gh-fii-box"><b>${escapeHtml(String(x.category||x.clientType||x.type||x.Category||'FII/DII'))}</b><span>${escapeHtml(String(x.date||x.tradeDate||x.timestamp||''))}</span><br><span>Buy ${escapeHtml(String(x.buyValue||x.buy||x.buyAmount||''))}</span><br><span>Sell ${escapeHtml(String(x.sellValue||x.sell||x.sellAmount||''))}</span><br><span>Net ${escapeHtml(String(x.netValue||x.net||x.netAmount||''))}</span></div>`).join('')}</div><div class="gh-muted" style="margin-top:5px">History rows: ${Array.isArray(ghFii.history)?ghFii.history.length:0}</div>`;
          }
          function ghOpenFii(){
            const el=document.getElementById('gh-fii-history'); if(!el)return; const h=(ghFii&&Array.isArray(ghFii.history)?ghFii.history.slice().reverse():[]); el.innerHTML=h.length?h.slice(0,200).map(x=>`<div class="gh-modal-row"><span>${escapeHtml(String(x.date||x.tradeDate||x.timestamp||''))}</span><span>${escapeHtml(String(x.category||x.clientType||x.type||''))}</span><span>Buy ${escapeHtml(String(x.buyValue||x.buy||x.buyAmount||''))}</span><span>Sell ${escapeHtml(String(x.sellValue||x.sell||x.sellAmount||''))}</span><span>Net ${escapeHtml(String(x.netValue||x.net||x.netAmount||''))}</span></div>`).join(''):'<div class="gh-empty">No history available yet. Run the corporate-data workflow once.</div>'; document.getElementById('gh-fii-modal').classList.add('open');
          }
          function ghCloseFii(){document.getElementById('gh-fii-modal').classList.remove('open');}
          async function ghLoadCorporate(){
            try{ghCorporate=await ghJson('corporate_events.json');}catch(e){ghCorporate=null;}
            try{ghFii=await ghJson('fii_dii.json');}catch(e){ghFii=null;}
            ghRenderEvents(); ghRenderFii(); ghSetEventMarkers();
          }

          const ghOrigRebuild = (typeof rebuildChart==='function') ? rebuildChart : null;
          if(ghOrigRebuild){ rebuildChart=function(){ const out=ghOrigRebuild.apply(this,arguments); setTimeout(()=>{ghSetEventMarkers();ghCheckAlerts();ghRenderEvents();ghRenderLists();},80); return out; }; }
          if(typeof candleSeries!=='undefined' && candleSeries && !ghOriginalSetMarkers){
            ghOriginalSetMarkers=candleSeries.setMarkers.bind(candleSeries);
            candleSeries.setMarkers=function(markers){ const merged=ghEventsEnabled?((markers||[]).concat(ghEventMarkers||[])):(markers||[]); return ghOriginalSetMarkers(merged); };
          }
          ghInitLists();
          ghLoadCorporate();
          setInterval(ghCheckAlerts,60000);
          setTimeout(()=>{ghRenderEvents();ghRenderFii();ghRenderLists();},600);
          </script>
          '''

          html = html.replace('</style>\n</head>', css + '</style>\n</head>')
          html = html.replace('</body>', ui + js + '\n</body>')
          p.write_text(html, encoding='utf-8')
          print('Injected GitHub watchlists, alerts and corporate-event UI.')
          PY

      - name: Commit UI update
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No chart UI changes."
            exit 0
          fi
          git commit -m "Apply GitHub Charts UI [skip ci]"
          git push origin HEAD:main
