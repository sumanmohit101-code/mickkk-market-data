name: Maintain NSE Results History

on:
  workflow_dispatch:
  schedule:
    # Run shortly after the daily NSE results refresh (10:30 AM IST).
    - cron: "45 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  maintain-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maintain rolling 365-day result history
        shell: bash
        run: |
          set -e
          python <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path("data/results.json")
          if not path.exists():
              raise RuntimeError("data/results.json does not exist")

          data = json.loads(path.read_text(encoding="utf-8"))
          symbol_rows = data.get("symbolWise", [])
          current_results = data.get("lastResults", [])

          if not isinstance(symbol_rows, list) or not symbol_rows:
              raise RuntimeError("results.json has no symbolWise rows")

          if not isinstance(current_results, list):
              current_results = []

          history = data.get("history", [])
          if not isinstance(history, list):
              history = []

          # Keep one historical record per symbol/result-date/period.
          merged = {}

          for row in history:
              if not isinstance(row, dict):
                  continue
              symbol = str(row.get("symbol", "")).strip().upper()
              result_date = str(row.get("resultDate", "")).strip()[:10]
              period = str(row.get("period", "")).strip()
              if not symbol or not result_date:
                  continue
              key = (symbol, result_date, period)
              merged[key] = row

          # Each daily results refresh contributes the latest known result
          # for every symbol. A result stays in history until it is older
          # than 365 days, then it is automatically removed.
          for row in current_results:
              if not isinstance(row, dict):
                  continue
              symbol = str(row.get("symbol", "")).strip().upper()
              result_date = str(row.get("resultDate", "")).strip()[:10]
              period = str(row.get("period", "")).strip()
              if not symbol or not result_date:
                  continue
              item = dict(row)
              item["symbol"] = symbol
              key = (symbol, result_date, period)
              merged[key] = item

          cutoff = datetime.now(timezone.utc).date() - timedelta(days=365)
          kept = []

          for row in merged.values():
              result_date = str(row.get("resultDate", "")).strip()[:10]
              try:
                  d = datetime.strptime(result_date, "%Y-%m-%d").date()
              except ValueError:
                  continue
              if d >= cutoff:
                  kept.append(row)

          kept.sort(
              key=lambda row: (
                  str(row.get("resultDate", "")),
                  str(row.get("symbol", "")),
                  str(row.get("period", "")),
              ),
              reverse=True,
          )

          history_by_symbol = {}
          for row in kept:
              symbol = row["symbol"]
              history_by_symbol.setdefault(symbol, []).append(row)

          # Give every tracked symbol an explicit history array/count.
          for row in symbol_rows:
              symbol = str(row.get("symbol", "")).strip().upper()
              entries = history_by_symbol.get(symbol, [])
              row["historyCount"] = len(entries)
              row["resultHistory"] = entries

          now = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          data["historyUpdatedAt"] = now
          data["historyRetentionDays"] = 365
          data["historyRecordCount"] = len(kept)
          data["history"] = kept
          data["historyBySymbol"] = history_by_symbol
          data["symbolWise"] = symbol_rows

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print("======================================")
          print("RESULT HISTORY MAINTENANCE COMPLETE")
          print("Tracked symbols:", len(symbol_rows))
          print("History records:", len(kept))
          print("Retention days: 365")
          print("Cutoff date:", cutoff.isoformat())
          print("======================================")
          PY

      - name: Validate result history
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("data/results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          rows = data.get("symbolWise", [])
          history = data.get("history", [])

          if not rows:
              raise SystemExit("symbolWise is empty")

          if not isinstance(history, list):
              raise SystemExit("history is not a list")

          missing = [x.get("symbol") for x in rows if "resultHistory" not in x]
          if missing:
              raise SystemExit(f"Missing resultHistory for {len(missing)} symbols")

          print("Validated symbols:", len(rows))
          print("Validated history records:", len(history))
          print("Retention days:", data.get("historyRetentionDays"))
          PY

      - name: Commit and push history
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json

          if git diff --cached --quiet; then
            echo "No result-history changes."
            exit 0
          fi

          git commit -m "Maintain rolling NSE results history"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Result history push successful."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            sleep 5
          done

          echo "ERROR: Could not push result history after 5 attempts."
          exit 1
