name: Backfill Last Results

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backfill-last-results.yml
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Fetch latest quarterly result for every symbol
        shell: bash
        run: |
          python <<'PY'
          import json
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime
          from urllib.parse import quote
          from zoneinfo import ZoneInfo

          from curl_cffi import requests

          IST = ZoneInfo("Asia/Kolkata")
          now = datetime.now(IST)

          with open("data/symbols.json", encoding="utf-8") as f:
              symbols = json.load(f)

          symbol_map = {
              str(x.get("symbol", "")).strip().upper(): str(x.get("name", "")).strip()
              for x in symbols
              if x.get("symbol")
          }
          symbols_list = sorted(symbol_map)

          def parse_date(value):
              if not value:
                  return None
              s = str(value).strip()
              for fmt in (
                  "%d-%b-%Y",
                  "%d-%B-%Y",
                  "%d/%m/%Y",
                  "%Y-%m-%d",
              ):
                  try:
                      return datetime.strptime(s, fmt).date()
                  except ValueError:
                      pass
              try:
                  return datetime.fromisoformat(s.replace("Z", "+00:00")).date()
              except Exception:
                  return None

          def rows(payload):
              if isinstance(payload, list):
                  return payload
              if not isinstance(payload, dict):
                  return []
              for key in ("data", "results", "records", "rows"):
                  if isinstance(payload.get(key), list):
                      return payload[key]
              for value in payload.values():
                  if isinstance(value, list):
                      return value
              return []

          def fetch_symbol(symbol):
              encoded = quote(symbol, safe="")
              url = (
                  "https://www.nseindia.com/api/"
                  "corporates-financial-results"
                  f"?index=equities&symbol={encoded}&period=Quarterly"
              )

              for attempt in range(1, 4):
                  session = requests.Session(impersonate="chrome")
                  session.headers.update({
                      "accept": "application/json, text/plain, */*",
                      "accept-language": "en-US,en;q=0.9",
                      "referer": "https://www.nseindia.com/companies-listing/corporate-filings-financial-results",
                      "user-agent": (
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/151.0.0.0 Safari/537.36"
                      ),
                  })
                  try:
                      home = session.get("https://www.nseindia.com/", timeout=20)
                      if home.status_code != 200:
                          raise RuntimeError(f"home {home.status_code}")

                      r = session.get(url, timeout=30)
                      if r.status_code == 200:
                          latest = None
                          for row in rows(r.json()):
                              if not isinstance(row, dict):
                                  continue
                              result_date = None
                              for key in (
                                  "broadCastDate",
                                  "broadcastDate",
                                  "filingDate",
                                  "exchdisstime",
                                  "date",
                              ):
                                  result_date = parse_date(row.get(key))
                                  if result_date:
                                      break
                              if not result_date:
                                  continue

                              item = {
                                  "symbol": symbol,
                                  "company": str(
                                      row.get("companyName")
                                      or row.get("company")
                                      or symbol_map.get(symbol, "")
                                  ).strip(),
                                  "resultDate": result_date.isoformat(),
                                  "period": str(row.get("period") or "Quarterly").strip(),
                                  "relatingTo": str(row.get("relatingTo") or "").strip(),
                                  "periodFrom": str(row.get("fromDate") or "").strip(),
                                  "periodTo": str(row.get("toDate") or "").strip(),
                                  "consolidated": str(row.get("consolidated") or "").strip(),
                                  "audited": str(row.get("audited") or "").strip(),
                              }
                              if latest is None or item["resultDate"] > latest["resultDate"]:
                                  latest = item
                          return symbol, latest

                      if r.status_code in (403, 429, 500, 502, 503, 504):
                          time.sleep(attempt * 2)
                          continue
                      return symbol, None
                  except Exception:
                      time.sleep(attempt * 2)
              return symbol, None

          latest = {}
          completed = 0
          workers = 6
          print(f"Backfilling {len(symbols_list)} symbols with {workers} workers")

          with ThreadPoolExecutor(max_workers=workers) as pool:
              futures = [pool.submit(fetch_symbol, s) for s in symbols_list]
              for future in as_completed(futures):
                  completed += 1
                  symbol, result = future.result()
                  if result:
                      latest[symbol] = result
                  if completed % 50 == 0:
                      print(f"Progress: {completed}/{len(symbols_list)}")

          print("Symbols with a result:", len(latest))

          with open("data/results.json", encoding="utf-8") as f:
              results = json.load(f)

          upcoming_map = {}
          for row in results.get("symbolWise", []):
              sym = str(row.get("symbol", "")).strip().upper()
              upcoming_map[sym] = row.get("upcomingResults") or []

          symbol_wise = []
          all_last = []

          for symbol in symbols_list:
              last = latest.get(symbol)
              row = {
                  "symbol": symbol,
                  "name": symbol_map.get(symbol, ""),
                  "lastResult": last,
                  "upcomingResults": upcoming_map.get(symbol, []),
              }
              symbol_wise.append(row)
              if last:
                  all_last.append(last)

          all_last.sort(key=lambda x: (x["resultDate"], x["symbol"]), reverse=True)

          results["source"] = "NSE"
          results["updatedAt"] = now.isoformat()
          results["timezone"] = "Asia/Kolkata"
          results["lastResults"] = all_last
          results["symbolWise"] = symbol_wise

          with open("data/results_history.json", "w", encoding="utf-8") as f:
              json.dump(all_last, f, ensure_ascii=False, indent=2)

          with open("data/results.json", "w", encoding="utf-8") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)

          print("Last-result rows saved:", len(all_last))
          print("Symbol-wise rows saved:", len(symbol_wise))
          PY

      - name: Validate
        run: |
          python - <<'PY'
          import json
          with open('data/results.json', encoding='utf-8') as f:
              x = json.load(f)
          assert len(x.get('symbolWise', [])) >= 1000
          print('symbolWise:', len(x['symbolWise']))
          print('lastResults:', len(x.get('lastResults', [])))
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/results_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Backfill symbol-wise last result dates"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
