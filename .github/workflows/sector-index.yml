name: Update Sector Indices

on:
  schedule:
    - cron: "30 15 * * 1-5" # 21:00 IST, update-stocks / update-indices ke BAAD chalna chahiye
  workflow_dispatch:

concurrency:
  group: market-data-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Build sector and industry indices
        run: python scripts/sector_index.py 1300

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectors.json data/sector-stocks.json

          if git diff --cached --quiet; then
            echo "No sector changes."
            exit 0
          fi

          git commit -m "Auto-update sector indices"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "Push successful."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done

          echo "ERROR: Could not push after 5 attempts."
          exit 1
