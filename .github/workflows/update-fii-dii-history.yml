name: Update FII DII History

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-fii-dii-history.yml
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Fetch and persist FII DII
        shell: bash
        run: |
          python <<'PY'
          import json
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from curl_cffi import requests

          IST = ZoneInfo("Asia/Kolkata")
          now = datetime.now(IST)

          def get_rows():
              for attempt in range(1, 4):
                  session = requests.Session(impersonate="chrome")
                  session.headers.update({
                      "accept": "application/json, text/plain, */*",
                      "accept-language": "en-US,en;q=0.9",
                      "referer": "https://www.nseindia.com/",
                      "user-agent": (
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/151.0.0.0 Safari/537.36"
                      ),
                  })
                  try:
                      home = session.get("https://www.nseindia.com/", timeout=20)
                      if home.status_code != 200:
                          raise RuntimeError(home.status_code)
                      r = session.get("https://www.nseindia.com/api/fiidiiTradeReact", timeout=30)
                      if r.status_code == 200:
                          payload = r.json()
                          if isinstance(payload, list):
                              return payload
                          if isinstance(payload, dict):
                              return payload.get("data", [])
                      if r.status_code in (403, 429, 500, 502, 503, 504):
                          time.sleep(attempt * 2)
                          continue
                  except Exception as e:
                      print("attempt", attempt, "error", repr(e))
                      time.sleep(attempt * 2)
              return []

          latest = get_rows()
          if not latest:
              raise RuntimeError("NSE FII/DII returned no rows; refusing blank overwrite")

          try:
              with open("data/fii_dii_history.json", encoding="utf-8") as f:
                  history = json.load(f)
          except Exception:
              history = []
          if not isinstance(history, list):
              history = []

          combined = history + latest
          seen = set()
          clean = []
          for row in combined:
              if not isinstance(row, dict):
                  continue
              key = (
                  str(row.get("date") or row.get("tradeDate") or row.get("timestamp") or ""),
                  str(row.get("category") or row.get("clientType") or row.get("type") or ""),
                  str(row.get("buyValue") or row.get("buy") or row.get("buyAmount") or ""),
                  str(row.get("sellValue") or row.get("sell") or row.get("sellAmount") or ""),
                  str(row.get("netValue") or row.get("net") or row.get("netAmount") or ""),
              )
              if key in seen:
                  continue
              seen.add(key)
              clean.append(row)

          clean = clean[-5000:]

          with open("data/fii_dii_history.json", "w", encoding="utf-8") as f:
              json.dump(clean, f, ensure_ascii=False, indent=2)

          output = {
              "source": "NSE",
              "updated": now.isoformat(),
              "timezone": "Asia/Kolkata",
              "data": latest,
              "history": clean,
          }

          with open("data/fii_dii.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Latest rows:", len(latest))
          print("History rows:", len(clean))
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fii_dii.json data/fii_dii_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist FII DII history"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 5
          done
          exit 1
