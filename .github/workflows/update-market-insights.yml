name: Update Market Insights

on:
  schedule:
    - cron: '30 13 * * 1-5' # Mon-Fri shaam 7:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-insights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yfinance pandas

      - name: Fetch Market Data
        run: |
          python - << 'EOF'
          import json
          import os
          import requests
          import yfinance as yf
          from datetime import datetime

          os.makedirs('data', exist_ok=True)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9"
          }

          # -------------------------------------------------------------
          # 1. FII / DII Activity Data (Reliable API Source)
          # -------------------------------------------------------------
          fii_dii_data = []
          try:
              fii_url = "https://groww.in/v1/api/stocks_data/v1/fii_dii/daily"
              r = requests.get(fii_url, headers=headers, timeout=15)
              if r.status_code == 200:
                  fii_dii_data = r.json()
                  print("✅ FII/DII data fetched successfully.")
          except Exception as e:
              print(f"Error fetching FII/DII: {e}")

          with open('data/fii_dii.json', 'w', encoding='utf-8') as f:
              json.dump({
                  "last_updated": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                  "data": fii_dii_data
              }, f, indent=2)

          # -------------------------------------------------------------
          # 2. Market Sentiment (India VIX, Nifty, Bank Nifty via Yahoo Finance)
          # -------------------------------------------------------------
          sentiment = {}
          try:
              symbols = {
                  "INDIA VIX": "^INDIAVIX",
                  "NIFTY 50": "^NSEI",
                  "NIFTY BANK": "^NSEBANK"
              }
              for name, sym in symbols.items():
                  ticker = yf.Ticker(sym)
                  hist = ticker.history(period="2d")
                  if len(hist) >= 2:
                      prev_close = hist['Close'].iloc[-2]
                      last_close = hist['Close'].iloc[-1]
                      change = round(last_close - prev_close, 2)
                      p_change = round((change / prev_close) * 100, 2)
                      sentiment[name] = {
                          "lastPrice": round(last_close, 2),
                          "change": change,
                          "pChange": p_change
                      }
                  elif len(hist) == 1:
                      last_close = hist['Close'].iloc[-1]
                      sentiment[name] = {"lastPrice": round(last_close, 2), "change": 0, "pChange": 0}

              print("✅ Market sentiment (VIX/Indices) fetched successfully.")
          except Exception as e:
              print(f"Error fetching Sentiment: {e}")

          with open('data/market_sentiment.json', 'w', encoding='utf-8') as f:
              json.dump({
                  "last_updated": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                  "sentiment": sentiment
              }, f, indent=2)

          # -------------------------------------------------------------
          # 3. F&O Ban List
          # -------------------------------------------------------------
          ban_list = []
          try:
              session = requests.Session()
              session.headers.update(headers)
              res = session.get("https://www.nseindia.com/api/fo-sec-ban", timeout=10)
              if res.status_code == 200:
                  ban_list = res.json()
                  print("✅ F&O Ban list fetched from NSE.")
          except Exception as e:
              print(f"Note on F&O Ban: {e}")

          with open('data/fno_ban.json', 'w', encoding='utf-8') as f:
              json.dump({
                  "last_updated": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                  "ban_list": ban_list
              }, f, indent=2)

          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-update Market Insights (FII/DII, Sentiment, Ban List)"
            git push origin main
