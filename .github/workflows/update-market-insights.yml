name: Update Market Insights

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  update-sentiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance

      - name: Update market sentiment only
        run: |
          python <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import yfinance as yf

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          sentiment = {}

          for name, symbol in (
              ("INDIA VIX", "^INDIAVIX"),
              ("NIFTY 50", "^NSEI"),
              ("NIFTY BANK", "^NSEBANK"),
          ):
              try:
                  h = yf.Ticker(symbol).history(period="5d", interval="1d", auto_adjust=False)
                  c = h["Close"].dropna() if h is not None and not h.empty else []
                  if len(c) >= 2:
                      prev = float(c.iloc[-2]); last = float(c.iloc[-1]); ch = last - prev
                      pct = ch / prev * 100 if prev else 0
                  elif len(c) == 1:
                      last = float(c.iloc[-1]); prev = None; ch = 0; pct = 0
                  else:
                      continue
                  sentiment[name] = {
                      "lastPrice": round(last, 2),
                      "previousClose": None if prev is None else round(prev, 2),
                      "change": round(ch, 2),
                      "pChange": round(pct, 2),
                  }
              except Exception as e:
                  print(name, e)

          if not sentiment:
              raise RuntimeError("No market sentiment data returned")

          with open("data/market_sentiment.json", "w", encoding="utf-8") as f:
              json.dump({
                  "source": "Yahoo Finance",
                  "updated": now.isoformat(),
                  "timezone": "Asia/Kolkata",
                  "sentiment": sentiment,
              }, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit and push sentiment
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_sentiment.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-update market sentiment"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          exit 1
