name: Update Market Insights

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-insights:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests yfinance

      - name: Fetch and Save Market Insights
        run: |
          python -c "
          import json, os, requests, yfinance as yf
          from datetime import datetime

          os.makedirs('data', exist_ok=True)
          headers = {'User-Agent': 'Mozilla/5.0'}

          # 1. FII / DII Data
          fii_dii = []
          try:
              r = requests.get('https://groww.in/v1/api/stocks_data/v1/fii_dii/daily', headers=headers, timeout=10)
              if r.status_code == 200:
                  fii_dii = r.json()
          except Exception as e:
              print('FII error:', e)

          with open('data/fii_dii.json', 'w') as f:
              json.dump({'updated': datetime.now().strftime('%Y-%m-%d %H:%M:%S'), 'data': fii_dii}, f, indent=2)

          # 2. Market Sentiment (India VIX & Indices)
          sentiment = {}
          for name, sym in [('INDIA VIX', '^INDIAVIX'), ('NIFTY 50', '^NSEI'), ('NIFTY BANK', '^NSEBANK')]:
              try:
                  h = yf.Ticker(sym).history(period='2d')
                  if len(h) >= 2:
                      p_close, l_close = h['Close'].iloc[-2], h['Close'].iloc[-1]
                      chg = round(l_close - p_close, 2)
                      sentiment[name] = {'lastPrice': round(l_close, 2), 'change': chg, 'pChange': round((chg/p_close)*100, 2)}
                  elif len(h) == 1:
                      sentiment[name] = {'lastPrice': round(h['Close'].iloc[-1], 2), 'change': 0, 'pChange': 0}
              except Exception as e:
                  print(f'Error {name}:', e)

          with open('data/market_sentiment.json', 'w') as f:
              json.dump({'updated': datetime.now().strftime('%Y-%m-%d %H:%M:%S'), 'sentiment': sentiment}, f, indent=2)
          print('✅ All data saved successfully!')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Market Insights" && git push)
