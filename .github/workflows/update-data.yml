name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Organize existing stock data into A-Z folders
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import re

          data_dir = Path("data")
          data_dir.mkdir(exist_ok=True)

          def bucket(symbol):
              first = symbol[:1].upper()
              return first if re.fullmatch(r"[A-Z]", first) else "0-9"

          moved = 0

          for src in data_dir.glob("*.json"):
              if src.name in {"symbols.json", "indices.json"}:
                  continue

              symbol = src.stem.upper()
              dest_dir = data_dir / bucket(symbol)
              dest_dir.mkdir(exist_ok=True)
              dest = dest_dir / src.name

              if src.resolve() != dest.resolve():
                  shutil.move(str(src), str(dest))
                  moved += 1

          print(f"Moved existing root stock JSON files: {moved}")
          PY

      - name: Create index catalogue
        run: |
          mkdir -p data/indices
          test -f data/indices.json
          echo "Index catalogue found: data/indices.json"

      - name: Download stock market data
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path

          import pandas as pd
          import yfinance as yf

          DATA_DIR = Path("data")
          DATA_DIR.mkdir(exist_ok=True)

          with open("symbols.txt", "r", encoding="utf-8") as f:
              symbols = list(dict.fromkeys(
                  line.strip().upper()
                  for line in f
                  if line.strip()
              ))

          print(f"Found {len(symbols)} unique stock symbols")

          def bucket(symbol):
              first = symbol[:1].upper()
              return first if re.fullmatch(r"[A-Z]", first) else "0-9"

          def save_candles(symbol, stock_df, dest_dir):
              if stock_df is None or stock_df.empty:
                  return 0

              candles = []

              for date, row in stock_df.iterrows():
                  try:
                      close = float(row["Close"])
                      if pd.isna(close) or close <= 0:
                          continue

                      open_price = float(row["Open"])
                      high = float(row["High"])
                      low = float(row["Low"])
                      volume = int(float(row["Volume"]))

                      if any(pd.isna(x) for x in [open_price, high, low]):
                          continue

                      candles.append({
                          "time": date.strftime("%Y-%m-%d"),
                          "open": round(open_price, 2),
                          "high": round(high, 2),
                          "low": round(low, 2),
                          "close": round(close, 2),
                          "volume": volume
                      })
                  except Exception:
                      continue

              if not candles:
                  return 0

              dest_dir.mkdir(parents=True, exist_ok=True)
              filename = dest_dir / f"{symbol}.json"

              with open(filename, "w", encoding="utf-8") as f:
                  json.dump(candles, f, separators=(",", ":"))

              return len(candles)

          BATCH_SIZE = 50

          for start in range(0, len(symbols), BATCH_SIZE):
              batch = symbols[start:start + BATCH_SIZE]
              tickers = [f"{symbol}.NS" for symbol in batch]

              print("\n" + "=" * 70)
              print(f"Batch {start // BATCH_SIZE + 1}: {start + 1}-{start + len(batch)} / {len(symbols)}")
              print("=" * 70)

              downloaded = None

              for attempt in range(1, 4):
                  try:
                      downloaded = yf.download(
                          tickers=tickers,
                          period="5y",
                          interval="1d",
                          auto_adjust=False,
                          group_by="ticker",
                          threads=True,
                          progress=False
                      )

                      if downloaded is not None and not downloaded.empty:
                          break

                      print(f"Batch returned no data, attempt {attempt}/3")
                  except Exception as e:
                      print(f"Batch error on attempt {attempt}/3: {e}")

                  time.sleep(5 * attempt)

              if downloaded is None or downloaded.empty:
                  print("BATCH FAILED: no data returned")
                  continue

              for symbol in batch:
                  ticker = f"{symbol}.NS"

                  try:
                      if isinstance(downloaded.columns, pd.MultiIndex):
                          level0 = downloaded.columns.get_level_values(0)
                          level1 = downloaded.columns.get_level_values(1)

                          if ticker in level0:
                              stock_df = downloaded[ticker].copy()
                          elif ticker in level1:
                              stock_df = downloaded.xs(ticker, axis=1, level=1).copy()
                          else:
                              print(f"NO DATA: {symbol}")
                              continue
                      else:
                          stock_df = downloaded.copy()

                      count = save_candles(symbol, stock_df, DATA_DIR / bucket(symbol))

                      if count:
                          print(f"SUCCESS: {symbol} -> {count} candles")
                      else:
                          print(f"NO VALID DATA: {symbol}")

                  except Exception as e:
                      print(f"ERROR: {symbol} -> {e}")

              time.sleep(2)

          print("\nFinished downloading stock market data.")
          PY

      - name: Download Nifty and India VIX index data from NSE Indices
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import date, timedelta
          from pathlib import Path

          import requests
          import pandas as pd
          import yfinance as yf

          DATA_DIR = Path("data/indices")
          DATA_DIR.mkdir(parents=True, exist_ok=True)

          with open("data/indices.json", "r", encoding="utf-8") as f:
              indices = json.load(f)

          session = requests.Session()
          session.headers.update({
              "Content-Type": "application/json; charset=UTF-8",
              "X-Requested-With": "XMLHttpRequest",
              "Referer": "https://www.niftyindices.com/reports/historical-data",
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36"
              ),
          })

          END_DATE = date.today()
          START_DATE = END_DATE - timedelta(days=5 * 365)
          ENDPOINT = "https://www.niftyindices.com/Backpage.aspx/getHistoricaldatatabletoString"

          def save_candles(item, rows):
              candles = {}

              for row in rows or []:
                  try:
                      dt = row.get("HistoricalDate") or row.get("Date")
                      if not dt:
                          continue

                      dt = pd.to_datetime(dt, dayfirst=True).strftime("%Y-%m-%d")

                      op = float(str(row.get("OPEN", "")).replace(",", ""))
                      hi = float(str(row.get("HIGH", "")).replace(",", ""))
                      lo = float(str(row.get("LOW", "")).replace(",", ""))
                      cl = float(str(row.get("CLOSE", "")).replace(",", ""))

                      if cl <= 0 or any(pd.isna(v) for v in (op, hi, lo, cl)):
                          continue

                      candles[dt] = {
                          "time": dt,
                          "open": round(op, 2),
                          "high": round(hi, 2),
                          "low": round(lo, 2),
                          "close": round(cl, 2),
                          "volume": 0
                      }
                  except Exception:
                      continue

              ordered = [candles[k] for k in sorted(candles)]
              if not ordered:
                  return 0

              with open(DATA_DIR / f"{item['symbol']}.json", "w", encoding="utf-8") as f:
                  json.dump(ordered, f, separators=(",", ":"))

              return len(ordered)

          def fetch_nifty_chunk(index_name, start_dt, end_dt):
              payload = {
                  "cinfo": (
                      "{"
                      f"'name':'{index_name}',"
                      f"'startDate':'{start_dt.strftime('%d-%b-%Y')}',"
                      f"'endDate':'{end_dt.strftime('%d-%b-%Y')}',"
                      f"'indexName':'{index_name}'"
                      "}"
                  )
              }

              for attempt in range(1, 4):
                  try:
                      r = session.post(ENDPOINT, json=payload, timeout=90)
                      r.raise_for_status()
                      body = r.json()

                      raw = body.get("d", "[]")
                      if isinstance(raw, str):
                          return json.loads(raw)
                      return raw or []
                  except Exception as e:
                      print(f"  attempt {attempt}/3 failed for {index_name}: {e}")
                      if attempt < 3:
                          time.sleep(5 * attempt)

              return []

          for item in indices:
              symbol = item["symbol"]
              name = item["name"]

              # Sensex is not a Nifty index, so keep its working Yahoo source.
              if symbol == "SENSEX":
                  print(f"\nFetching BSE Sensex [{symbol}] via Yahoo Finance")
                  try:
                      df = yf.download(
                          "^BSESN",
                          period="5y",
                          interval="1d",
                          auto_adjust=False,
                          progress=False,
                          threads=False
                      )

                      if isinstance(df.columns, pd.MultiIndex):
                          try:
                              df = df.xs("^BSESN", axis=1, level=1)
                          except Exception:
                              df.columns = df.columns.get_level_values(0)

                      rows = []
                      for dt, row in df.iterrows():
                          try:
                              rows.append({
                                  "HistoricalDate": dt.strftime("%Y-%m-%d"),
                                  "OPEN": row["Open"],
                                  "HIGH": row["High"],
                                  "LOW": row["Low"],
                                  "CLOSE": row["Close"],
                              })
                          except Exception:
                              pass

                      count = save_candles(item, rows)
                      print(f"SUCCESS: {symbol} -> {count} candles" if count else f"NO DATA: {symbol}")
                  except Exception as e:
                      print(f"ERROR: {symbol} -> {e}")
                  time.sleep(1)
                  continue

              print(f"\nFetching index: {name} [{symbol}] from NSE Indices")

              all_rows = []
              chunk_start = START_DATE

              while chunk_start <= END_DATE:
                  chunk_end = min(chunk_start + timedelta(days=180), END_DATE)
                  rows = fetch_nifty_chunk(name, chunk_start, chunk_end)
                  print(
                      f"  {chunk_start} to {chunk_end}: "
                      f"{len(rows)} rows"
                  )
                  all_rows.extend(rows)
                  chunk_start = chunk_end + timedelta(days=1)
                  time.sleep(1.2)

              count = save_candles(item, all_rows)

              if count:
                  print(f"SUCCESS: {symbol} -> {count} candles")
              else:
                  print(f"NO DATA: {symbol} -> NSE returned no OHLC rows")

          print("\nFinished downloading index data from NSE Indices.")
          PY

      - name: Show data structure
        run: |
          echo "Root JSON files:"
          find data -maxdepth 1 -type f -name "*.json" | wc -l

          echo "Stock JSON files inside A-Z folders:"
          find data -mindepth 2 -maxdepth 2 -type f -name "*.json" ! -path "data/indices/*" | wc -l

          echo "Index JSON files:"
          find data/indices -type f -name "*.json" | wc -l

          echo "Total JSON files:"
          find data -type f -name "*.json" | wc -l

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stocks and index market data"
            git push
          fi
