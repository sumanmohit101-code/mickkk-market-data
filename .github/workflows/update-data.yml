name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Organize existing stock data into A-Z folders
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import re

          data_dir = Path("data")
          data_dir.mkdir(exist_ok=True)

          def bucket(symbol):
              first = symbol[:1].upper()
              return first if re.fullmatch(r"[A-Z]", first) else "0-9"

          moved = 0

          for src in data_dir.glob("*.json"):
              if src.name in {"symbols.json", "indices.json"}:
                  continue

              symbol = src.stem.upper()
              dest_dir = data_dir / bucket(symbol)
              dest_dir.mkdir(exist_ok=True)
              dest = dest_dir / src.name

              if src.resolve() != dest.resolve():
                  shutil.move(str(src), str(dest))
                  moved += 1

          print(f"Moved existing root stock JSON files: {moved}")
          PY

      - name: Create index catalogue
        run: |
          mkdir -p data/indices
          test -f data/indices.json
          echo "Index catalogue found: data/indices.json"

      - name: Download stock market data
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path

          import pandas as pd
          import yfinance as yf

          DATA_DIR = Path("data")
          DATA_DIR.mkdir(exist_ok=True)

          with open("symbols.txt", "r", encoding="utf-8") as f:
              symbols = list(dict.fromkeys(
                  line.strip().upper()
                  for line in f
                  if line.strip()
              ))

          print(f"Found {len(symbols)} unique stock symbols")

          def bucket(symbol):
              first = symbol[:1].upper()
              return first if re.fullmatch(r"[A-Z]", first) else "0-9"

          def save_candles(symbol, stock_df, dest_dir):
              if stock_df is None or stock_df.empty:
                  return 0

              candles = []

              for date, row in stock_df.iterrows():
                  try:
                      close = float(row["Close"])
                      if pd.isna(close) or close <= 0:
                          continue

                      open_price = float(row["Open"])
                      high = float(row["High"])
                      low = float(row["Low"])
                      volume = int(float(row["Volume"]))

                      if any(pd.isna(x) for x in [open_price, high, low]):
                          continue

                      candles.append({
                          "time": date.strftime("%Y-%m-%d"),
                          "open": round(open_price, 2),
                          "high": round(high, 2),
                          "low": round(low, 2),
                          "close": round(close, 2),
                          "volume": volume
                      })
                  except Exception:
                      continue

              if not candles:
                  return 0

              dest_dir.mkdir(parents=True, exist_ok=True)
              filename = dest_dir / f"{symbol}.json"

              with open(filename, "w", encoding="utf-8") as f:
                  json.dump(candles, f, separators=(",", ":"))

              return len(candles)

          BATCH_SIZE = 50

          for start in range(0, len(symbols), BATCH_SIZE):
              batch = symbols[start:start + BATCH_SIZE]
              tickers = [f"{symbol}.NS" for symbol in batch]

              print("\n" + "=" * 70)
              print(f"Batch {start // BATCH_SIZE + 1}: {start + 1}-{start + len(batch)} / {len(symbols)}")
              print("=" * 70)

              downloaded = None

              for attempt in range(1, 4):
                  try:
                      downloaded = yf.download(
                          tickers=tickers,
                          period="5y",
                          interval="1d",
                          auto_adjust=False,
                          group_by="ticker",
                          threads=True,
                          progress=False
                      )

                      if downloaded is not None and not downloaded.empty:
                          break

                      print(f"Batch returned no data, attempt {attempt}/3")
                  except Exception as e:
                      print(f"Batch error on attempt {attempt}/3: {e}")

                  time.sleep(5 * attempt)

              if downloaded is None or downloaded.empty:
                  print("BATCH FAILED: no data returned")
                  continue

              for symbol in batch:
                  ticker = f"{symbol}.NS"

                  try:
                      if isinstance(downloaded.columns, pd.MultiIndex):
                          level0 = downloaded.columns.get_level_values(0)
                          level1 = downloaded.columns.get_level_values(1)

                          if ticker in level0:
                              stock_df = downloaded[ticker].copy()
                          elif ticker in level1:
                              stock_df = downloaded.xs(ticker, axis=1, level=1).copy()
                          else:
                              print(f"NO DATA: {symbol}")
                              continue
                      else:
                          stock_df = downloaded.copy()

                      count = save_candles(symbol, stock_df, DATA_DIR / bucket(symbol))

                      if count:
                          print(f"SUCCESS: {symbol} -> {count} candles")
                      else:
                          print(f"NO VALID DATA: {symbol}")

                  except Exception as e:
                      print(f"ERROR: {symbol} -> {e}")

              time.sleep(2)

          print("\nFinished downloading stock market data.")
          PY

      - name: Download Nifty, Sensex and India VIX index data
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import pandas as pd
          import yfinance as yf

          DATA_DIR = Path("data/indices")
          DATA_DIR.mkdir(parents=True, exist_ok=True)

          with open("indices.json", "r", encoding="utf-8") as f:
              indices = json.load(f)

          def save_index(item, df):
              if df is None or df.empty:
                  return 0

              candles = []

              for date, row in df.iterrows():
                  try:
                      close = float(row["Close"])
                      if pd.isna(close) or close <= 0:
                          continue

                      op = float(row["Open"])
                      hi = float(row["High"])
                      lo = float(row["Low"])

                      if any(pd.isna(x) for x in [op, hi, lo]):
                          continue

                      candles.append({
                          "time": date.strftime("%Y-%m-%d"),
                          "open": round(op, 2),
                          "high": round(hi, 2),
                          "low": round(lo, 2),
                          "close": round(close, 2),
                          "volume": 0
                      })
                  except Exception:
                      continue

              if not candles:
                  return 0

              with open(DATA_DIR / f"{item['symbol']}.json", "w", encoding="utf-8") as f:
                  json.dump(candles, f, separators=(",", ":"))

              return len(candles)

          for item in indices:
              symbol = item["symbol"]
              yahoo = item["yahoo"]

              print(f"\nFetching index: {item['name']} [{symbol}] via {yahoo}")

              try:
                  df = yf.download(
                      yahoo,
                      period="5y",
                      interval="1d",
                      auto_adjust=False,
                      progress=False,
                      threads=False
                  )

                  if isinstance(df.columns, pd.MultiIndex):
                      try:
                          df = df.xs(yahoo, axis=1, level=1)
                      except Exception:
                          df.columns = df.columns.get_level_values(0)

                  count = save_index(item, df)

                  if count:
                      print(f"SUCCESS: {symbol} -> {count} candles")
                  else:
                      print(f"NO DATA: {symbol} (Yahoo mapping may be unavailable)")

              except Exception as e:
                  print(f"ERROR: {symbol} -> {e}")

              time.sleep(1)

          print("\nFinished downloading index data.")
          PY

      - name: Show data structure
        run: |
          echo "Root JSON files:"
          find data -maxdepth 1 -type f -name "*.json" | wc -l

          echo "Stock JSON files inside A-Z folders:"
          find data -mindepth 2 -maxdepth 2 -type f -name "*.json" ! -path "data/indices/*" | wc -l

          echo "Index JSON files:"
          find data/indices -type f -name "*.json" | wc -l

          echo "Total JSON files:"
          find data -type f -name "*.json" | wc -l

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update stocks and index market data"
            git push
          fi
