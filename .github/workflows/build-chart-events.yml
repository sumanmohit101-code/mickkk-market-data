name: Build Chart Event Data

on:
  push:
    branches: [main]
    paths:
      - data/market_events.json
      - data/results.json
      - .github/workflows/build-chart-events.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build corporate_events.json
        shell: bash
        run: |
          python <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          IST = ZoneInfo("Asia/Kolkata")
          now = datetime.now(IST)

          def load(path, default):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return default

          symbols = load("data/symbols.json", [])
          market = load("data/market_events.json", {})
          results = load("data/results.json", {})

          by_market = market.get("bySymbol", {}) if isinstance(market, dict) else {}
          by_result = {}
          for row in results.get("symbolWise", []) if isinstance(results, dict) else []:
              if isinstance(row, dict):
                  by_result[str(row.get("symbol", "")).strip().upper()] = row

          empty = lambda: {
              "lastResult": None,
              "upcomingResults": [],
              "corporateActions": [],
              "boardMeetings": [],
              "bulkDeals": [],
              "blockDeals": [],
          }

          symbol_wise = {}

          for item in symbols if isinstance(symbols, list) else []:
              if not isinstance(item, dict):
                  continue
              symbol = str(item.get("symbol", "")).strip().upper()
              if symbol:
                  symbol_wise[symbol] = empty()

          for symbol, row in by_result.items():
              symbol_wise.setdefault(symbol, empty())
              symbol_wise[symbol]["lastResult"] = row.get("lastResult")
              symbol_wise[symbol]["upcomingResults"] = row.get("upcomingResults") or []

          for symbol, row in by_market.items():
              symbol = str(symbol).strip().upper()
              if not symbol:
                  continue
              bucket = symbol_wise.setdefault(symbol, empty())
              for key in ("corporateActions", "boardMeetings", "bulkDeals", "blockDeals"):
                  values = row.get(key, []) if isinstance(row, dict) else []
                  if isinstance(values, list):
                      bucket[key] = values

          output = {
              "source": "NSE",
              "updatedAt": now.isoformat(),
              "timezone": "Asia/Kolkata",
              "symbolCount": len(symbol_wise),
              "symbolWise": [
                  {
                      "symbol": symbol,
                      **symbol_wise[symbol],
                  }
                  for symbol in sorted(symbol_wise)
              ],
          }

          with open("data/corporate_events.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("Chart event symbols:", len(output["symbolWise"]))
          PY

      - name: Validate
        run: |
          python - <<'PY'
          import json
          with open('data/corporate_events.json', encoding='utf-8') as f:
              x = json.load(f)
          assert x.get('symbolCount', 0) >= 1000
          print('Validated symbols:', x['symbolCount'])
          PY

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/corporate_events.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build chart-ready corporate events [skip ci]"
          git push origin HEAD:main
