name: Sync Chart Market Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-chart-market-data.yml"
  schedule:
    # 19:35 IST, Monday-Friday
    - cron: "05 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Build results, events and FII/DII data
        shell: bash
        run: |
          python <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from curl_cffi import requests

          DATA_DIR = Path("data")
          DATA_DIR.mkdir(exist_ok=True)

          IST = ZoneInfo("Asia/Kolkata")
          now = datetime.now(IST)
          today = now.date()

          session = requests.Session(impersonate="chrome")
          session.headers.update({
              "accept": "application/json, text/plain, */*",
              "accept-language": "en-US,en;q=0.9",
              "referer": "https://www.nseindia.com/",
              "user-agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/151.0.0.0 Safari/537.36"
              ),
          })

          home = session.get("https://www.nseindia.com/", timeout=30)
          print("NSE homepage:", home.status_code)

          def parse_date(value):
              if value in (None, ""):
                  return None

              text = str(value).strip()

              for fmt in (
                  "%d-%b-%Y",
                  "%d-%B-%Y",
                  "%d/%m/%Y",
                  "%Y-%m-%d",
                  "%d-%m-%Y",
                  "%Y/%m/%d",
              ):
                  try:
                      return datetime.strptime(text, fmt).date()
                  except ValueError:
                      pass

              try:
                  return datetime.fromisoformat(
                      text.replace("Z", "+00:00")
                  ).date()
              except Exception:
                  return None

          def extract_rows(payload):
              if isinstance(payload, list):
                  return payload

              if isinstance(payload, dict):
                  for key in ("data", "records", "results", "rows"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value

                  for value in payload.values():
                      if isinstance(value, list):
                          return value

              return []

          def get_json_rows(url, label, required=False):
              print(f"Fetching {label}...")
              response = session.get(url, timeout=45)
              print(label, "HTTP:", response.status_code)

              if response.status_code != 200:
                  if required:
                      raise RuntimeError(
                          f"{label} failed: HTTP {response.status_code}"
                      )
                  return []

              try:
                  rows = extract_rows(response.json())
              except Exception as exc:
                  if required:
                      raise RuntimeError(
                          f"{label} JSON error: {exc}"
                      )
                  return []

              if required and not rows:
                  raise RuntimeError(
                      f"{label} returned no rows"
                  )

              print(label, "rows:", len(rows))
              return rows

          def symbol_of(row):
              for key in (
                  "symbol",
                  "Symbol",
                  "SYMBOL",
                  "ticker",
                  "symbolCode",
              ):
                  value = row.get(key)
                  if value not in (None, ""):
                      return str(value).strip().upper()
              return ""

          def company_of(row, fallback=""):
              for key in (
                  "companyName",
                  "company",
                  "company_name",
                  "name",
              ):
                  value = row.get(key)
                  if value not in (None, ""):
                      return str(value).strip()
              return fallback

          # -------------------------------------------------
          # SYMBOL CATALOGUE
          # -------------------------------------------------

          with open(
              DATA_DIR / "symbols.json",
              "r",
              encoding="utf-8",
          ) as file:
              symbols_payload = json.load(file)

          if isinstance(symbols_payload, dict):
              symbols = symbols_payload.get("symbols", [])
          else:
              symbols = symbols_payload

          symbol_map = {}
          for item in symbols:
              if not isinstance(item, dict):
                  continue
              symbol = symbol_of(item)
              if symbol:
                  symbol_map[symbol] = company_of(item)

          print("Catalogue symbols:", len(symbol_map))

          if len(symbol_map) < 1000:
              raise RuntimeError(
                  f"Symbol catalogue unexpectedly small: {len(symbol_map)}"
              )

          # -------------------------------------------------
          # UPCOMING RESULTS
          # -------------------------------------------------

          upcoming_raw = get_json_rows(
              "https://www.nseindia.com/api/event-calendar",
              "NSE event calendar",
              required=True,
          )

          upcoming = []

          for row in upcoming_raw:
              if not isinstance(row, dict):
                  continue

              combined = (
                  str(row.get("purpose", ""))
                  + " "
                  + str(row.get("bm_desc", ""))
              ).lower()

              if "financial result" not in combined and "financial results" not in combined:
                  continue

              event_date = parse_date(row.get("date"))
              symbol = symbol_of(row)

              if not event_date or event_date < today or not symbol:
                  continue

              upcoming.append({
                  "symbol": symbol,
                  "company": company_of(row, symbol_map.get(symbol, "")),
                  "date": event_date.isoformat(),
                  "purpose": str(row.get("purpose", "")).strip(),
                  "description": str(row.get("bm_desc", "")).strip(),
              })

          upcoming_unique = {}
          for row in upcoming:
              key = (
                  row["symbol"],
                  row["date"],
                  row["description"],
              )
              upcoming_unique[key] = row

          upcoming = sorted(
              upcoming_unique.values(),
              key=lambda x: (x["date"], x["symbol"]),
          )

          # -------------------------------------------------
          # HISTORICAL RESULTS / LAST RESULT PER SYMBOL
          # -------------------------------------------------

          result_rows = []

          for period in (
              "Quarterly",
              "Annual",
              "Half-Yearly",
              "Others",
          ):
              url = (
                  "https://www.nseindia.com/api/"
                  "corporates-financial-results"
                  f"?index=equities&period={period}"
              )
              result_rows.extend(
                  get_json_rows(
                      url,
                      f"financial results {period}",
                  )
              )

          cutoff_results = today - timedelta(days=730)
          latest_by_symbol = {}

          for row in result_rows:
              if not isinstance(row, dict):
                  continue

              symbol = symbol_of(row)
              if not symbol:
                  continue

              result_date = None
              for key in (
                  "broadCastDate",
                  "broadcastDate",
                  "filingDate",
                  "exchdisstime",
                  "date",
              ):
                  result_date = parse_date(row.get(key))
                  if result_date:
                      break

              if not result_date or result_date > today or result_date < cutoff_results:
                  continue

              item = {
                  "symbol": symbol,
                  "company": company_of(row, symbol_map.get(symbol, "")),
                  "resultDate": result_date.isoformat(),
                  "period": str(row.get("period", "")).strip(),
                  "relatingTo": str(row.get("relatingTo", "")).strip(),
                  "periodFrom": str(row.get("fromDate", "")).strip(),
                  "periodTo": str(row.get("toDate", "")).strip(),
                  "consolidated": str(row.get("consolidated", "")).strip(),
                  "audited": str(row.get("audited", "")).strip(),
              }

              previous = latest_by_symbol.get(symbol)

              if (
                  previous is None
                  or item["resultDate"] > previous["resultDate"]
              ):
                  latest_by_symbol[symbol] = item

          last_results = sorted(
              latest_by_symbol.values(),
              key=lambda x: (x["resultDate"], x["symbol"]),
              reverse=True,
          )

          # -------------------------------------------------
          # CORPORATE ACTIONS
          # -------------------------------------------------

          actions_url = (
              "https://www.nseindia.com/api/"
              "corporates-corporateActions"
              "?index=equities"
              f"&from_date={(today - timedelta(days=365)).strftime('%d-%m-%Y')}"
              f"&to_date={(today + timedelta(days=180)).strftime('%d-%m-%Y')}"
          )

          actions_raw = get_json_rows(
              actions_url,
              "corporate actions",
          )

          corporate_actions = []

          for row in actions_raw:
              if not isinstance(row, dict):
                  continue

              symbol = symbol_of(row)
              if not symbol:
                  continue

              purpose = str(
                  row.get("purpose")
                  or row.get("subject")
                  or row.get("description")
                  or ""
              ).strip()

              event_date = None
              for key in (
                  "exDate",
                  "exDt",
                  "recordDate",
                  "recDate",
                  "date",
                  "purposeDate",
              ):
                  event_date = parse_date(row.get(key))
                  if event_date:
                      break

              if not event_date:
                  continue

              text = purpose.lower()

              if "dividend" in text:
                  event_type = "DIVIDEND"
              elif "bonus" in text:
                  event_type = "BONUS"
              elif "split" in text or "sub-division" in text:
                  event_type = "SPLIT"
              elif "right" in text:
                  event_type = "RIGHTS"
              elif "buyback" in text or "buy-back" in text:
                  event_type = "BUYBACK"
              else:
                  event_type = "CORPORATE_ACTION"

              corporate_actions.append({
                  "symbol": symbol,
                  "company": symbol_map.get(symbol, ""),
                  "date": event_date.isoformat(),
                  "eventType": event_type,
                  "purpose": purpose,
                  "recordDate": str(
                      row.get("recordDate")
                      or row.get("recDate")
                      or ""
                  ).strip(),
                  "exDate": str(
                      row.get("exDate")
                      or row.get("exDt")
                      or ""
                  ).strip(),
              })

          # -------------------------------------------------
          # BOARD MEETINGS
          # -------------------------------------------------

          board_raw = get_json_rows(
              "https://www.nseindia.com/api/corporates-boardMeetings?index=equities",
              "board meetings",
          )

          board_meetings = []

          for row in board_raw:
              if not isinstance(row, dict):
                  continue

              symbol = symbol_of(row)
              if not symbol:
                  continue

              meeting_date = None
              for key in (
                  "meetingDate",
                  "bm_date",
                  "bmDate",
                  "date",
                  "dateOfMeeting",
              ):
                  meeting_date = parse_date(row.get(key))
                  if meeting_date:
                      break

              if not meeting_date:
                  continue

              board_meetings.append({
                  "symbol": symbol,
                  "company": company_of(row, symbol_map.get(symbol, "")),
                  "date": meeting_date.isoformat(),
                  "purpose": str(
                      row.get("purpose")
                      or row.get("bm_desc")
                      or row.get("purposeDescription")
                      or row.get("description")
                      or ""
                  ).strip(),
              })

          # -------------------------------------------------
          # BULK / BLOCK DEALS
          # -------------------------------------------------

          bulk_raw = get_json_rows(
              "https://www.nseindia.com/api/historical/bulk-deals",
              "bulk deals",
          )
          block_raw = get_json_rows(
              "https://www.nseindia.com/api/historical/block-deals",
              "block deals",
          )

          def normalize_deal(row, deal_type):
              if not isinstance(row, dict):
                  return None

              symbol = symbol_of(row)
              if not symbol:
                  return None

              event_date = None
              for key in (
                  "date",
                  "Date",
                  "tradeDate",
                  "trade_date",
              ):
                  event_date = parse_date(row.get(key))
                  if event_date:
                      break

              if not event_date:
                  return None

              def first(keys):
                  for key in keys:
                      if row.get(key) not in (None, ""):
                          return row.get(key)
                  return ""

              return {
                  "symbol": symbol,
                  "company": symbol_map.get(symbol, ""),
                  "date": event_date.isoformat(),
                  "type": deal_type,
                  "clientName": str(
                      first((
                          "client_name",
                          "clientName",
                          "CLIENT_NAME",
                          "name",
                      ))
                  ).strip(),
                  "buySell": str(
                      first((
                          "buy_sell",
                          "buySell",
                          "BUY_SELL",
                          "buySellFlag",
                      ))
                  ).strip(),
                  "quantity": first(("quantity", "Quantity", "QUANTITY", "qty")),
                  "tradePrice": first(("trade_price", "tradePrice", "TRADE_PRICE", "price")),
                  "tradeValue": first(("trade_value", "tradeValue", "TRADE_VALUE", "value")),
              }

          bulk_deals = [
              x for x in (
                  normalize_deal(row, "BULK_DEAL")
                  for row in bulk_raw
              )
              if x
          ]

          block_deals = [
              x for x in (
                  normalize_deal(row, "BLOCK_DEAL")
                  for row in block_raw
              )
              if x
          ]

          # -------------------------------------------------
          # BUILD SYMBOL-WISE OUTPUT FOR EVERY SYMBOL
          # -------------------------------------------------

          by_symbol = {}

          for symbol in symbol_map:
              by_symbol[symbol] = {
                  "symbol": symbol,
                  "company": symbol_map.get(symbol, ""),
                  "lastResult": latest_by_symbol.get(symbol),
                  "upcomingResults": [],
                  "corporateActions": [],
                  "boardMeetings": [],
                  "bulkDeals": [],
                  "blockDeals": [],
              }

          for row in upcoming:
              by_symbol.setdefault(
                  row["symbol"],
                  {
                      "symbol": row["symbol"],
                      "company": row.get("company", ""),
                      "lastResult": None,
                      "upcomingResults": [],
                      "corporateActions": [],
                      "boardMeetings": [],
                      "bulkDeals": [],
                      "blockDeals": [],
                  },
              )["upcomingResults"].append(row)

          for row in corporate_actions:
              by_symbol.setdefault(row["symbol"], {
                  "symbol": row["symbol"],
                  "company": row.get("company", ""),
                  "lastResult": latest_by_symbol.get(row["symbol"]),
                  "upcomingResults": [],
                  "corporateActions": [],
                  "boardMeetings": [],
                  "bulkDeals": [],
                  "blockDeals": [],
              })["corporateActions"].append(row)

          for row in board_meetings:
              by_symbol.setdefault(row["symbol"], {
                  "symbol": row["symbol"],
                  "company": row.get("company", ""),
                  "lastResult": latest_by_symbol.get(row["symbol"]),
                  "upcomingResults": [],
                  "corporateActions": [],
                  "boardMeetings": [],
                  "bulkDeals": [],
                  "blockDeals": [],
              })["boardMeetings"].append(row)

          for row in bulk_deals:
              by_symbol.setdefault(row["symbol"], {
                  "symbol": row["symbol"],
                  "company": row.get("company", ""),
                  "lastResult": latest_by_symbol.get(row["symbol"]),
                  "upcomingResults": [],
                  "corporateActions": [],
                  "boardMeetings": [],
                  "bulkDeals": [],
                  "blockDeals": [],
              })["bulkDeals"].append(row)

          for row in block_deals:
              by_symbol.setdefault(row["symbol"], {
                  "symbol": row["symbol"],
                  "company": row.get("company", ""),
                  "lastResult": latest_by_symbol.get(row["symbol"]),
                  "upcomingResults": [],
                  "corporateActions": [],
                  "boardMeetings": [],
                  "bulkDeals": [],
                  "blockDeals": [],
              })["blockDeals"].append(row)

          for row in by_symbol.values():
              row["upcomingResults"].sort(key=lambda x: x["date"])
              for key in (
                  "corporateActions",
                  "boardMeetings",
                  "bulkDeals",
                  "blockDeals",
              ):
                  row[key].sort(
                      key=lambda x: x["date"],
                      reverse=True,
                  )

          symbol_wise = [
              by_symbol[symbol]
              for symbol in sorted(by_symbol)
          ]

          # -------------------------------------------------
          # RESULTS.JSON
          # -------------------------------------------------

          tomorrow = today + timedelta(days=1)
          week_end = today + timedelta(days=(6 - today.weekday()))

          results_output = {
              "source": "NSE",
              "updatedAt": now.isoformat(),
              "timezone": "Asia/Kolkata",
              "symbolCount": len(symbol_wise),
              "today": [
                  row for row in upcoming
                  if row["date"] == today.isoformat()
              ],
              "tomorrow": [
                  row for row in upcoming
                  if row["date"] == tomorrow.isoformat()
              ],
              "thisWeek": [
                  row for row in upcoming
                  if today <= parse_date(row["date"]) <= week_end
              ],
              "allUpcoming": upcoming,
              "lastResults": last_results,
              "symbolWise": [
                  {
                      "symbol": row["symbol"],
                      "company": row["company"],
                      "lastResult": row["lastResult"],
                      "upcomingResults": row["upcomingResults"],
                  }
                  for row in symbol_wise
              ],
          }

          # -------------------------------------------------
          # CORPORATE_EVENTS.JSON
          # -------------------------------------------------

          corporate_output = {
              "source": "NSE",
              "updatedAt": now.isoformat(),
              "timezone": "Asia/Kolkata",
              "symbolCount": len(symbol_wise),
              "symbolWise": symbol_wise,
          }

          # -------------------------------------------------
          # MARKET_EVENTS.JSON
          # -------------------------------------------------

          market_output = {
              "source": "NSE",
              "updatedAt": now.isoformat(),
              "timezone": "Asia/Kolkata",
              "bySymbol": by_symbol,
          }

          # -------------------------------------------------
          # FII / DII LATEST + HISTORY
          # -------------------------------------------------

          fii_rows = get_json_rows(
              "https://www.nseindia.com/api/fiidiiTradeReact",
              "FII/DII",
              required=True,
          )

          fii_history_path = DATA_DIR / "fii_dii_history.json"
          old_history = []

          if fii_history_path.exists():
              try:
                  with open(
                      fii_history_path,
                      "r",
                      encoding="utf-8",
                  ) as file:
                      old_history = json.load(file)
              except Exception:
                  old_history = []

          if not isinstance(old_history, list):
              old_history = []

          combined = old_history + fii_rows
          dedupe = {}

          for row in combined:
              if not isinstance(row, dict):
                  continue

              date_value = (
                  row.get("date")
                  or row.get("Date")
                  or row.get("tradeDate")
                  or row.get("timestamp")
                  or ""
              )
              category = (
                  row.get("category")
                  or row.get("clientType")
                  or row.get("type")
                  or row.get("Category")
                  or ""
              )

              key = json.dumps(
                  [
                      str(date_value),
                      str(category),
                      str(row.get("buyValue", row.get("buy", ""))),
                      str(row.get("sellValue", row.get("sell", ""))),
                      str(row.get("netValue", row.get("net", ""))),
                  ]
              )

              dedupe[key] = row

          fii_history = []
          history_cutoff = today - timedelta(days=365)

          for row in dedupe.values():
              parsed = parse_date(
                  row.get("date")
                  or row.get("Date")
                  or row.get("tradeDate")
                  or row.get("timestamp")
              )

              if parsed is None or parsed >= history_cutoff:
                  fii_history.append(row)

          fii_history.sort(
              key=lambda row: str(
                  row.get("date")
                  or row.get("Date")
                  or row.get("tradeDate")
                  or ""
              ),
              reverse=True,
          )

          fii_output = {
              "source": "NSE",
              "updated": now.isoformat(),
              "timezone": "Asia/Kolkata",
              "data": fii_rows,
              "latest": fii_rows,
              "history": fii_history,
          }

          # -------------------------------------------------
          # ATOMIC WRITES
          # -------------------------------------------------

          outputs = {
              "results.json": results_output,
              "corporate_events.json": corporate_output,
              "market_events.json": market_output,
              "fii_dii.json": fii_output,
              "fii_dii_history.json": fii_history,
          }

          for filename, payload in outputs.items():
              temp = DATA_DIR / f".{filename}.tmp"
              final = DATA_DIR / filename

              with open(
                  temp,
                  "w",
                  encoding="utf-8",
              ) as file:
                  json.dump(
                      payload,
                      file,
                      ensure_ascii=False,
                      indent=2,
                  )

              temp.replace(final)

          print("======================================")
          print("CHART MARKET DATA SYNC COMPLETE")
          print("Symbols            :", len(symbol_wise))
          print("Last results       :", len(last_results))
          print("Upcoming results   :", len(upcoming))
          print("Corporate actions  :", len(corporate_actions))
          print("Board meetings     :", len(board_meetings))
          print("Bulk deals         :", len(bulk_deals))
          print("Block deals        :", len(block_deals))
          print("FII/DII latest rows:", len(fii_rows))
          print("FII/DII history    :", len(fii_history))
          print("======================================")

          if len(symbol_wise) < 1000:
              raise RuntimeError(
                  f"Only {len(symbol_wise)} symbols were built. "
                  "Refusing partial results update."
              )
          PY

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json

          with open("data/results.json", encoding="utf-8") as f:
              results = json.load(f)

          with open("data/corporate_events.json", encoding="utf-8") as f:
              corporate = json.load(f)

          with open("data/fii_dii.json", encoding="utf-8") as f:
              fii = json.load(f)

          symbol_count = len(results.get("symbolWise", []))

          if symbol_count < 1000:
              raise SystemExit(
                  f"Results symbol count too small: {symbol_count}"
              )

          if len(corporate.get("symbolWise", [])) < 1000:
              raise SystemExit("Corporate event symbol map is incomplete")

          if not fii.get("data"):
              raise SystemExit("FII/DII latest data is empty")

          print("Validation passed")
          print("Result symbols:", symbol_count)
          print("Corporate symbols:", len(corporate.get("symbolWise", [])))
          print("FII/DII rows:", len(fii.get("data", [])))
          print("FII/DII history:", len(fii.get("history", [])))
          PY

      - name: Commit and push chart data
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/results.json \
            data/corporate_events.json \
            data/market_events.json \
            data/fii_dii.json \
            data/fii_dii_history.json

          if git diff --cached --quiet; then
            echo "No chart market-data changes."
            exit 0
          fi

          git commit -m "Sync chart market data"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt: $attempt"
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Chart data push successful."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            sleep 5
          done

          echo "ERROR: Could not push chart market data."
          exit 1
