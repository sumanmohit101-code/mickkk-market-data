name: Update Order Book

on:
  schedule:
    - cron: "45 15 * * 1-5" # 21:15 IST, Monday-Friday
  workflow_dispatch:
    inputs:
      days:
        description: "Kitne din peeche tak dekhna hai (pehli baar 120 daal sakte ho)"
        default: "3"
      max:
        description: "Ek run mein max PDFs"
        default: "30"

concurrency:
  group: orderbook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extract order books
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/orderbook_ai.py "${{ github.event.inputs.days || '3' }}" "${{ github.event.inputs.max || '30' }}"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orderbook.json

          if git diff --cached --quiet; then
            echo "No order book changes."
            exit 0
          fi

          git commit -m "Auto-update order book data"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "Push successful."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done

          echo "ERROR: Could not push after 5 attempts."
          exit 1
