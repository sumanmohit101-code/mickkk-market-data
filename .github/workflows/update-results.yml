name: Update NSE Results Calendar

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Force full 5-quarter history backfill (re-fetch the whole window)"
        type: boolean
        default: false
  schedule:
    - cron: "30 4 * * 1-5"   # 10:00 IST - refresh upcoming calendar
    - cron: "30 14 * * 1-5"  # 20:00 IST - capture results filed after market hours

permissions:
  contents: write

# Separate group from the stock-data workflow: both already push with
# fetch + rebase + retry, and sharing one group could silently cancel a
# queued run when another one is pending.
concurrency:
  group: nse-results-calendar
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Fetch NSE results calendar and 5-quarter history
        shell: bash
        env:
          FORCE_BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          from collections import defaultdict
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from curl_cffi import requests

          IST = ZoneInfo("Asia/Kolkata")
          now = datetime.now(IST)
          today = now.date()
          tomorrow = today + timedelta(days=1)
          week_end = today + timedelta(days=(6 - today.weekday()))

          # ---- history policy: 5 quarters -------------------------------
          KEEP_RESULTS_PER_SYMBOL = 5      # latest 5 results per stock
          HISTORY_WINDOW_DAYS = 500        # hard window (5 quarters + filing lag)
          UPCOMING_LOOKAHEAD_DAYS = 120
          RECENT_REFETCH_DAYS = 45         # every run re-reads the last 45 days
          CHUNK_DAYS = 60                  # backfill is fetched in 60-day chunks
          BACKFILL_IF_OLDEST_NEWER_THAN_DAYS = 90

          history_cutoff = today - timedelta(days=HISTORY_WINDOW_DAYS)
          force_backfill = os.environ.get("FORCE_BACKFILL", "").strip().lower() == "true"

          NSE = "https://www.nseindia.com"
          DATA_DIR = Path("data")
          RESULTS_FILE = DATA_DIR / "results.json"
          HISTORY_DIR = DATA_DIR / "results-history"
          HISTORY_DIR.mkdir(parents=True, exist_ok=True)

          # NOTE: no custom User-Agent here. curl_cffi already sends headers that
          # match the impersonated Chrome TLS fingerprint; overriding the UA with a
          # mismatching string makes NSE more likely to block the request.
          session = requests.Session(impersonate="chrome")
          session.headers.update({
              "accept": "application/json, text/plain, */*",
              "accept-language": "en-US,en;q=0.9",
              "referer": NSE + "/",
          })

          def warm_up():
              home = session.get(NSE + "/", timeout=30)
              if home.status_code != 200:
                  raise RuntimeError(f"NSE homepage failed: {home.status_code}")
              try:
                  session.get(
                      NSE + "/companies-listing/corporate-filings-financial-results",
                      timeout=30,
                  )
              except Exception:
                  pass

          def get_json(url, params=None, retries=3):
              last = None
              for attempt in range(1, retries + 1):
                  try:
                      response = session.get(url, params=params, timeout=45)
                      if response.status_code == 200:
                          return response.json()
                      last = f"HTTP {response.status_code}"
                  except Exception as exc:
                      last = repr(exc)
                  print(f"  retry {attempt}/{retries}: {url} {params or ''} -> {last}")
                  time.sleep(3 * attempt)
                  try:
                      warm_up()
                  except Exception:
                      pass
              raise RuntimeError(f"{url} failed after {retries} attempts: {last}")

          warm_up()

          def rows(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("data", "records", "result"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value
                  for value in payload.values():
                      if isinstance(value, list):
                          return value
              return []

          def clean_text(value):
              return str(value or "").strip()

          def date_of(value):
              """Parse NSE dates, including values that carry a time part such as
              '27-Aug-2026 17:45:12' (NSE broadcast/filing fields do)."""
              value = clean_text(value)
              if not value or value == "-":
                  return None
              value = re.split(r"[ T]", value, maxsplit=1)[0]
              for fmt in (
                  "%d-%b-%Y",
                  "%d-%B-%Y",
                  "%d/%m/%Y",
                  "%Y-%m-%d",
                  "%d-%m-%Y",
              ):
                  try:
                      return datetime.strptime(value, fmt).date()
                  except ValueError:
                      pass
              return None

          def fmt_param(d):
              return d.strftime("%d-%m-%Y")

          def is_result_event(row):
              text = " ".join([
                  clean_text(row.get("purpose")),
                  clean_text(row.get("bm_desc")),
                  clean_text(row.get("description")),
              ]).lower()
              return "financial result" in text

          def event_to_item(row):
              symbol = clean_text(row.get("symbol")).upper()
              d = date_of(row.get("date"))
              if not symbol or not d or not is_result_event(row):
                  return None
              return {
                  "symbol": symbol,
                  "company": clean_text(row.get("company")),
                  "date": d.isoformat(),
                  "purpose": clean_text(row.get("purpose")),
                  "description": clean_text(
                      row.get("bm_desc") or row.get("description")
                  ),
              }

          # ---- master symbol list ---------------------------------------
          tracked_symbols = []
          seen_symbols = set()
          with open("symbols.txt", "r", encoding="utf-8") as f:
              for line in f:
                  symbol = line.strip().upper()
                  if symbol and symbol not in seen_symbols:
                      seen_symbols.add(symbol)
                      tracked_symbols.append(symbol)

          symbol_names = {}
          try:
              with open(DATA_DIR / "symbols.json", "r", encoding="utf-8") as f:
                  catalog = json.load(f)
              if isinstance(catalog, list):
                  for item in catalog:
                      if isinstance(item, dict):
                          symbol = clean_text(item.get("symbol")).upper()
                          name = clean_text(item.get("name"))
                          if symbol:
                              symbol_names[symbol] = name or symbol
          except Exception as exc:
              print("Could not read symbols.json:", repr(exc))

          # ---- previous durable state -----------------------------------
          previous = {}
          if RESULTS_FILE.exists():
              try:
                  with open(RESULTS_FILE, "r", encoding="utf-8") as f:
                      previous = json.load(f)
              except Exception as exc:
                  print("Could not read previous results.json:", repr(exc))
          if not isinstance(previous, dict):
              previous = {}
          existing_history = previous.get("history", []) or []
          previous_upcoming = previous.get("allUpcoming", []) or []

          # ------------------------------------------------------------
          # 1) UPCOMING RESULTS
          # ------------------------------------------------------------
          def load_upcoming():
              attempts = [
                  {
                      "index": "equities",
                      "from_date": fmt_param(today),
                      "to_date": fmt_param(today + timedelta(days=UPCOMING_LOOKAHEAD_DAYS)),
                  },
                  None,  # plain call = NSE default window
              ]
              for params in attempts:
                  try:
                      data = rows(get_json(NSE + "/api/event-calendar", params=params))
                  except Exception as exc:
                      print("event-calendar failed:", params, repr(exc))
                      continue
                  if data:
                      return data
              return None

          raw_upcoming = load_upcoming()
          upcoming_map = {}

          if raw_upcoming is not None:
              for row in raw_upcoming:
                  if not isinstance(row, dict):
                      continue
                  item = event_to_item(row)
                  if not item or date_of(item["date"]) < today:
                      continue
                  key = (item["symbol"], item["date"])   # one entry per stock per day
                  old = upcoming_map.get(key)
                  if old is None or len(item["description"]) > len(old["description"]):
                      upcoming_map[key] = item
          else:
              # NSE unreachable / empty: keep the previous calendar instead of
              # wiping it or failing the whole run (history can still update).
              print("WARNING: event calendar unavailable, reusing previous upcoming list")
              for item in previous_upcoming:
                  if not isinstance(item, dict) or not item.get("symbol"):
                      continue
                  d = date_of(item.get("date"))
                  if d and d >= today:
                      clean = {k: v for k, v in item.items() if k != "declared"}
                      upcoming_map[(clean["symbol"], clean["date"])] = clean
              if not upcoming_map:
                  raise RuntimeError("Event calendar failed and no previous upcoming data to fall back on")

          # ------------------------------------------------------------
          # 2) RESULT HISTORY (5 quarters)
          # ------------------------------------------------------------
          existing_dates = [
              d for d in (
                  date_of(x.get("resultDate")) for x in existing_history if isinstance(x, dict)
              ) if d
          ]
          oldest_existing = min(existing_dates) if existing_dates else None
          needs_backfill = (
              force_backfill
              or oldest_existing is None
              or oldest_existing > history_cutoff + timedelta(days=BACKFILL_IF_OLDEST_NEWER_THAN_DAYS)
          )
          fetch_from = history_cutoff if needs_backfill else today - timedelta(days=RECENT_REFETCH_DAYS)
          print(
              "History fetch mode:",
              "FULL BACKFILL" if needs_backfill else "incremental",
              "| from", fetch_from.isoformat(),
              "| oldest existing:", oldest_existing,
          )

          RESULTS_URL = NSE + "/api/corporates-financial-results"
          fetched_history = []
          for period in ("Quarterly", "Annual", "Half-Yearly", "Others"):
              got = 0
              start = fetch_from
              while start <= today:
                  end = min(start + timedelta(days=CHUNK_DAYS - 1), today)
                  try:
                      data = rows(get_json(RESULTS_URL, params={
                          "index": "equities",
                          "period": period,
                          "from_date": fmt_param(start),
                          "to_date": fmt_param(end),
                      }))
                      fetched_history.extend(data)
                      got += len(data)
                  except Exception as exc:
                      print("Financial results chunk failed:", period, start, end, repr(exc))
                  start = end + timedelta(days=1)
                  time.sleep(0.5)
              # Safety net: the plain call (NSE's default recent window).
              try:
                  data = rows(get_json(RESULTS_URL, params={"index": "equities", "period": period}))
                  fetched_history.extend(data)
                  got += len(data)
              except Exception as exc:
                  print("Financial results default call failed:", period, repr(exc))
              print("Financial results", period, "rows fetched:", got)

          def history_item(row):
              if not isinstance(row, dict):
                  return None
              symbol = clean_text(row.get("symbol")).upper()
              if not symbol:
                  return None
              result_date = None
              for key in ("broadCastDate", "broadcastDate", "filingDate", "exchdisstime"):
                  result_date = date_of(row.get(key))
                  if result_date:
                      break
              if not result_date:
                  return None
              return {
                  "symbol": symbol,
                  "company": clean_text(row.get("companyName")),
                  "resultDate": result_date.isoformat(),
                  "period": clean_text(row.get("period")),
                  "relatingTo": clean_text(row.get("relatingTo")),
                  "periodFrom": clean_text(row.get("fromDate")),
                  "periodTo": clean_text(row.get("toDate")),
                  "consolidated": clean_text(row.get("consolidated")),
                  "audited": clean_text(row.get("audited")),
              }

          def history_key(item):
              return json.dumps({
                  "symbol": item.get("symbol"),
                  "resultDate": item.get("resultDate"),
                  "period": item.get("period", ""),
                  "periodFrom": item.get("periodFrom", ""),
                  "periodTo": item.get("periodTo", ""),
                  "relatingTo": item.get("relatingTo", ""),
              }, sort_keys=True)

          pool = {}

          def add_to_pool(item):
              d = date_of(item.get("resultDate"))
              if not item.get("symbol") or not d or d < history_cutoff or d > today:
                  return
              pool[history_key(item)] = item

          for item in existing_history:
              if isinstance(item, dict):
                  add_to_pool(item)
          for row in fetched_history:
              item = history_item(row)
              if item:
                  add_to_pool(item)

          # One entry per (stock, period-end date): the ORIGINAL declaration is the
          # earliest filing. Revised/re-filed results and Q4+Annual duplicates for
          # the same period-end collapse into a single result.
          groups = {}
          for item in pool.values():
              period_end = date_of(item.get("periodTo"))
              gkey = (item["symbol"], period_end.isoformat() if period_end else "d:" + item["resultDate"])
              rank = (item["resultDate"], 0 if item.get("period") == "Quarterly" else 1)
              current = groups.get(gkey)
              if current is None or rank < current[0]:
                  groups[gkey] = (rank, item)

          per_symbol = defaultdict(list)
          for _, item in groups.values():
              per_symbol[item["symbol"]].append(item)

          history = []
          for symbol, items in per_symbol.items():
              items.sort(key=lambda x: x["resultDate"], reverse=True)
              history.extend(items[:KEEP_RESULTS_PER_SYMBOL])   # keep latest 5 results
          history.sort(key=lambda x: (x["resultDate"], x["symbol"]), reverse=True)

          if existing_history and not history:
              raise RuntimeError("History came out empty although previous history existed; refusing to overwrite")

          # ------------------------------------------------------------
          # 3) DATE FILES (rewritten from the retained history)
          # ------------------------------------------------------------
          by_date = defaultdict(list)
          for item in history:
              by_date[item["resultDate"]].append(item)

          for date_str, items in by_date.items():
              items.sort(key=lambda x: x["symbol"])
              payload = {
                  "source": "NSE",
                  "date": date_str,
                  "updatedAt": now.isoformat(),
                  "timezone": "Asia/Kolkata",
                  "count": len(items),
                  "results": items,
              }
              with open(HISTORY_DIR / f"{date_str}.json", "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))

          # Remove date files that no longer hold any retained result
          # (older than the window, or pushed out by the 5-per-stock cap).
          for path in HISTORY_DIR.glob("*.json"):
              if re.fullmatch(r"\d{4}-\d{2}-\d{2}\.json", path.name) and path.stem not in by_date:
                  path.unlink()

          # ------------------------------------------------------------
          # 4) SHIFT LOGIC
          # ------------------------------------------------------------
          latest_by_symbol = {}
          for item in history:                      # history is sorted newest-first
              latest_by_symbol.setdefault(item["symbol"], item)

          upcoming = sorted(upcoming_map.values(), key=lambda x: (x["date"], x["symbol"]))
          for item in upcoming:
              last = latest_by_symbol.get(item["symbol"])
              # declared = NSE already has a result filed on/after this scheduled date.
              item["declared"] = bool(last and last["resultDate"] >= item["date"])

          for item in upcoming:
              if item["symbol"] not in seen_symbols:
                  seen_symbols.add(item["symbol"])
                  tracked_symbols.append(item["symbol"])
          for item in history:
              if item["symbol"] not in seen_symbols:
                  seen_symbols.add(item["symbol"])
                  tracked_symbols.append(item["symbol"])
          tracked_symbols = sorted(tracked_symbols)

          future_by_symbol = defaultdict(list)
          for item in upcoming:
              if not item["declared"]:              # next result = first NOT-yet-declared date
                  future_by_symbol[item["symbol"]].append(item)

          dates_by_symbol = defaultdict(list)
          for item in history:
              dates_by_symbol[item["symbol"]].append(item["resultDate"])

          symbol_wise = []
          for symbol in tracked_symbols:
              future = future_by_symbol.get(symbol, [])
              last = latest_by_symbol.get(symbol)
              company = (
                  symbol_names.get(symbol)
                  or (last or {}).get("company")
                  or next((x["company"] for x in upcoming if x["symbol"] == symbol and x.get("company")), symbol)
              )
              symbol_wise.append({
                  "symbol": symbol,
                  "company": company,
                  "lastResultDate": last["resultDate"] if last else None,
                  "nextResultDate": future[0]["date"] if future else None,
                  "lastResult": last,
                  "upcomingResults": future,
                  "resultDates": dates_by_symbol.get(symbol, []),   # up to 5, newest first
                  "historyCount": len(dates_by_symbol.get(symbol, [])),
              })

          today_results = [x for x in upcoming if x["date"] == today.isoformat()]
          tomorrow_results = [x for x in upcoming if x["date"] == tomorrow.isoformat()]
          this_week = [x for x in upcoming if today <= date_of(x["date"]) <= week_end]

          output = {
              "source": "NSE",
              "updatedAt": now.isoformat(),
              "timezone": "Asia/Kolkata",
              "historyPolicy": {
                  "keepResultsPerSymbol": KEEP_RESULTS_PER_SYMBOL,
                  "windowDays": HISTORY_WINDOW_DAYS,
                  "dateFiles": "data/results-history/YYYY-MM-DD.json",
              },
              "symbolCount": len(symbol_wise),
              "historyCount": len(history),
              "today": today_results,
              "tomorrow": tomorrow_results,
              "thisWeek": this_week,
              "allUpcoming": upcoming,
              "history": history,
              "lastResults": list(latest_by_symbol.values()),
              "symbolWise": symbol_wise,
          }

          if not symbol_wise:
              raise RuntimeError("No symbols available for results output")

          with open(RESULTS_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, separators=(",", ":"))

          print("======================================")
          print("RESULTS UPDATE COMPLETE")
          print("Tracked symbols:", len(symbol_wise))
          print("History rows (max 5/stock):", len(history))
          print("Symbols with last result:", sum(1 for x in symbol_wise if x["lastResultDate"]))
          print("Symbols with next result:", sum(1 for x in symbol_wise if x["nextResultDate"]))
          print("Today:", len(today_results), "| Tomorrow:", len(tomorrow_results), "| This week:", len(this_week))
          print("Date history files:", len(by_date))
          print("======================================")
          PY

      - name: Validate results data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from datetime import date, datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          KEEP_RESULTS_PER_SYMBOL = 5
          HISTORY_WINDOW_DAYS = 500

          # Use IST, same as the fetch step (the runner clock is UTC).
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date()
          cutoff = today - timedelta(days=HISTORY_WINDOW_DAYS)

          with open("data/results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          symbol_rows = data.get("symbolWise", [])
          history = data.get("history", [])
          if not symbol_rows:
              raise SystemExit("symbolWise is empty")

          per_symbol = Counter()
          history_dates = set()
          for item in history:
              if not isinstance(item, dict):
                  raise SystemExit("Invalid history row")
              d = date.fromisoformat(item["resultDate"])
              if d < cutoff or d > today:
                  raise SystemExit(f"History row outside rolling window: {item}")
              per_symbol[item["symbol"]] += 1
              history_dates.add(item["resultDate"])

          too_many = [s for s, n in per_symbol.items() if n > KEEP_RESULTS_PER_SYMBOL]
          if too_many:
              raise SystemExit(f"More than {KEEP_RESULTS_PER_SYMBOL} results kept for: {too_many[:10]}")

          for item in data.get("allUpcoming", []):
              if date.fromisoformat(item["date"]) < today:
                  raise SystemExit(f"Past event still in allUpcoming: {item}")

          by_date = Path("data/results-history")
          file_dates = set()
          for path in by_date.glob("*.json"):
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}\.json", path.name):
                  raise SystemExit(f"Invalid results-history filename: {path.name}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              file_dates.add(path.stem)
              for item in payload.get("results", []):
                  if item.get("resultDate") != path.stem:
                      raise SystemExit(f"Date file mismatch: {path} contains {item.get('resultDate')}")

          if file_dates != history_dates:
              raise SystemExit(
                  "Date files out of sync with history. "
                  f"missing files: {sorted(history_dates - file_dates)[:5]} "
                  f"stale files: {sorted(file_dates - history_dates)[:5]}"
              )

          print("Validated symbolWise rows:", len(symbol_rows))
          print("Validated history rows:", len(history))
          print("Max results kept for one stock:", max(per_symbol.values()) if per_symbol else 0)
          print("History cutoff:", cutoff.isoformat())
          print("Validated date files:", len(file_dates))
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json data/results-history/
          if git diff --cached --quiet; then
            echo "No results changes."
            exit 0
          fi

          git commit -m "Auto-update NSE results calendar and history"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Results update push successful."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done

          echo "ERROR: Could not push results update after 5 attempts."
          exit 1
