name: Update NSE Results Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-data-main
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Fetch NSE results calendar and history
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          from collections import defaultdict
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from curl_cffi import requests

          IST = ZoneInfo("Asia/Kolkata")
          now = datetime.now(IST)
          today = now.date()
          tomorrow = today + timedelta(days=1)
          week_end = today + timedelta(days=(6 - today.weekday()))
          history_cutoff = today - timedelta(days=365)

          DATA_DIR = Path("data")
          RESULTS_FILE = DATA_DIR / "results.json"
          HISTORY_DIR = DATA_DIR / "results-history"
          HISTORY_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session(impersonate="chrome")
          session.headers.update({
              "accept": "application/json, text/plain, */*",
              "accept-language": "en-US,en;q=0.9",
              "referer": "https://www.nseindia.com/",
              "user-agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/151.0.0.0 Safari/537.36"
              ),
          })

          home = session.get("https://www.nseindia.com/", timeout=30)
          if home.status_code != 200:
              raise RuntimeError(f"NSE homepage failed: {home.status_code}")

          def rows(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("data", "records", "result"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value
                  for value in payload.values():
                      if isinstance(value, list):
                          return value
              return []

          def clean_text(value):
              return str(value or "").strip()

          def date_of(value):
              if not value:
                  return None
              value = clean_text(value)
              for fmt in (
                  "%d-%b-%Y",
                  "%d-%B-%Y",
                  "%d/%m/%Y",
                  "%Y-%m-%d",
                  "%d-%m-%Y",
              ):
                  try:
                      return datetime.strptime(value, fmt).date()
                  except ValueError:
                      pass
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  return parsed.date()
              except Exception:
                  return None

          def is_result_event(row):
              text = " ".join([
                  clean_text(row.get("purpose")),
                  clean_text(row.get("bm_desc")),
                  clean_text(row.get("description")),
              ]).lower()
              return "financial result" in text or "financial results" in text

          def event_to_item(row):
              symbol = clean_text(row.get("symbol")).upper()
              d = date_of(row.get("date"))
              if not symbol or not d or not is_result_event(row):
                  return None
              return {
                  "symbol": symbol,
                  "company": clean_text(row.get("company")),
                  "date": d.isoformat(),
                  "purpose": clean_text(row.get("purpose")),
                  "description": clean_text(
                      row.get("bm_desc") or row.get("description")
                  ),
              }

          # Master symbol list. This remains the canonical list for symbolWise.
          tracked_symbols = []
          with open("symbols.txt", "r", encoding="utf-8") as f:
              for line in f:
                  symbol = line.strip().upper()
                  if symbol and symbol not in tracked_symbols:
                      tracked_symbols.append(symbol)

          symbol_names = {}
          try:
              with open(DATA_DIR / "symbols.json", "r", encoding="utf-8") as f:
                  catalog = json.load(f)
              if isinstance(catalog, list):
                  for item in catalog:
                      if isinstance(item, dict):
                          symbol = clean_text(item.get("symbol")).upper()
                          name = clean_text(item.get("name"))
                          if symbol:
                              symbol_names[symbol] = name or symbol
          except Exception as exc:
              print("Could not read symbols.json:", repr(exc))

          # ------------------------------------------------------------
          # 1) UPCOMING RESULTS: today / tomorrow / this week / allUpcoming
          # ------------------------------------------------------------
          event_response = session.get(
              "https://www.nseindia.com/api/event-calendar",
              timeout=30,
          )
          if event_response.status_code != 200:
              raise RuntimeError(
                  f"NSE event calendar failed: {event_response.status_code}"
              )

          upcoming_map = {}
          for row in rows(event_response.json()):
              if not isinstance(row, dict):
                  continue
              item = event_to_item(row)
              if not item or date_of(item["date"]) < today:
                  continue
              key = (
                  item["symbol"],
                  item["date"],
                  item["description"],
                  item["purpose"],
              )
              upcoming_map[key] = item

          upcoming = sorted(
              upcoming_map.values(),
              key=lambda x: (x["date"], x["symbol"]),
          )

          # ------------------------------------------------------------
          # 2) RESULT HISTORY: fetch NSE financial-result records.
          #    Result date is the actual filing/broadcast date exposed by NSE.
          # ------------------------------------------------------------
          fetched_history = []
          for period in ("Quarterly", "Annual", "Half-Yearly", "Others"):
              url = (
                  "https://www.nseindia.com/api/corporates-financial-results"
                  "?index=equities&period=" + period
              )
              try:
                  response = session.get(url, timeout=30)
                  if response.status_code != 200:
                      print("Financial results HTTP", period, response.status_code)
                      continue
                  fetched_history.extend(rows(response.json()))
              except Exception as exc:
                  print("Financial results error", period, repr(exc))

          def history_item(row):
              if not isinstance(row, dict):
                  return None
              symbol = clean_text(row.get("symbol")).upper()
              if not symbol:
                  return None

              result_date = None
              for key in (
                  "broadCastDate",
                  "broadcastDate",
                  "filingDate",
                  "exchdisstime",
              ):
                  result_date = date_of(row.get(key))
                  if result_date:
                      break

              if not result_date:
                  return None

              return {
                  "symbol": symbol,
                  "company": clean_text(row.get("companyName")),
                  "resultDate": result_date.isoformat(),
                  "period": clean_text(row.get("period")),
                  "relatingTo": clean_text(row.get("relatingTo")),
                  "periodFrom": clean_text(row.get("fromDate")),
                  "periodTo": clean_text(row.get("toDate")),
                  "consolidated": clean_text(row.get("consolidated")),
                  "audited": clean_text(row.get("audited")),
              }

          # Keep the previous history as the durable source, then merge fresh data.
          existing_history = []
          if RESULTS_FILE.exists():
              try:
                  with open(RESULTS_FILE, "r", encoding="utf-8") as f:
                      previous = json.load(f)
                  if isinstance(previous, dict):
                      existing_history = previous.get("history", []) or []
              except Exception as exc:
                  print("Could not read previous results.json:", repr(exc))

          history_map = {}

          def history_key(item):
              return json.dumps({
                  "symbol": item.get("symbol"),
                  "resultDate": item.get("resultDate"),
                  "period": item.get("period", ""),
                  "periodFrom": item.get("periodFrom", ""),
                  "periodTo": item.get("periodTo", ""),
                  "relatingTo": item.get("relatingTo", ""),
              }, sort_keys=True)

          for item in existing_history:
              if not isinstance(item, dict):
                  continue
              d = date_of(item.get("resultDate"))
              if d and d >= history_cutoff and d <= today and item.get("symbol"):
                  history_map[history_key(item)] = item

          for row in fetched_history:
              item = history_item(row)
              if not item:
                  continue
              d = date_of(item["resultDate"])
              if d < history_cutoff or d > today:
                  continue
              history_map[history_key(item)] = item

          history = list(history_map.values())
          history.sort(key=lambda x: (x["resultDate"], x["symbol"]), reverse=True)

          # ------------------------------------------------------------
          # 3) DATE FILES: one durable JSON file per result date.
          #    These are rewritten from the rolling 1-year history on each run.
          # ------------------------------------------------------------
          by_date = defaultdict(list)
          for item in history:
              by_date[item["resultDate"]].append(item)

          for date_str, items in by_date.items():
              items.sort(key=lambda x: x["symbol"])
              date_payload = {
                  "source": "NSE",
                  "date": date_str,
                  "updatedAt": now.isoformat(),
                  "timezone": "Asia/Kolkata",
                  "count": len(items),
                  "results": items,
              }
              with open(HISTORY_DIR / f"{date_str}.json", "w", encoding="utf-8") as f:
                  json.dump(date_payload, f, ensure_ascii=False, indent=2)

          # Remove date files that have fallen outside the rolling 365-day window.
          for path in HISTORY_DIR.glob("*.json"):
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}\.json", path.name):
                  continue
              file_date = date_of(path.stem)
              if file_date and file_date < history_cutoff:
                  path.unlink()

          # ------------------------------------------------------------
          # 4) SHIFT LOGIC:
          #    - upcoming result date is always the nearest future date.
          #    - once that date becomes <= today, it is no longer upcoming.
          #    - lastResultDate comes from durable history.
          # ------------------------------------------------------------
          latest_by_symbol = {}
          for item in history:
              symbol = item["symbol"]
              old = latest_by_symbol.get(symbol)
              if old is None or item["resultDate"] > old["resultDate"]:
                  latest_by_symbol[symbol] = item

          for item in upcoming:
              if item["symbol"] not in tracked_symbols:
                  tracked_symbols.append(item["symbol"])

          for item in history:
              if item["symbol"] not in tracked_symbols:
                  tracked_symbols.append(item["symbol"])

          tracked_symbols = sorted(set(tracked_symbols))

          symbol_wise = []
          for symbol in tracked_symbols:
              future = sorted(
                  [x for x in upcoming if x["symbol"] == symbol],
                  key=lambda x: x["date"],
              )
              last = latest_by_symbol.get(symbol)

              company = (
                  symbol_names.get(symbol)
                  or (last or {}).get("company")
                  or next((x["company"] for x in future if x.get("company")), symbol)
              )

              symbol_wise.append({
                  "symbol": symbol,
                  "company": company,
                  "lastResultDate": last["resultDate"] if last else None,
                  "nextResultDate": future[0]["date"] if future else None,
                  "lastResult": last,
                  "upcomingResults": future,
                  "historyCount": sum(1 for x in history if x["symbol"] == symbol),
              })

          today_results = [x for x in upcoming if x["date"] == today.isoformat()]
          tomorrow_results = [x for x in upcoming if x["date"] == tomorrow.isoformat()]
          this_week = [
              x for x in upcoming
              if today <= date_of(x["date"]) <= week_end
          ]

          output = {
              "source": "NSE",
              "updatedAt": now.isoformat(),
              "timezone": "Asia/Kolkata",
              "historyPolicy": {
                  "windowDays": 365,
                  "autoDeleteOlderThanDays": 365,
                  "dateFiles": "data/results-history/YYYY-MM-DD.json",
              },
              "symbolCount": len(symbol_wise),
              "historyCount": len(history),
              "today": today_results,
              "tomorrow": tomorrow_results,
              "thisWeek": this_week,
              "allUpcoming": upcoming,
              "history": history,
              "lastResults": list(latest_by_symbol.values()),
              "symbolWise": symbol_wise,
          }

          if not symbol_wise:
              raise RuntimeError("No symbols available for results output")

          with open(RESULTS_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("======================================")
          print("RESULTS UPDATE COMPLETE")
          print("Tracked symbols:", len(symbol_wise))
          print("1-year history rows:", len(history))
          print("Symbols with last result:", sum(1 for x in symbol_wise if x["lastResultDate"]))
          print("Symbols with next result:", sum(1 for x in symbol_wise if x["nextResultDate"]))
          print("Today:", len(today_results))
          print("Tomorrow:", len(tomorrow_results))
          print("This week:", len(this_week))
          print("Date history files:", len(by_date))
          print("======================================")
          PY

      - name: Validate results data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date, timedelta
          from pathlib import Path

          with open("data/results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          symbol_rows = data.get("symbolWise", [])
          history = data.get("history", [])
          if not symbol_rows:
              raise SystemExit("symbolWise is empty")

          cutoff = date.today() - timedelta(days=365)
          history_keys = set()

          for item in history:
              if not isinstance(item, dict):
                  raise SystemExit("Invalid history row")
              d = date.fromisoformat(item["resultDate"])
              if d < cutoff or d > date.today():
                  raise SystemExit(
                      f"History row outside rolling window: {item}"
                  )
              history_keys.add((
                  item.get("symbol"),
                  item.get("resultDate"),
                  item.get("period", ""),
                  item.get("periodFrom", ""),
                  item.get("periodTo", ""),
                  item.get("relatingTo", ""),
              ))

          by_date = Path("data/results-history")
          for path in by_date.glob("*.json"):
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}\.json", path.name):
                  raise SystemExit(f"Invalid results-history filename: {path.name}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              expected_date = path.stem
              for item in payload.get("results", []):
                  if item.get("resultDate") != expected_date:
                      raise SystemExit(
                          f"Date file mismatch: {path} contains {item.get('resultDate')}"
                      )

          print("Validated symbolWise rows:", len(symbol_rows))
          print("Validated history rows:", len(history))
          print("History cutoff:", cutoff.isoformat())
          print("Validated date history directory:", by_date)
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/results.json data/results-history/
          if git diff --cached --quiet; then
            echo "No results changes."
            exit 0
          fi

          git commit -m "Auto-update NSE results calendar and history"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Results update push successful."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done

          echo "ERROR: Could not push results update after 5 attempts."
          exit 1
