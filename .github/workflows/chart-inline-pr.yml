name: One-time inline chart data migration

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate-main:
    if: github.head_ref == 'chart-data-migrate-pr'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch charts/index.html on main
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('charts/index.html')
          s = path.read_text(encoding='utf-8')

          needle = "const CHARTS_API_URL = 'https://script.google.com/macros/s/AKfycbx65jssEWWjfjj53X6x8twwZ83kGoEwVOVA6ms_OHS7u9FDRn56U2sYbfW1SvisibwI/exec';"
          if "const GITHUB_DATA_BASE = '../data';" not in s:
              if needle not in s:
                  raise SystemExit('CHARTS_API_URL declaration not found')
              s = s.replace(needle, needle + "\nconst GITHUB_DATA_BASE = '../data';", 1)

          old = '''  if (!allSymbols || !allSymbols.length) {
    try {
      const res = await fetch(`${CHARTS_API_URL}?action=getSymbols`);
      const data = await res.json();
      if (data && Array.isArray(data.symbols) && data.symbols.length) allSymbols = data.symbols;
    } catch(e) {}
  }
  if (!allSymbols || !allSymbols.length) {
    alert('Stock list could not be loaded from Google Sheet.');
    return;
  }'''
          new = '''  if (!allSymbols || !allSymbols.length) {
    try {
      const res = await fetch(`${GITHUB_DATA_BASE}/symbols.json`, { cache: 'no-store' });
      if (res.ok) {
        const payload = await res.json();
        const source = Array.isArray(payload) ? payload : (payload.symbols || payload.data || []);
        const seen = new Set();
        allSymbols = source.map(x => ({
          symbol: String(x.symbol || '').trim().toUpperCase(),
          name: String(x.name || x.symbol || '').trim()
        })).filter(x => x.symbol && !seen.has(x.symbol) && seen.add(x.symbol));
        allSymbols.sort((a,b) => a.symbol.localeCompare(b.symbol, undefined, {numeric:true, sensitivity:'base'}));
      }
    } catch(e) {}
  }
  if (!allSymbols || !allSymbols.length) {
    alert('Stock list could not be loaded from GitHub data/symbols.json.');
    return;
  }'''
          if old not in s:
              raise SystemExit('Google getSymbols fallback block not found')
          s = s.replace(old, new, 1)

          pattern = re.compile(r"async function loadSymbolList\(\)\{.*?\n\}\n\nfunction openSearchModal", re.S)
          replacement = '''async function loadSymbolList(){
  try{
    const res = await fetch(`${GITHUB_DATA_BASE}/symbols.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    const fetched = Array.isArray(payload) ? payload : (payload.symbols || payload.data || []);
    const seen = new Set();
    allSymbols = fetched.map(s => ({
      symbol: String(s.symbol || '').trim().toUpperCase(),
      name: String(s.name || s.symbol || '').trim()
    })).filter(s => s.symbol && !seen.has(s.symbol) && seen.add(s.symbol));
    allSymbols.sort((a,b) => a.symbol.localeCompare(b.symbol, undefined, {numeric:true, sensitivity:'base'}));
    if (allSymbols.length > 0 && !currentSymbol) {
      loadSymbol(allSymbols[0].symbol, allSymbols[0].name, -1);
    }
    refreshWatchlists(false);
  }catch(e){
    console.warn('GitHub symbol list fetch error:', e);
    refreshWatchlists(false);
  }
}

function openSearchModal'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('loadSymbolList function not found')

          s = s.replace('  renderSearchModalResults(list.slice(0, 100));', '  renderSearchModalResults(list);', 1)

          pattern = re.compile(r"async function fetchAndParseOHLC_\(symbol\) \{.*?\n\}\n\nfunction saveCandlesToLocalStorage_", re.S)
          replacement = '''async function fetchAndParseOHLC_(symbol) {
  const cleanSymbol = String(symbol || '').trim().toUpperCase();
  if (!cleanSymbol) throw new Error('Invalid symbol');
  const first = cleanSymbol.charAt(0);
  const bucket = /^[A-Z]$/.test(first) ? first : '0-9';
  const url = `${GITHUB_DATA_BASE}/${encodeURIComponent(bucket)}/${encodeURIComponent(cleanSymbol)}.json`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`GitHub chart data HTTP ${res.status} for ${cleanSymbol}`);
  const payload = await res.json();
  const candles = Array.isArray(payload) ? payload : (payload.candles || payload.records || []);
  if (!Array.isArray(candles) || !candles.length) throw new Error(`No GitHub candle data for ${cleanSymbol}`);
  return candles
    .filter(c => c && c.time && !isNaN(Number(c.close)) && Number(c.close) > 0)
    .map(c => ({
      time: formatToDateOnly(c.time),
      open: Number(c.open ?? c.close),
      high: Number(c.high ?? c.close),
      low: Number(c.low ?? c.close),
      close: Number(c.close),
      volume: Number(c.volume || 0)
    }))
    .sort((a,b) => a.time < b.time ? -1 : 1);
}

function saveCandlesToLocalStorage_'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('fetchAndParseOHLC_ function not found')

          if 'action=getOHLC' in s or 'action=getSymbols' in s:
              raise SystemExit('Google candle/universe endpoints still remain')
          if "const GITHUB_DATA_BASE = '../data';" not in s:
              raise SystemExit('GitHub data base marker missing')

          path.write_text(s, encoding='utf-8')
          print('charts/index.html patched successfully')
          PY

      - name: Commit migrated chart directly to main and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/index.html
          git rm -f .github/workflows/inline-chart-data-migration.yml .chart-inline-migration-trigger 2>/dev/null || true
          git commit -m "Migrate chart stock data to GitHub"
          git push origin HEAD:main

      - name: Clean the temporary PR branch
        if: always()
        shell: bash
        run: |
          set +e
          git fetch origin chart-data-migrate-pr
          git checkout -B chart-data-migrate-pr origin/chart-data-migrate-pr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/chart-inline-pr.yml .github/workflows/inline-chart-data-migration.yml .chart-inline-migration-trigger 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary chart migration workflow"
          git push origin HEAD:chart-data-migrate-pr
