name: Update Indices Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  update-indices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Check index catalogue
        run: |
          test -f data/indices.json
          mkdir -p data/indices
          python - <<'PY'
          import json
          with open("data/indices.json", "r", encoding="utf-8") as f:
              items = json.load(f)
          print(f"Found {len(items)} indices in catalogue")
          print(f"Yahoo mappings: {sum(1 for x in items if x.get('yahoo'))}")
          PY

      - name: Download indices - Yahoo Finance only
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import date, timedelta
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          DATA_DIR = Path("data/indices")
          DATA_DIR.mkdir(parents=True, exist_ok=True)

          with open("data/indices.json", "r", encoding="utf-8") as f:
              indices = json.load(f)

          TODAY = date.today()
          FROM_DATE = TODAY - timedelta(days=5 * 365)

          def num(x):
              try:
                  v = float(x)
                  return None if pd.isna(v) else v
              except Exception:
                  return None

          def candles_from_df(df):
              if df is None or df.empty:
                  return []
              if isinstance(df.columns, pd.MultiIndex):
                  try:
                      df.columns = df.columns.get_level_values(0)
                  except Exception:
                      pass

              out = []
              for dt, row in df.iterrows():
                  op = num(row.get("Open"))
                  hi = num(row.get("High"))
                  lo = num(row.get("Low"))
                  cl = num(row.get("Close"))
                  if any(v is None for v in (op, hi, lo, cl)) or cl <= 0:
                      continue
                  out.append({
                      "time": pd.Timestamp(dt).strftime("%Y-%m-%d"),
                      "open": round(op, 2),
                      "high": round(hi, 2),
                      "low": round(lo, 2),
                      "close": round(cl, 2),
                      "volume": 0
                  })
              unique = {x["time"]: x for x in out}
              return [unique[k] for k in sorted(unique)]

          def save(symbol, candles):
              with open(DATA_DIR / f"{symbol}.json", "w", encoding="utf-8") as f:
                  json.dump(candles, f, separators=(",", ":"))

          def good(candles):
              if not candles:
                  return False
              latest = date.fromisoformat(candles[-1]["time"])
              return len(candles) >= 900 and (TODAY - latest).days <= 10

          success = failed = no_ticker = 0

          print(f"Processing {len(indices)} indices...")
          print("Yahoo Finance ONLY")
          print("NSE fallback is intentionally disabled in this test.")

          for item in indices:
              name = str(item.get("name", "")).strip()
              symbol = str(item.get("symbol", "")).strip().upper()
              ticker = item.get("yahoo")

              print(f"\n========== {name} [{symbol}] ==========")

              if not ticker:
                  no_ticker += 1
                  print("NO YAHOO TICKER -> skipped")
                  continue

              try:
                  print(f"Yahoo ticker: {ticker}")
                  df = yf.download(
                      str(ticker),
                      start=FROM_DATE.isoformat(),
                      end=(TODAY + timedelta(days=1)).isoformat(),
                      interval="1d",
                      auto_adjust=False,
                      progress=False,
                      threads=False,
                      timeout=30,
                  )
                  candles = candles_from_df(df)
                  latest = candles[-1]["time"] if candles else "NONE"
                  print(f"Yahoo returned {len(candles)} candles; latest={latest}")

                  if good(candles):
                      save(symbol, candles)
                      success += 1
                      print(f"SUCCESS: {symbol} -> {len(candles)} candles")
                  else:
                      failed += 1
                      print(f"NOT SAVED: {symbol} -> incomplete/stale")

              except Exception as e:
                  failed += 1
                  print(f"YAHOO ERROR: {symbol} -> {e}")

              time.sleep(1)

          print("\n========== FINAL SUMMARY ==========")
          print(f"Yahoo success : {success}")
          print(f"Yahoo failed  : {failed}")
          print(f"No Yahoo ticker: {no_ticker}")
          print("Finished Yahoo-only index update.")
          PY

      - name: Show index data summary
        run: |
          echo "Index JSON files:"
          find data/indices -type f -name "*.json" | wc -l
          find data/indices -type f -name "*.json" -print | sort

      - name: Commit updated index data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indices/
          if git diff --cached --quiet; then
            echo "No index data changes."
          else
            git commit -m "Update index market data"
            git push
          fi
