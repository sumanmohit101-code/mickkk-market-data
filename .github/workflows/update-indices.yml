name: Update Indices Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  update-indices:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas 'nse[server]==3.2.1'

      - name: Check index catalogue
        run: |
          test -f data/indices.json
          mkdir -p data/indices
          python - <<'PY'
          import json
          with open("data/indices.json", "r", encoding="utf-8") as f:
              items = json.load(f)
          print(f"Found {len(items)} indices in catalogue")
          yahoo_count = sum(1 for x in items if x.get("yahoo"))
          print(f"Yahoo mappings in JSON: {yahoo_count}")
          PY

      - name: Download indices - Yahoo first, NSE fallback
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import date, timedelta
          from pathlib import Path

          import pandas as pd
          import yfinance as yf

          DATA_DIR = Path("data/indices")
          DATA_DIR.mkdir(parents=True, exist_ok=True)

          with open("data/indices.json", "r", encoding="utf-8") as f:
              indices = json.load(f)

          TODAY = date.today()
          FROM_DATE = TODAY - timedelta(days=5 * 365)

          # NSE is intentionally NOT initialized at startup.
          # GitHub Actions sometimes cannot reach NSE's option-chain endpoint.
          # We only import/initialize NSE if an index actually needs fallback.
          nse_client = None

          def clean_number(x):
              try:
                  x = float(x)
                  return None if pd.isna(x) else x
              except Exception:
                  return None

          def yahoo_candles(df):
              if df is None or df.empty:
                  return []

              if isinstance(df.columns, pd.MultiIndex):
                  try:
                      df.columns = df.columns.get_level_values(0)
                  except Exception:
                      pass

              out = []
              for dt, row in df.iterrows():
                  op = clean_number(row.get("Open"))
                  hi = clean_number(row.get("High"))
                  lo = clean_number(row.get("Low"))
                  cl = clean_number(row.get("Close"))

                  if any(v is None for v in (op, hi, lo, cl)) or cl <= 0:
                      continue

                  out.append({
                      "time": pd.Timestamp(dt).strftime("%Y-%m-%d"),
                      "open": round(op, 2),
                      "high": round(hi, 2),
                      "low": round(lo, 2),
                      "close": round(cl, 2),
                      "volume": 0
                  })

              unique = {x["time"]: x for x in out}
              return [unique[k] for k in sorted(unique)]

          def is_recent(candles):
              if not candles:
                  return False
              latest = date.fromisoformat(candles[-1]["time"])
              return (TODAY - latest).days <= 10

          def yahoo_is_good(candles):
              # Keep the original full-history quality rule.
              return len(candles) >= 900 and is_recent(candles)

          def save(symbol, candles):
              with open(DATA_DIR / f"{symbol}.json", "w", encoding="utf-8") as f:
                  json.dump(candles, f, separators=(",", ":"))

          def get_nse_client():
              global nse_client
              if nse_client is not None:
                  return nse_client

              try:
                  from nse import NSE
                  print("Initializing NSE fallback connection...")
                  nse_client = NSE(download_folder=".", server=True, timeout=60)
                  return nse_client
              except Exception as e:
                  print(f"NSE initialization failed: {e}")
                  return None

          def nse_number(row, *keys):
              for key in keys:
                  if key in row:
                      value = clean_number(str(row[key]).replace(",", ""))
                      if value is not None:
                          return value
              return None

          def nse_date(row):
              for key in ("EOD_TIMESTAMP", "TIMESTAMP", "DATE", "Date", "date"):
                  if key in row and row[key]:
                      try:
                          return pd.to_datetime(
                              str(row[key]).strip(), dayfirst=True
                          ).strftime("%Y-%m-%d")
                      except Exception:
                          pass
              return None

          def nse_candles(rows):
              candles = {}
              for row in rows or []:
                  d = nse_date(row)
                  op = nse_number(row, "EOD_OPEN_INDEX_VAL", "OPEN_INDEX_VAL", "OPEN")
                  hi = nse_number(row, "EOD_HIGH_INDEX_VAL", "HIGH_INDEX_VAL", "HIGH")
                  lo = nse_number(row, "EOD_LOW_INDEX_VAL", "LOW_INDEX_VAL", "LOW")
                  cl = nse_number(row, "EOD_CLOSE_INDEX_VAL", "CLOSE_INDEX_VAL", "CLOSE")

                  if not d or any(v is None for v in (op, hi, lo, cl)) or cl <= 0:
                      continue

                  candles[d] = {
                      "time": d,
                      "open": round(op, 2),
                      "high": round(hi, 2),
                      "low": round(lo, 2),
                      "close": round(cl, 2),
                      "volume": 0
                  }

              return [candles[k] for k in sorted(candles)]

          def fetch_nse_chunks(nse, request_name):
              all_rows = []
              chunk_end = TODAY

              while chunk_end >= FROM_DATE:
                  chunk_start = max(FROM_DATE, chunk_end - timedelta(days=299))
                  print(f"    NSE chunk: {chunk_start} -> {chunk_end}")

                  rows = nse.fetch_historical_index_data(
                      request_name,
                      from_date=chunk_start,
                      to_date=chunk_end
                  )
                  all_rows.extend(rows or [])

                  chunk_end = chunk_start - timedelta(days=1)
                  time.sleep(1)

              return nse_candles(all_rows)

          print(f"Processing {len(indices)} indices...")
          print("Yahoo Finance = PRIMARY")
          print("NSE = LAZY FALLBACK (only if Yahoo fails/incomplete)")
          print("Incomplete histories will NOT replace existing files.")

          yahoo_success = 0
          yahoo_failed = 0
          nse_success = 0
          nse_failed = 0

          for item in indices:
              name = str(item.get("name", "")).strip()
              symbol = str(item.get("symbol", "")).strip().upper()
              yahoo_symbol = item.get("yahoo")

              print(f"\n========== {name} [{symbol}] ==========")

              # 1) Yahoo primary, directly from data/indices.json
              if yahoo_symbol:
                  try:
                      print(f"Yahoo ticker from JSON: {yahoo_symbol}")

                      df = yf.download(
                          str(yahoo_symbol),
                          start=FROM_DATE.isoformat(),
                          end=(TODAY + timedelta(days=1)).isoformat(),
                          interval="1d",
                          auto_adjust=False,
                          progress=False,
                          threads=False
                      )

                      candles = yahoo_candles(df)
                      latest = candles[-1]["time"] if candles else "NONE"

                      print(
                          f"Yahoo returned {len(candles)} candles; latest={latest}"
                      )

                      if yahoo_is_good(candles):
                          save(symbol, candles)
                          yahoo_success += 1
                          print(f"SUCCESS YAHOO: {symbol} -> {len(candles)} candles")
                          time.sleep(1)
                          continue

                      print("Yahoo data incomplete/stale -> NSE fallback.")

                  except Exception as e:
                      print(f"Yahoo error: {e}")
                      print("NSE fallback.")

              else:
                  print("No Yahoo ticker in JSON -> NSE fallback.")

              # 2) NSE fallback only when actually needed
              nse = get_nse_client()
              if nse is None:
                  nse_failed += 1
                  print(f"NO NSE FALLBACK: {symbol}")
                  continue

              try:
                  # Direct request using the catalogue name. The NSE package
                  # accepts the official index name for historical index data.
                  print(f"NSE request: {name}")

                  candles = fetch_nse_chunks(nse, name)
                  latest = candles[-1]["time"] if candles else "NONE"

                  print(
                      f"NSE returned {len(candles)} candles; latest={latest}"
                  )

                  if len(candles) >= 900 and is_recent(candles):
                      save(symbol, candles)
                      nse_success += 1
                      print(f"SUCCESS NSE: {symbol} -> {len(candles)} candles")
                  else:
                      nse_failed += 1
                      print(
                          f"NO VALID DATA: {symbol} "
                          f"(incomplete/stale; existing file not replaced)"
                      )

              except Exception as e:
                  nse_failed += 1
                  print(f"NSE ERROR: {symbol} -> {e}")

              time.sleep(2)

          print("\n========== FINAL SUMMARY ==========")
          print(f"Yahoo success : {yahoo_success}")
          print(f"Yahoo failed  : {yahoo_failed}")
          print(f"NSE success   : {nse_success}")
          print(f"NSE failed    : {nse_failed}")
          print("Finished updating index market data.")

          # Do not fail the whole workflow merely because NSE is unreachable.
          # Successful Yahoo files can still be committed.
          PY

      - name: Show index data summary
        run: |
          echo "Index JSON files:"
          find data/indices -type f -name "*.json" | wc -l
          find data/indices -type f -name "*.json" -print | sort

      - name: Commit updated index data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/indices/

          if git diff --cached --quiet; then
            echo "No index data changes."
          else
            git commit -m "Update index market data"
            git push
          fi
