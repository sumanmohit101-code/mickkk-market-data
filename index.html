<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICKKK Charts — NSE Market Data</title>
<meta name="description" content="TradingView-style NSE stock and index charts powered by MICKKK Market Data.">
<script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0f14;--panel:#101720;--panel2:#151e29;--line:#24303d;--text:#e8edf3;--muted:#8794a5;--accent:#4f7cff;--green:#25c58a;--red:#f05d6b}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:58px 1fr;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:#0d131b}
.brand{font-weight:800;letter-spacing:.12em;font-size:15px;min-width:105px}.brand span{color:var(--accent)}
.search{position:relative;flex:1;max-width:560px}.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:#111923;color:var(--text);padding:0 42px 0 38px;outline:none}.search input:focus{border-color:#3f67cf}.search .icon{position:absolute;left:13px;top:10px;color:var(--muted)}.kbd{position:absolute;right:10px;top:9px;color:#667384;font-size:11px}
.market{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.body{min-height:0;display:grid;grid-template-columns:270px 1fr}
.sidebar{min-width:0;border-right:1px solid var(--line);background:#0d131a;display:flex;flex-direction:column}
.side-head{padding:14px 14px 8px;color:#aeb8c6;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.list{overflow:auto;padding:4px 8px 14px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:7px;color:#b9c3cf;font-size:13px}.item:hover{background:#141d27;color:#fff}.item.active{background:#1b2a43;color:#fff}.item .sym{font-weight:700}.item .name{font-size:11px;color:#718094;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;min-height:0;display:grid;grid-template-rows:auto 1fr 25px}
.quote{display:flex;align-items:center;gap:18px;padding:13px 18px;border-bottom:1px solid var(--line);background:#0f161f}.instrument{min-width:210px}.instrument .title{font-weight:750;font-size:16px}.instrument .sub{font-size:11px;color:var(--muted);margin-top:3px}.price{font-size:21px;font-weight:750}.change{font-size:12px}.up{color:var(--green)}.down{color:var(--red)}.badge{font-size:10px;border:1px solid #334154;background:#151e29;padding:4px 7px;border-radius:6px;color:#aeb9c7}
.chartwrap{min-height:0;position:relative;background:#0b1016}.chart{position:absolute;inset:0}
.toolbar{position:absolute;z-index:3;left:10px;right:10px;top:10px;display:flex;gap:6px;pointer-events:none}.group{display:flex;gap:2px;padding:3px;background:rgba(13,19,27,.92);border:1px solid var(--line);border-radius:8px;pointer-events:auto}.tool{border:0;background:transparent;color:#8794a5;border-radius:5px;padding:6px 8px;font-size:11px}.tool:hover,.tool.active{background:#1a2738;color:#fff}.spacer{flex:1}.status{display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--line);font-size:10px;color:#657285;background:#0d131a}.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px}
.dropdown{position:absolute;z-index:20;left:0;right:0;top:44px;background:#111923;border:1px solid var(--line);border-radius:9px;box-shadow:0 16px 45px #0008;max-height:380px;overflow:auto;display:none}.result{padding:10px 12px;border-bottom:1px solid #1b2531}.result:hover{background:#172230}.result b{font-size:12px}.result span{display:block;color:#748196;font-size:11px;margin-top:2px}.type{float:right;color:#6d7d91;font-size:10px}
@media(max-width:800px){.body{grid-template-columns:1fr}.sidebar{display:none}.market{display:none}.instrument{min-width:130px}.quote{gap:10px;padding:10px}.price{font-size:18px}.toolbar{overflow:auto}.group{flex:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">MICKKK <span>CHARTS</span></div>
  <div class="search">
    <span class="icon">⌕</span>
    <input id="search" placeholder="Search stock or index — e.g. RELIANCE, NIFTY 50" autocomplete="off">
    <span class="kbd">Ctrl K</span>
    <div id="results" class="dropdown"></div>
  </div>
  <div class="market"><span class="dot"></span>EOD DATA · NSE / BSE</div>
</header>
<div class="body">
  <aside class="sidebar">
    <div class="side-head">Indices</div><div id="indices" class="list"></div>
    <div class="side-head">Popular stocks</div><div id="popular" class="list"></div>
  </aside>
  <main class="main">
    <section class="quote">
      <div class="instrument"><div id="title" class="title">NIFTY 50</div><div id="subtitle" class="sub">Index · NSE</div></div>
      <div id="price" class="price">—</div><div id="change" class="change">—</div>
      <div id="band" class="badge">Price band —</div>
      <div class="spacer"></div><button id="reload" class="tool" title="Reload data">↻ Refresh</button>
    </section>
    <section class="chartwrap">
      <div class="toolbar">
        <div class="group" id="chartTypes"><button class="tool active" data-chart="candle">Candles</button><button class="tool" data-chart="bar">Bars</button><button class="tool" data-chart="line">Line</button></div>
        <div class="group" id="intervals"><button class="tool active" data-interval="1D">1D</button><button class="tool" data-interval="1W">1W</button><button class="tool" data-interval="1M">1M</button></div>
        <div class="group" id="ranges"><button class="tool" data-range="1M">1M</button><button class="tool" data-range="3M">3M</button><button class="tool active" data-range="6M">6M</button><button class="tool" data-range="1Y">1Y</button><button class="tool" data-range="3Y">3Y</button><button class="tool" data-range="5Y">5Y</button><button class="tool" data-range="ALL">All</button></div>
        <div class="spacer"></div>
        <div class="group"><button id="reset" class="tool">Reset</button><button id="volumeToggle" class="tool active">Volume</button></div>
      </div>
      <div id="chart" class="chart"><div class="empty">Loading market data…</div></div>
    </section>
    <footer class="status"><span id="status">Loading symbols…</span><span>Daily OHLCV · Weekly/Monthly candles are aggregated locally</span></footer>
  </main>
</div>
</div>
<script>
const RAW='https://raw.githubusercontent.com/sumanmohit101-code/mickkk-market-data/main/';
const $=id=>document.getElementById(id);
let stocks=[],indices=[],bands={},current={type:'index',symbol:'NIFTY50',name:'NIFTY 50'},raw=[],view=[],chart,mainSeries,volumeSeries;
let chartType='candle',interval='1D',range='6M',showVolume=true;
const popular=['RELIANCE','HDFCBANK','ICICIBANK','TCS','INFY','SBIN','BHARTIARTL','ITC','LT','TITAN','AXISBANK','BAJFINANCE'];

async function getJSON(path){const r=await fetch(RAW+path,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+path);return r.json()}
function bucket(s){return /^[A-Z]/.test(s)?s[0]:'0-9'}
function stockPath(s){return 'data/'+bucket(s)+'/'+encodeURIComponent(s)+'.json'}
function fmt(n){return Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})}
function pct(a,b){return b?((a-b)/b*100):0}
function niceDate(s){return new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}

function initChart(){
  $('chart').innerHTML='';
  chart=LightweightCharts.createChart($('chart'),{layout:{background:{type:'solid',color:'#0b1016'},textColor:'#7f8da1'},grid:{vertLines:{color:'#151e28'},horzLines:{color:'#151e28'}},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},rightPriceScale:{borderColor:'#26313d'},timeScale:{borderColor:'#26313d',timeVisible:false,secondsVisible:false},handleScroll:{mouseWheel:true,pressedMouseMove:true},handleScale:{mouseWheel:true,pinch:true}});
  resize();
  window.addEventListener('resize',resize);
}
function resize(){if(chart)chart.applyOptions({width:$('chart').clientWidth,height:$('chart').clientHeight})}
function clearSeries(){if(!chart)return;for(const s of [mainSeries,volumeSeries]){if(s)try{chart.removeSeries(s)}catch{}}mainSeries=volumeSeries=null}
function aggregate(data,tf){
  if(tf==='1D')return data;
  const map=new Map();
  for(const d of data){
    const dt=new Date(d.time+'T00:00:00');let key;
    if(tf==='1W'){const day=dt.getDay();const monday=new Date(dt);monday.setDate(dt.getDate()-(day===0?6:day-1));key=monday.toISOString().slice(0,10)}
    else key=d.time.slice(0,7)+'-01';
    if(!map.has(key))map.set(key,{time:key,open:d.open,high:d.high,low:d.low,close:d.close,volume:d.volume});
    else{const x=map.get(key);x.high=Math.max(x.high,d.high);x.low=Math.min(x.low,d.low);x.close=d.close;x.volume+=d.volume}
  }
  return [...map.values()];
}
function sliceRange(data,r){
  if(r==='ALL'||!data.length)return data;
  const months={1M:1,3M:3,6M:6,1Y:12,3Y:36,5Y:60}[r]||6;
  const last=new Date(data[data.length-1].time+'T00:00:00');const cut=new Date(last);cut.setMonth(cut.getMonth()-months);
  return data.filter(x=>new Date(x.time+'T00:00:00')>=cut);
}
function draw(){
  clearSeries();
  const d=sliceRange(aggregate(raw,interval),range);
  view=d;
  const C=LightweightCharts;
  const opts={priceLineVisible:true,lastValueVisible:true};
  if(chartType==='candle')mainSeries=chart.addSeries(C.CandlestickSeries,{...opts,upColor:'#25c58a',downColor:'#f05d6b',borderUpColor:'#25c58a',borderDownColor:'#f05d6b',wickUpColor:'#25c58a',wickDownColor:'#f05d6b'});
  else if(chartType==='bar')mainSeries=chart.addSeries(C.BarSeries,{...opts,upColor:'#25c58a',downColor:'#f05d6b'});
  else mainSeries=chart.addSeries(C.LineSeries,{...opts,color:'#4f7cff',lineWidth:2});
  mainSeries.setData(d);
  if(showVolume){volumeSeries=chart.addSeries(C.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'volume',scaleMargins:{top:.82,bottom:0},color:'#3b4858'});volumeSeries.setData(d.map(x=>({time:x.time,value:x.volume,color:x.close>=x.open?'#25c58a55':'#f05d6b55'})));}
  chart.timeScale().fitContent();
  updateQuote();
  $('status').textContent=d.length+' candles · '+niceDate(d[0].time)+' → '+niceDate(d[d.length-1].time);
}
function updateQuote(){
  const d=raw; if(!d.length)return; const last=d[d.length-1],prev=d[d.length-2]||last,c=pct(last.close,prev.close);
  $('price').textContent=fmt(last.close);$('change').textContent=(c>=0?'+':'')+c.toFixed(2)+'%';$('change').className='change '+(c>=0?'up':'down');
  const b=bands[current.symbol];$('band').textContent=b&&b.Band&&b.Band!=='No Band'?'Price band '+b.Band+'%':'Price band —';
}
async function selectInstrument(type,symbol,name){
  current={type,symbol,name};$('title').textContent=name||symbol;$('subtitle').textContent=(type==='index'?'Index · NSE':'Equity · NSE');
  document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x.dataset.symbol===symbol));
  try{raw=await getJSON(type==='index'?'data/indices/'+symbol+'.json':stockPath(symbol));raw=raw.filter(x=>x.open!=null&&x.high!=null&&x.low!=null&&x.close!=null).sort((a,b)=>a.time.localeCompare(b.time));draw();location.hash=symbol}catch(e){$('status').textContent='Could not load '+symbol;console.error(e)}
}
function renderLists(){
  $('indices').innerHTML=indices.map(x=>'<div class="item '+(x.symbol===current.symbol?'active':'')+'" data-symbol="'+x.symbol+'" onclick="selectInstrument(\'index\',\''+x.symbol+'\',\''+x.name.replace(/'/g,"\\'")+'\')"><span><span class="sym">'+x.name+'</span><span class="name">'+x.symbol+'</span></span></div>').join('');
  $('popular').innerHTML=popular.map(s=>{const x=stocks.find(a=>a.symbol===s);return '<div class="item" data-symbol="'+s+'" onclick="selectInstrument(\'stock\',\''+s+'\',\''+(x?x.name:s).replace(/'/g,"\\'")+'\')"><span><span class="sym">'+s+'</span><span class="name">'+(x?x.name:'NSE Equity')+'</span></span></div>'}).join('');
}
function search(q){
  q=q.trim().toUpperCase();if(!q){$('results').style.display='none';return}
  const a=[...indices.map(x=>({...x,type:'index'})),...stocks.map(x=>({...x,type:'stock'}))].filter(x=>x.symbol.includes(q)||x.name.toUpperCase().includes(q)).slice(0,25);
  $('results').innerHTML=a.map(x=>'<div class="result" data-s="'+x.symbol+'" data-t="'+x.type+'"><span class="type">'+(x.type==='index'?'INDEX':'EQUITY')+'</span><b>'+x.symbol+'</b><span>'+x.name+'</span></div>').join('')||'<div class="result">No match</div>';
  $('results').style.display='block';
  document.querySelectorAll('.result[data-s]').forEach(el=>el.onclick=()=>{const x=(el.dataset.t==='index'?indices:stocks).find(z=>z.symbol===el.dataset.s);$('search').value='';$('results').style.display='none';selectInstrument(el.dataset.t,el.dataset.s,x.name)});
}
async function boot(){
  try{
    [stocks,indices]=await Promise.all([getJSON('data/symbols.json'),getJSON('data/indices.json')]);
    try{const p=await getJSON('data/price-bands.json');for(const x of p.records||[])bands[x.Symbol]=x}catch{}
    renderLists();initChart();
    const hash=location.hash.replace('#','').toUpperCase();const ix=indices.find(x=>x.symbol===hash);const st=stocks.find(x=>x.symbol===hash);
    if(ix)selectInstrument('index',ix.symbol,ix.name);else if(st)selectInstrument('stock',st.symbol,st.name);else selectInstrument('index','NIFTY50','NIFTY 50');
    $('status').textContent=stocks.length+' stocks · '+indices.length+' indices loaded';
  }catch(e){$('status').textContent='Data load failed: '+e.message;console.error(e)}
}
$('search').addEventListener('input',e=>search(e.target.value));
$('search').addEventListener('keydown',e=>{if(e.key==='Escape'){$('results').style.display='none';e.target.blur()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('results').style.display='none'});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}});
document.querySelectorAll('#chartTypes .tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('#chartTypes .tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');chartType=b.dataset.chart;draw()});
document.querySelectorAll('#intervals .tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('#intervals .tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');interval=b.dataset.interval;draw()});
document.querySelectorAll('#ranges .tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ranges .tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');range=b.dataset.range;draw()});
$('reset').onclick=()=>chart&&chart.timeScale().fitContent();
$('volumeToggle').onclick=()=>{showVolume=!showVolume;$('volumeToggle').classList.toggle('active',showVolume);draw()};
$('reload').onclick=()=>selectInstrument(current.type,current.symbol,current.name);
boot();
</script>
</body>
</html>
