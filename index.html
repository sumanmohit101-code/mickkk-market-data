<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICKKK.com — Charts Pro</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#080b0f;--surface:#0e1318;--card:#131a22;--card2:#18212c;--border:#1e2d3d;--text:#d4e4f0;--muted:#6e879a;--accent:#00d4ff;--green:#00e676;--red:#ff3d5a;--amber:#ffab00;--font:Arial,sans-serif;--mono:Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}.top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{font:700 17px var(--mono);letter-spacing:1px;color:var(--accent)}.brand span{color:var(--text)}.topRight{display:flex;gap:6px}
.shell{display:flex;height:calc(100vh - 48px)}.main{min-width:0;flex:1;display:flex;flex-direction:column}
.toolbar{height:38px;display:flex;align-items:center;gap:5px;padding:0 8px;border-bottom:1px solid var(--border);background:var(--surface);overflow:auto}
.btn,.sel,.inp{background:var(--card);color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:4px 8px;font-size:11px}.btn:hover,.btn.active{color:var(--accent);border-color:var(--accent);background:rgba(0,212,255,.08)}
.header{height:32px;display:flex;align-items:center;gap:9px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--bg);font-family:var(--mono)}
.sym{font-weight:700;color:var(--text)}.price{font-weight:700}.chg.pos{color:var(--green)}.chg.neg{color:var(--red)}
.chartArea{position:relative;flex:1;min-height:0}.chart{position:absolute;inset:0}.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,11,15,.8);z-index:20;color:var(--muted)}.hidden{display:none!important}
.side{width:310px;min-width:310px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}.sideHead{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:5px}.sideBody{overflow:auto;padding:8px}.watchItem{padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;background:var(--card);cursor:pointer}.watchItem:hover,.watchItem.active{border-color:var(--accent)}.watchName{font-size:10px;color:var(--muted);margin-top:2px}.watchSym{font:700 11px var(--mono)}.watchDel{background:none;border:0;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}.overlay.open{display:flex}.modal{width:min(820px,95vw);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:8px}.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px}.muted{color:var(--muted)}.small{font-size:10px}.mono{font-family:var(--mono)}.row{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-top:1px solid var(--border);font-size:10px}
.sectionTitle{font:700 11px var(--mono);color:var(--accent);padding:7px 0}
@media(max-width:900px){.side{width:250px;min-width:250px}.grid{grid-template-columns:1fr}.toolbar{height:42px}}
body.light{--bg:#fff;--surface:#f7f9fc;--card:#fff;--card2:#eef2f7;--border:#dde3ea;--text:#131722;--muted:#6d7785}
</style>
<link rel="stylesheet" href="charts-github-features.css">
</head>
<body>
<div class="top"><div class="brand">MICKKK<span>.com</span></div><div class="topRight"><button class="btn" onclick="toggleTheme()">☀️ Theme</button><button class="btn" onclick="openEvents()">📅 Events</button><button class="btn" onclick="openAlerts()">🔔 Alerts</button></div></div>
<div class="shell">
  <div class="main">
    <div class="toolbar">
      <input id="search" class="inp" placeholder="Search symbol..." style="width:150px" oninput="renderSearch()">
      <select id="symbolSelect" class="sel" onchange="selectSymbol(this.value)" style="min-width:160px"></select>
      <button class="btn active" onclick="setChartType('candle',this)">Candle</button><button class="btn" onclick="setChartType('line',this)">Line</button>
      <button class="btn" onclick="setRange('1M',this)">1M</button><button class="btn" onclick="setRange('3M',this)">3M</button><button class="btn" onclick="setRange('6M',this)">6M</button><button class="btn active" onclick="setRange('1Y',this)">1Y</button><button class="btn" onclick="setRange('ALL',this)">All</button>
      <button class="btn active" onclick="setTF('D',this)">D</button><button class="btn" onclick="setTF('W',this)">W</button><button class="btn" onclick="setTF('M',this)">M</button>
      <button class="btn" id="ema20" onclick="toggleEMA(20,this)">EMA20</button><button class="btn" id="ema50" onclick="toggleEMA(50,this)">EMA50</button><button class="btn" id="ema200" onclick="toggleEMA(200,this)">EMA200</button>
      <button class="btn" onclick="zoomFit()">↺ Fit</button><button class="btn" onclick="document.documentElement.requestFullscreen?.()">⛶</button>
    </div>
    <div class="header"><span id="hSym" class="sym">—</span><span id="hName" class="muted small"></span><span id="hPrice" class="price">—</span><span id="hChg" class="chg">—</span><span class="muted small">• NSE / GitHub EOD</span></div>
    <div class="chartArea"><div id="chart" class="chart"></div><div id="loading" class="loading hidden">Loading chart…</div></div>
  </div>
  <aside class="side">
    <div class="sideHead"><input class="inp" id="wlSearch" placeholder="Filter watchlist" style="flex:1" oninput="renderWatch()"><button class="btn" onclick="addCurrentToWatchlist()">＋</button></div>
    <div id="watchBody" class="sideBody"></div>
  </aside>
</div>

<div class="overlay" id="eventsModal"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="mono" style="margin:0">📅 Market Events — <span id="eventSym" style="color:var(--accent)">—</span></h3><button class="btn" onclick="closeEvents()">Close</button></div><div id="eventsBody" style="margin-top:10px"></div></div></div>
<div class="overlay" id="alertsModal"><div class="modal" style="width:420px"><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="mono" style="margin:0">🔔 Price Alerts</h3><button class="btn" onclick="closeAlerts()">Close</button></div><div class="card" style="margin-top:10px"><div class="small muted">Current stock</div><div class="mono" id="alertSym"></div><input id="alertPrice" class="inp" type="number" placeholder="Target price" style="width:100%;margin-top:7px"><select id="alertCond" class="sel" style="width:100%;margin-top:7px"><option value="ABOVE">Price goes above</option><option value="BELOW">Price goes below</option></select><button class="btn active" style="width:100%;margin-top:7px" onclick="saveAlert()">Set Alert</button></div><div id="alertList" style="margin-top:10px"></div></div></div>

<script>
const DATA_BASE='https://raw.githubusercontent.com/sumanmohit101-code/mickkk-market-data/main/data';
let symbols=[], candlesCache={}, currentSymbol='', currentName='', raw=[], tf='D', chartType='candle', range='1Y';
let chart, series, volumeSeries, emaLines={}, showEma={20:false,50:false,200:false};
let marketData={results:null,events:null,fiiDii:null}, eventsBySymbol={};
let alerts=[];let watchlist=JSON.parse(localStorage.getItem('MICKKK_GITHUB_WATCHLIST_V1')||'null')||[];
const $=id=>document.getElementById(id);
const file=async p=>{const r=await fetch(`${DATA_BASE}/${p}?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`${p} ${r.status}`);return r.json()};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const bucket=s=>/^[A-Z]$/.test(String(s)[0]?.toUpperCase()||'')?String(s)[0].toUpperCase():'0-9';
const candleFile=s=>`${bucket(s)}/${encodeURIComponent(s)}.json`;
function saveWatch(){localStorage.setItem('MICKKK_GITHUB_WATCHLIST_V1',JSON.stringify(watchlist))}
function addCurrentToWatchlist(){if(currentSymbol&&!watchlist.some(x=>x.symbol===currentSymbol)){watchlist.push({symbol:currentSymbol,name:currentName});saveWatch();renderWatch()}}
function renderWatch(){const q=($('wlSearch').value||'').toLowerCase();let list=watchlist.filter(x=>(x.symbol+' '+x.name).toLowerCase().includes(q));$('watchBody').innerHTML=list.length?list.map(x=>`<div class="watchItem ${x.symbol===currentSymbol?'active':''}" onclick="selectSymbol('${esc(x.symbol)}')"><div><div class="watchSym">${esc(x.symbol)}</div><div class="watchName">${esc(x.name)}</div></div><button class="watchDel" onclick="event.stopPropagation();removeWatch('${esc(x.symbol)}')">×</button></div>`).join(''):'<div class="muted small" style="padding:12px">Add stocks with ＋</div>'}
function removeWatch(s){watchlist=watchlist.filter(x=>x.symbol!==s);saveWatch();renderWatch()}
function renderSearch(){const q=($('search').value||'').toLowerCase();const list=symbols.filter(s=>(s.symbol+' '+s.name).toLowerCase().includes(q)).slice(0,80);$('symbolSelect').innerHTML=list.map(x=>`<option value="${esc(x.symbol)}">${esc(x.symbol)} — ${esc(x.name)}</option>`).join('')}
function selectSymbol(s){const x=symbols.find(z=>z.symbol===s)||{symbol:s,name:s};loadSymbol(x.symbol,x.name)}
function aggregate(a,t){if(t==='D')return a;const g={};for(const c of a){const d=new Date(c.time);let k;if(t==='W'){const day=d.getDay()||7;d.setDate(d.getDate()-day+1);k=d.toISOString().slice(0,10)}else{k=c.time.slice(0,7)+'-01'}g[k]??={time:k,open:c.open,high:c.high,low:c.low,close:c.close,volume:0};g[k].high=Math.max(g[k].high,c.high);g[k].low=Math.min(g[k].low,c.low);g[k].close=c.close;g[k].volume+=Number(c.volume||0)}return Object.values(g)}
function ema(a,n){let k=2/(n+1),v=Number(a[0]?.close||0);return a.map(c=>(v=v*k+Number(c.close)*(1-k),{time:c.time,value:v}))}
function fit(){try{chart.timeScale().fitContent()}catch(e){}}
function zoomFit(){fit()}
function setRange(r,b){range=r;document.querySelectorAll('.toolbar .btn').forEach(x=>{if(['1M','3M','6M','1Y','All'].includes(x.textContent))x.classList.remove('active')});b.classList.add('active');draw()}
function setTF(v,b){tf=v;document.querySelectorAll('.toolbar .btn').forEach(x=>{if(['D','W','M'].includes(x.textContent))x.classList.remove('active')});b.classList.add('active');draw()}
function setChartType(v,b){chartType=v;document.querySelectorAll('.toolbar .btn').forEach(x=>{if(['Candle','Line'].includes(x.textContent))x.classList.remove('active')});b.classList.add('active');draw()}
function toggleEMA(n,b){showEma[n]=!showEma[n];b.classList.toggle('active',showEma[n]);draw()}
function toggleTheme(){document.body.classList.toggle('light');chart?.applyOptions({layout:{textColor:document.body.classList.contains('light')?'#707a8a':'#8a9ab0'}})}
function eventBundle(){const r=(marketData.results?.symbolWise||[]).find(x=>x.symbol===currentSymbol)||{lastResult:null,lastResultDate:null,nextResultDate:null,upcomingResults:[]};const e=eventsBySymbol[currentSymbol]||{};return{result:r,corporateActions:e.corporateActions||[],boardMeetings:e.boardMeetings||[],bulkDeals:e.bulkDeals||[],blockDeals:e.blockDeals||[]}}
function markerDate(d){if(!d)return null;const x=String(d).slice(0,10);return/^\d{4}-\d{2}-\d{2}$/.test(x)?x:null}
function eventMarkers(data){const dates=new Set(data.map(x=>x.time)),b=eventBundle(),m=[];const add=(d,p,c,s,t)=>{d=markerDate(d);if(d&&dates.has(d))m.push({time:d,position:p,color:c,shape:s,text:t})};add(b.result.lastResultDate,'aboveBar','#00d4ff','circle','RES');b.corporateActions.forEach(x=>{let z=String(x.subject||'').toLowerCase();add(x.date,'belowBar',z.includes('dividend')?'#00e676':z.includes('bonus')?'#ffab00':z.includes('split')?'#a78bfa':'#00d4ff','circle',z.includes('dividend')?'DIV':z.includes('bonus')?'BON':z.includes('split')?'SPL':'CA')});b.boardMeetings.forEach(x=>add(x.date,'aboveBar','#ff52e2','diamond','BM'));b.bulkDeals.forEach(x=>add(x.date,'aboveBar','#00e676','arrowUp','BULK'));b.blockDeals.forEach(x=>add(x.date,'aboveBar','#ff3d5a','arrowDown','BLOCK'));return m}
function draw(){if(!raw.length)return;let data=aggregate(raw,tf);const days=range==='1M'?31:range==='3M'?93:range==='6M'?186:range==='1Y'?365:Infinity;if(isFinite(days))data=data.slice(-days);series?.setData(chartType==='line'?data.map(x=>({time:x.time,value:x.close})):data.map(x=>({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close})));volumeSeries?.setData(data.map(x=>({time:x.time,value:x.volume||0,color:x.close>=x.open?'#00e67655':'#ff3d5a55'})));Object.entries(emaLines).forEach(([k,l])=>l.setData(showEma[k]?ema(data,Number(k)):[]));try{series.setMarkers(eventMarkers(data))}catch(e){}updateHeader(data[data.length-1],data[data.length-2]||data[data.length-1]);fit()}
function updateHeader(last,prev){$('hSym').textContent=currentSymbol;$('hName').textContent=currentName;if(!last)return;$('hPrice').textContent='₹'+Number(last.close).toFixed(2);const ch=Number(last.close)-Number(prev.close||last.close),pct=prev.close?(ch/prev.close*100):0;$('hChg').textContent=`${ch>=0?'+':''}${ch.toFixed(2)} (${pct>=0?'+':''}${pct.toFixed(2)}%)`;$('hChg').className='chg '+(ch>=0?'pos':'neg')}
async function loadSymbol(s,n){currentSymbol=s;currentName=n;$('loading').classList.remove('hidden');try{raw=candlesCache[s]||await file(candleFile(s));candlesCache[s]=raw;raw=(Array.isArray(raw)?raw:(raw.candles||raw.records||[])).filter(x=>x&&x.time).map(x=>({time:String(x.time).slice(0,10),open:+x.open||+x.close,high:+x.high||+x.close,low:+x.low||+x.close,close:+x.close,volume:+x.volume||0}));draw();alerts.forEach(a=>{if(a.symbol===s)checkAlert(a,raw.at(-1)?.close||0)})}catch(e){alert('Chart data unavailable for '+s)}finally{$('loading').classList.add('hidden');renderWatch()}}
function saveAlerts(){localStorage.setItem('MICKKK_GITHUB_ALERTS_V1',JSON.stringify(alerts))}
function checkAlert(a,p){if(a.triggered)return;const hit=a.condition==='ABOVE'?p>=a.price:p<=a.price;if(hit){a.triggered=true;try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.5)}catch(e){}alert(`🚨 ${a.symbol} alert: ₹${p.toFixed(2)} (${a.condition} ₹${a.price.toFixed(2)})`);saveAlerts()}}
function openAlerts(){$('alertSym').textContent=currentSymbol;$('alertPrice').value=raw.at(-1)?.close||'';$('alertsModal').classList.add('open');renderAlerts()}
function closeAlerts(){$('alertsModal').classList.remove('open')}
function saveAlert(){const p=Number($('alertPrice').value),c=$('alertCond').value;if(!p)return;alerts.push({id:Date.now(),symbol:currentSymbol,price:p,condition:c,triggered:false});saveAlerts();renderAlerts()}
function renderAlerts(){$('alertList').innerHTML=alerts.length?alerts.map((a,i)=>`<div class="row"><span><b>${esc(a.symbol)}</b> ${a.condition==='ABOVE'?'≥':'≤'} ₹${Number(a.price).toFixed(2)}</span><button class="btn" onclick="alerts.splice(${i},1);saveAlerts();renderAlerts()">Delete</button></div>`).join(''):'<div class="muted small" style="padding:10px">No alerts.</div>'}
function dateLabel(d){if(!d)return'—';const x=String(d).slice(0,10);if(!/^\d{4}-\d{2}-\d{2}$/.test(x))return esc(d);const a=x.split('-');return`${a[2]} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+a[1]-1]} ${a[0]}`}
function section(title,rows,render){return`<div class="sectionTitle">${title}</div>${rows&&rows.length?rows.slice(0,20).map(render).join(''):'<div class="card muted small">None</div>'}`}
function openEvents(){$('eventSym').textContent=currentSymbol;$('eventsModal').classList.add('open');const b=eventBundle(),f=marketData.fiiDii?.history||marketData.fiiDii?.latest||[];$('eventsBody').innerHTML=`<div class="grid"><div class="card"><div class="small muted">Last result</div><div class="mono">${dateLabel(b.result.lastResultDate)}</div><div class="small muted">${esc(b.result.lastResult?.period||'')}</div></div><div class="card"><div class="small muted">Next result</div><div class="mono" style="color:var(--accent)">${dateLabel(b.result.nextResultDate)}</div><div class="small muted">${esc(b.result.upcomingResults?.[0]?.purpose||'')}</div></div><div class="card"><div class="small muted">Event count</div><div class="mono">${b.corporateActions.length+b.boardMeetings.length+b.bulkDeals.length+b.blockDeals.length}</div></div></div>${section('Upcoming Results',b.result.upcomingResults,x=>`<div class="row"><span>${dateLabel(x.date)}</span><span class="muted">${esc(x.purpose||x.description||'Financial result')}</span></div>`)}${section('Dividend / Bonus / Split / Rights',b.corporateActions,x=>`<div class="row"><span>${dateLabel(x.date||x.exDate)}</span><span class="muted">${esc(x.subject||'Corporate action')}</span></div>`)}${section('Board Meetings',b.boardMeetings,x=>`<div class="row"><span>${dateLabel(x.date)}</span><span class="muted">${esc(x.purpose||'Board meeting')}</span></div>`)}${section('Bulk Deals',b.bulkDeals,x=>`<div class="row"><span>${dateLabel(x.date)}</span><span class="muted">${esc(x.clientName||'')} ${esc(x.buySell||'')} ${esc(x.quantity||'')}</span></div>`)}${section('Block Deals',b.blockDeals,x=>`<div class="row"><span>${dateLabel(x.date)}</span><span class="muted">${esc(x.clientName||'')} ${esc(x.buySell||'')} ${esc(x.quantity||'')}</span></div>`)}${section('FII / DII Recent History',f.slice(-10).reverse(),x=>`<div class="row"><span>${dateLabel(x.date||x.Date||x.tradeDate)}</span><span class="muted">${esc(x.category||x.type||'FII/DII')} ${x.netValue!=null?'· '+esc(x.netValue):''}</span></div>`)}`}
function closeEvents(){$('eventsModal').classList.remove('open')}
async function init(){alerts=JSON.parse(localStorage.getItem('MICKKK_GITHUB_ALERTS_V1')||'[]')||[];$('search').value='';[symbols,marketData.results,marketData.events,marketData.fiiDii]=await Promise.all([file('symbols.json'),file('results.json').catch(()=>({symbolWise:[]})),file('market_events.json').catch(()=>({bySymbol:{}})),file('fii_dii.json').catch(()=>({history:[]}))]);eventsBySymbol=marketData.events?.bySymbol||{};renderSearch();renderWatch();chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'transparent'},textColor:'#8a9ab0'},grid:{vertLines:{color:'#18212c'},horzLines:{color:'#18212c'}},rightPriceScale:{borderColor:'#1e2d3d'},timeScale:{borderColor:'#1e2d3d',timeVisible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},autoSize:true});series=chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff3d5a',borderUpColor:'#00e676',borderDownColor:'#ff3d5a',wickUpColor:'#00e676',wickDownColor:'#ff3d5a'});volumeSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});chart.priceScale('vol').applyOptions({scaleMargins:{top:.75,bottom:.02}});[20,50,200].forEach(n=>emaLines[n]=chart.addLineSeries({lineWidth:1,color:n===20?'#00d4ff':n===50?'#ffab00':'#a78bfa',priceLineVisible:false,lastValueVisible:false}));const first=watchlist[0]?.symbol||symbols[0]?.symbol;const name=(symbols.find(x=>x.symbol===first)||{}).name||first;await loadSymbol(first,name)}
init().catch(e=>{console.error(e);alert('MICKKK Charts could not initialize: '+e.message)});
</script>
<script src="charts-github-features.js"></script>
</body>
</html>
