<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICKKK.com — Charts Pro Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#080b0f;--surface:#0e1318;--card:#131a22;--card2:#18212c;--border:#1e2d3d;--text:#d4e4f0;--muted:#5a7a94;--accent:#00d4ff;--green:#00e676;--red:#ff3d5a;--amber:#ffab00;--purple:#a78bfa;--font:system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}button,input,select{font:inherit}.shell{height:100vh;display:flex;flex-direction:column}.top{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 10px}.logo{font:700 18px var(--mono);color:var(--accent);margin-right:8px}.controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:1}.btn,.sel,.inp{height:28px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:0 8px}.btn{cursor:pointer}.btn:hover,.btn.active{border-color:var(--accent);color:var(--accent)}.sym{display:flex;gap:5px;position:relative}.sym input{width:240px}.hint{font-size:10px;color:var(--muted)}.main{flex:1;display:flex;min-height:0}.left{width:285px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}.leftHead{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:5px}.leftHead input{flex:1}.list{overflow:auto;padding:5px}.list div{padding:6px 7px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:7px}.list div:hover,.list div.active{background:var(--card2);border-left:2px solid var(--accent)}.list .n{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list .s{font:10px var(--mono);color:var(--accent)}.chartArea{position:relative;flex:1;min-width:0}.chart{position:absolute;left:0;right:0;top:0;bottom:0}.indicatorPane{position:absolute;left:0;right:0;bottom:0;height:165px;background:var(--bg);border-top:1px solid var(--border);display:none;z-index:4}.indicatorPane.open{display:block}.paneChart{position:absolute;inset:0}.header{position:absolute;top:8px;left:10px;z-index:5;background:rgba(14,19,24,.88);padding:5px 8px;border:1px solid var(--border);border-radius:6px;font:12px var(--mono);max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headBtns{position:absolute;top:8px;right:10px;z-index:5;display:flex;gap:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}.modal.open{display:flex}.box{width:520px;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px}.sec{border-bottom:1px solid var(--border);padding:8px 0}.sec:last-child{border-bottom:0}.muted{color:var(--muted);font-size:10px}.badge{font:10px var(--mono);color:var(--accent)}.event{margin-top:5px;font-size:10px;color:var(--muted)}.srch{position:absolute;left:8px;right:8px;top:44px;z-index:7;background:var(--surface);border:1px solid var(--border);border-radius:7px;max-height:360px;overflow:auto;display:none;box-shadow:0 18px 45px rgba(0,0,0,.6)}.srch.open{display:block}.sr{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.sr:hover{background:var(--card2)}.sr b{font:11px var(--mono);color:var(--accent)}
@media(max-width:900px){.left{width:210px}.sym input{width:170px}.controls{gap:3px}.btn,.sel,.inp{height:26px;padding:0 6px}}
</style>
</head>
<body>
<div class="shell">
<div class="top">
 <div class="logo">MICKKK<span style="color:var(--text)">.com</span></div>
 <div class="controls">
  <button class="btn" id="prev">◀</button><button class="btn" id="next">▶</button>
  <div class="sym"><input id="direct" autocomplete="off" placeholder="Type symbol / stock name…"><button class="btn" id="go">Go</button><div class="srch" id="typeahead"></div></div>
  <select id="symbolSelect" class="sel" style="min-width:220px"></select>
  <button class="btn active" data-type="candle">Candle</button><button class="btn" data-type="bar">Bar</button><button class="btn" data-type="line">Line</button>
  <button class="btn active" id="d">D</button><button class="btn" id="w">W</button><button class="btn" id="m">M</button>
  <button class="btn" id="indBtn">fx Indicators</button><span class="hint" id="count"></span>
 </div>
</div>
<div class="main">
 <aside class="left"><div class="leftHead"><input id="search" class="inp" placeholder="Search all symbols / names…"></div><div class="list" id="list"></div></aside>
 <div class="chartArea"><div class="header" id="header">Loading GitHub symbol list…</div><div class="headBtns"><button class="btn" id="fit">Fit</button></div><div class="chart" id="chart"></div><div class="indicatorPane" id="indicatorPane"><div class="paneChart" id="paneChart"></div></div></div>
</div></div>
<div class="modal" id="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><b>Indicators</b><button class="btn" id="close">Close</button></div><div class="muted" style="margin:4px 0 8px">Preserved from the supplied MICKKK Charts reference; calculations now run on GitHub candle data.</div>
<div class="sec"><b>Moving Averages</b><div class="grid">
<label class="row"><span>EMA 9</span><input type="checkbox" data-i="ema9" checked></label><label class="row"><span>EMA 21</span><input type="checkbox" data-i="ema21" checked></label>
<label class="row"><span>EMA 55</span><input type="checkbox" data-i="ema55" checked></label><label class="row"><span>EMA 200</span><input type="checkbox" data-i="ema200" checked></label>
<label class="row"><span>EMA 9/21 Ribbon</span><input type="checkbox" data-i="ribbon" checked></label><label class="row"><span>SMA 20</span><input type="checkbox" data-i="sma20"></label>
<label class="row"><span>SMA 50</span><input type="checkbox" data-i="sma50"></label><label class="row"><span>SMA 200</span><input type="checkbox" data-i="sma200"></label>
<label class="row"><span>Bollinger 20/2</span><input type="checkbox" data-i="bb"></label><label class="row"><span>VWAP</span><input type="checkbox" data-i="vwap"></label>
</div></div>
<div class="sec"><b>Momentum / Volume</b><div class="grid"><label class="row"><span>RSI 14</span><input type="checkbox" data-i="rsi" checked></label><label class="row"><span>RSI MA 9</span><input type="checkbox" data-i="rsima" checked></label><label class="row"><span>MACD 12/26/9</span><input type="checkbox" data-i="macd"></label><label class="row"><span>Volume MA 30</span><input type="checkbox" data-i="volma"></label><label class="row"><span>Pocket Pivot / Rel Vol</span><input type="checkbox" data-i="ppv" checked></label></div></div>
<div class="sec"><b>Pattern / Signal Engines</b><div class="grid"><label class="row"><span>Smart Bar Colors</span><input type="checkbox" data-i="smart"></label><label class="row"><span>Inside Bar / WIB</span><input type="checkbox" data-i="inside"></label><label class="row"><span>Mini Coil Pattern</span><input type="checkbox" data-i="mcp"></label><label class="row"><span>Gap Detector</span><input type="checkbox" data-i="gap"></label><label class="row"><span>Weekly Tight Close</span><input type="checkbox" data-i="wtc"></label><label class="row"><span>9 EMA Sell Signal</span><input type="checkbox" data-i="ema9sell"></label><label class="row"><span>Selling Climax</span><input type="checkbox" data-i="sellclimax"></label><label class="row"><span>Buying Climax</span><input type="checkbox" data-i="buyclimax"></label><label class="row"><span>ATR % Overextension</span><input type="checkbox" data-i="atrext"></label><label class="row"><span>Merged Info Card</span><input type="checkbox" data-i="info" checked></label></div></div>
</div></div>
<script>
const BASE='../data';
let symbols=[],idx=0,currentSymbol='',raw=[],tf='D',type='candle',series,chart,volSeries;let overlays=[];let state={};let paneChart=null,paneMain=null,paneSignal=null;
document.querySelectorAll('[data-i]').forEach(x=>state[x.dataset.i]=x.checked);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function bucket(s){s=String(s||'').trim().toUpperCase();return /^[A-Z]/.test(s)?s[0]:'0-9'}
async function loadSymbols(){const r=await fetch(BASE+'/symbols.json',{cache:'no-store'});if(!r.ok)throw Error('symbols.json HTTP '+r.status);symbols=await r.json();symbols=symbols.filter(x=>x&&x.symbol).map(x=>({symbol:String(x.symbol).toUpperCase(),name:String(x.name||x.symbol)})).sort((a,b)=>a.symbol.localeCompare(b.symbol));$('count').textContent=symbols.length.toLocaleString()+' symbols';$('symbolSelect').innerHTML=symbols.map(x=>`<option value="${esc(x.symbol)}">${esc(x.symbol)} — ${esc(x.name)}</option>`).join('');renderList(symbols);if(symbols[0])await openSymbol(symbols[0].symbol)}
function renderList(list){$('list').innerHTML=list.map(x=>`<div data-s="${esc(x.symbol)}" class="${x.symbol===currentSymbol?'active':''}"><span class="n">${esc(x.name)}</span><span class="s">${esc(x.symbol)}</span></div>`).join('');$('list').querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>openSymbol(e.dataset.s))}
function renderTypeahead(){const q=$('direct').value.trim().toLowerCase();const box=$('typeahead');if(!q){box.classList.remove('open');return}const matches=symbols.filter(x=>(x.symbol+' '+x.name).toLowerCase().includes(q)).slice(0,30);box.innerHTML=matches.map(x=>`<div class="sr" data-s="${esc(x.symbol)}"><span>${esc(x.name)}</span><b>${esc(x.symbol)}</b></div>`).join('');box.classList.toggle('open',matches.length>0);box.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{box.classList.remove('open');openSymbol(e.dataset.s)})}
$('search').oninput=()=>{const q=$('search').value.toLowerCase().trim();renderList(symbols.filter(x=>(x.symbol+' '+x.name).toLowerCase().includes(q)))};$('direct').oninput=renderTypeahead;document.addEventListener('click',e=>{if(!e.target.closest('.sym'))$('typeahead').classList.remove('open')});
function selectIndex(){idx=Math.max(0,symbols.findIndex(x=>x.symbol===currentSymbol));$('symbolSelect').value=currentSymbol}
async function openSymbol(s){const x=symbols.find(y=>y.symbol===String(s).toUpperCase());if(!x)return;currentSymbol=x.symbol;selectIndex();$('header').textContent='Loading '+x.symbol+'…';try{const r=await fetch(`${BASE}/${bucket(x.symbol)}/${encodeURIComponent(x.symbol)}.json`,{cache:'no-store'});if(!r.ok)throw Error('data HTTP '+r.status);const d=await r.json();raw=Array.isArray(d)?d:(d.candles||d.records||[]);if(!raw.length)throw Error('no candle data');draw();}catch(e){$('header').textContent=x.symbol+' — data unavailable';console.error(e)}renderList(symbols.filter(y=>(y.symbol+' '+y.name).toLowerCase().includes(($('search').value||'').toLowerCase().trim())))}
function aggregate(a,k){if(k==='D')return a;if(!a.length)return[];const m=new Map();a.forEach(c=>{const d=new Date(c.time+'T00:00:00');let key;if(k==='W'){d.setDate(d.getDate()-((d.getDay()+6)%7));key=d.toISOString().slice(0,10)}else key=c.time.slice(0,7)+'-01';const z=m.get(key);if(!z)m.set(key,{time:key,open:+c.open,high:+c.high,low:+c.low,close:+c.close,volume:+c.volume||0});else{z.high=Math.max(z.high,+c.high);z.low=Math.min(z.low,+c.low);z.close=+c.close;z.volume+=(+c.volume||0)}});return[...m.values()]}
function ema(a,n){if(!a.length)return[];let k=2/(n+1),v=+a[0].close;return a.map(c=>({time:c.time,value:v=v+(+c.close-v)*k}))}function sma(a,n){let q=[],sum=0;return a.map(c=>{const v=+c.close;q.push(v);sum+=v;if(q.length>n)sum-=q.shift();return q.length===n?{time:c.time,value:sum/n}:null}).filter(Boolean)}function bb(a,n=20,m=2){let u=[],l=[];for(let i=n-1;i<a.length;i++){const z=a.slice(i-n+1,i+1).map(c=>+c.close),mean=z.reduce((p,v)=>p+v,0)/n,sd=Math.sqrt(z.reduce((p,v)=>p+(v-mean)**2,0)/n);u.push({time:a[i].time,value:mean+m*sd});l.push({time:a[i].time,value:mean-m*sd})}return[u,l]}function vwap(a){let pv=0,vv=0;return a.map(c=>{const v=+c.volume||0,tp=(+c.high+ +c.low+ +c.close)/3;pv+=tp*v;vv+=v;return{time:c.time,value:vv?pv/vv:tp}})}function rsi(a,n=14){if(a.length<=n)return[];let g=0,l=0;for(let i=1;i<=n;i++){const d=+a[i].close-+a[i-1].close;if(d>=0)g+=d;else l-=d}g/=n;l/=n;const o=[];for(let i=n;i<a.length;i++){if(i>n){const d=+a[i].close-+a[i-1].close;g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}const rs=l?g/l:100;o.push({time:a[i].time,value:100-100/(1+rs)})}return o}function macd(a){const e12=ema(a,12),e26=ema(a,26),m=new Map(e12.map(x=>[x.time,x.value])),line=e26.map(x=>m.has(x.time)?{time:x.time,value:m.get(x.time)-x.value}:null).filter(Boolean);let k=.2,s=line[0]?.value||0;const sig=line.map((x,i)=>({time:x.time,value:s=i?x.value*k+s*(1-k):x.value}));return[line,sig]}
function clearOverlays(){overlays.forEach(s=>{try{chart.removeSeries(s)}catch(e){}});overlays=[]}function line(data,color,w=1){if(!data.length)return;const s=chart.addLineSeries({color,lineWidth:w,priceLineVisible:false,lastValueVisible:false});s.setData(data);overlays.push(s)}
function addMarkers(data){const mk=[];for(let i=1;i<data.length;i++){const c=data[i],p=data[i-1],body=Math.abs(+c.close-+c.open),range=Math.max(1e-9,+c.high-+c.low);if(state.inside&&+c.high<=+p.high&&+c.low>=+p.low)mk.push({time:c.time,position:'belowBar',color:'#ffab00',shape:'circle',text:'IB'});if(state.gap&&p.close&&Math.abs(+c.open-+p.close)/+p.close*100>=1)mk.push({time:c.time,position:+c.open>+p.close?'belowBar':'aboveBar',color:'#a78bfa',shape:'circle',text:'GAP'});if(state.ema9sell&&i>9){const e=ema(data.slice(0,i+1),9),ev=e[e.length-1].value,ep=e[e.length-2].value;if(+c.close<ev&&+p.close>=ep)mk.push({time:c.time,position:'aboveBar',color:'#ff3d5a',shape:'circle',text:'9S'})}if(state.sellclimax&&body>range*.7&&+c.close<+c.open)mk.push({time:c.time,position:'belowBar',color:'#00e676',shape:'arrowUp',text:'SC'});if(state.buyclimax&&body>range*.7&&+c.close>+c.open)mk.push({time:c.time,position:'aboveBar',color:'#ff3d5a',shape:'arrowDown',text:'BC'});if(state.ppv&&i>5&&+c.volume>0){const prior=Math.max(...data.slice(Math.max(0,i-10),i).map(x=>+x.volume||0));if(+c.volume>prior)mk.push({time:c.time,position:'belowBar',color:'#ffab00',shape:'circle',text:'PP'})}if(state.atrext&&i>=9){const tr=data.slice(Math.max(0,i-8),i+1).map((x,j,arr)=>Math.max(+x.high-+x.low,Math.abs(+x.high-(j?+arr[j-1].close:+x.open)),Math.abs(+x.low-(j?+arr[j-1].close:+x.open))));const ap=(tr.reduce((a,b)=>a+b,0)/tr.length)/(+c.close||1)*100;if(ap>=5)mk.push({time:c.time,position:'aboveBar',color:'#ff3d5a',shape:'circle',text:'ATR'})}if(state.mcp&&i>=3){const a=data[i-3],b=data[i-2],d=data[i-1],r0=+a.high-+a.low,r1=+b.high-+b.low,r2=+d.high-+d.low,r3=range;if(r3<r2&&r2<r1&&r3<r0*.6)mk.push({time:c.time,position:'belowBar',color:'#a78bfa',shape:'square',text:'MCP'})}if(state.wtc&&tf==='W'&&i>=2){const a=data[i-2],b=data[i-1];if(Math.abs(+a.close-+a.open)<(+a.high-+a.low)*.25&&Math.abs(+b.close-+a.close)/Math.max(1,+a.close)<.01&&Math.abs(+c.close-+b.close)/Math.max(1,+b.close)<.01)mk.push({time:c.time,position:'belowBar',color:'#00d4ff',shape:'square',text:'WTC'})}}return mk}
function renderPane(data){const needR=state.rsi||state.rsima,needM=state.macd,needV=state.ppv||state.volma,box=$('indicatorPane');if(!(needR||needM||needV)){box.classList.remove('open');if(paneChart){try{paneChart.remove()}catch(e){}paneChart=null;paneMain=null;paneSignal=null}return}box.classList.add('open');if(!paneChart)paneChart=LightweightCharts.createChart($('paneChart'),{layout:{background:{color:'#080b0f'},textColor:'#8aa1b5'},grid:{vertLines:{color:'#15202b'},horzLines:{color:'#15202b'}},rightPriceScale:{borderColor:'#1e2d3d'},timeScale:{borderColor:'#1e2d3d'}});if(paneMain)try{paneChart.removeSeries(paneMain)}catch(e){}if(paneSignal)try{paneChart.removeSeries(paneSignal)}catch(e){}paneMain=null;paneSignal=null;if(needM){const[l,s]=macd(data);paneMain=paneChart.addLineSeries({color:'#00d4ff',lineWidth:2});paneMain.setData(l);paneSignal=paneChart.addLineSeries({color:'#ffab00',lineWidth:1});paneSignal.setData(s)}else if(needR){const rr=rsi(data);paneMain=paneChart.addLineSeries({color:'#9c27b0',lineWidth:2});paneMain.setData(rr);if(state.rsima){paneSignal=paneChart.addLineSeries({color:'#ffab00',lineWidth:1});paneSignal.setData(sma(rr.map(x=>({time:x.time,close:x.value})),9))}}else if(needV){const v=paneChart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'right'});v.setData(data.map(c=>({time:c.time,value:+c.volume||0,color:+c.close>=+c.open?'#00e67655':'#ff3d5a55'})));if(state.volma){const vm=sma(data.map(c=>({time:c.time,close:+c.volume||0})),30),x=paneChart.addLineSeries({color:'#ff9800',lineWidth:1,priceScaleId:'right'});x.setData(vm)}}paneChart.timeScale().fitContent()}
function makeSeries(){if(type==='line')return chart.addLineSeries({color:'#00d4ff',lineWidth:2});if(type==='bar')return chart.addBarSeries({upColor:'#00e676',downColor:'#ff3d5a',openVisible:true,thinBars:false});return chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff3d5a',borderUpColor:'#00e676',borderDownColor:'#ff3d5a',wickUpColor:'#00e676',wickDownColor:'#00e676'})}
function draw(){const data=aggregate(raw,tf);if(!data.length)return;clearOverlays();if(!series)series=makeSeries();const base=data.map(c=>{const o={time:c.time,open:+c.open,high:+c.high,low:+c.low,close:+c.close};if(state.smart){const bodyPct=Math.abs(+c.close-+c.open)/Math.max(1,+c.open)*100,rangePct=(+c.high-+c.low)/Math.max(1,+c.close)*100;if(bodyPct>4)o.color=+c.close>=+c.open?'#2196f3':'#f59e0b';else if(rangePct<3)o.color='#ffffff'}return o});series.setData(type==='line'?data.map(c=>({time:c.time,value:+c.close})):base);try{series.setMarkers(addMarkers(data))}catch(e){}if(state.ema9)line(ema(data,9),'#ffffff');if(state.ema21)line(ema(data,21),'#c58b1b');if(state.ema55)line(ema(data,55),'#4b55a2');if(state.ema200)line(ema(data,200),'#f87171');if(state.sma20)line(sma(data,20),'#22c55e');if(state.sma50)line(sma(data,50),'#f97316');if(state.sma200)line(sma(data,200),'#ef4444');if(state.vwap)line(vwap(data),'#e879f9');if(state.bb){const[u,l]=bb(data);line(u,'#38bdf8');line(l,'#38bdf8')}if(state.ribbon){line(ema(data,9),'#00e676');line(ema(data,21),'#ff3d5a')}if(state.info){const last=data[data.length-1],yr=data.slice(-252),h=Math.max(...yr.map(c=>+c.high)),l=Math.min(...yr.map(c=>+c.low)),e9=ema(data,9).at(-1)?.value||last.close,e21=ema(data,21).at(-1)?.value||last.close;$('header').innerHTML=`<b>${esc(currentSymbol)}</b> ${esc(symbols.find(x=>x.symbol===currentSymbol)?.name||'')} · C ${(+last.close).toFixed(2)} · 52W H ${h.toFixed(2)} · L ${l.toFixed(2)} · E9 ${(100*(+last.close-e9)/Math.max(1,e9)).toFixed(1)}% · E21 ${(100*(+last.close-e21)/Math.max(1,e21)).toFixed(1)}%`}else $('header').textContent=`${currentSymbol} · ${data.length.toLocaleString()} bars`;renderPane(data);try{chart.timeScale().fitContent()}catch(e){}}
function setType(t){type=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t));if(series){try{chart.removeSeries(series)}catch(e){}series=null}draw()}
function nav(d){if(!symbols.length)return;idx=symbols.findIndex(x=>x.symbol===currentSymbol);idx=(idx+d+symbols.length)%symbols.length;openSymbol(symbols[idx].symbol)}
$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('symbolSelect').onchange=e=>openSymbol(e.target.value);$('go').onclick=()=>{const q=$('direct').value.trim().toUpperCase();const x=symbols.find(s=>s.symbol===q)||symbols.find(s=>(s.symbol+' '+s.name).toUpperCase().includes(q));if(x)openSymbol(x.symbol)};$('direct').onkeydown=e=>{if(e.key==='Enter'){$('go').click();$('typeahead').classList.remove('open')}};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft'||e.key==='ArrowUp')nav(-1);if(e.key==='ArrowRight'||e.key==='ArrowDown')nav(1)});$('fit').onclick=()=>chart.timeScale().fitContent();$('d').onclick=()=>{tf='D';document.querySelectorAll('#d,#w,#m').forEach(x=>x.classList.remove('active'));$('d').classList.add('active');draw()};$('w').onclick=()=>{tf='W';document.querySelectorAll('#d,#w,#m').forEach(x=>x.classList.remove('active'));$('w').classList.add('active');draw()};$('m').onclick=()=>{tf='M';document.querySelectorAll('#d,#w,#m').forEach(x=>x.classList.remove('active'));$('m').classList.add('active');draw()};$('indBtn').onclick=()=>$('modal').classList.add('open');$('close').onclick=()=>$('modal').classList.remove('open');document.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{state[x.dataset.i]=x.checked;localStorage.setItem('MICKKK_INDICATORS_V2',JSON.stringify(state));draw()});try{Object.assign(state,JSON.parse(localStorage.getItem('MICKKK_INDICATORS_V2')||'{}'));document.querySelectorAll('[data-i]').forEach(x=>x.checked=!!state[x.dataset.i])}catch(e){}
chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#080b0f'},textColor:'#8aa1b5'},grid:{vertLines:{color:'#15202b'},horzLines:{color:'#15202b'}},rightPriceScale:{borderColor:'#1e2d3d'},timeScale:{borderColor:'#1e2d3d',rightBarStaysOnScroll:false},crosshair:{mode:0}});series=makeSeries();loadSymbols().catch(e=>$('header').textContent='GitHub symbol/data load failed: '+e.message);
</script>
</body>
</html>
