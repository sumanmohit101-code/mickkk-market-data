*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}button,input,select{font:inherit}.shell{height:100vh;display:flex;flex-direction:column}.top{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 10px}.logo{font:700 18px var(--mono);color:var(--accent);margin-right:8px}.logo span{color:var(--text)}.controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:1}.btn,.sel,.inp{height:28px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:0 8px}.btn{cursor:pointer;color:var(--muted)}.btn:hover,.btn.active{border-color:var(--accent);color:var(--accent)}.sym{display:flex;gap:5px;position:relative}.sym input{width:240px}.hint{font-size:10px;color:var(--muted)}.main{flex:1;display:flex;min-height:0}.left{width:285px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}.leftHead{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:5px}.leftHead input{flex:1}.list{overflow:auto;padding:5px}.list div{padding:6px 7px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:7px}.list div:hover,.list div.active{background:var(--card2);border-left:2px solid var(--accent)}.list .n{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list .s{font:10px var(--mono);color:var(--accent)}.chartArea{position:relative;flex:1;min-width:0}.chart{position:absolute;left:0;right:0;top:0;bottom:0}.indicatorPane{position:absolute;left:0;right:0;bottom:0;height:165px;background:var(--bg);border-top:1px solid var(--border);display:none;z-index:4}.indicatorPane.open{display:block}.paneChart{position:absolute;inset:0}.header{position:absolute;top:8px;left:10px;z-index:5;background:rgba(14,19,24,.88);padding:5px 8px;border:1px solid var(--border);border-radius:6px;font:12px var(--mono);max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headBtns{position:absolute;top:8px;right:10px;z-index:5;display:flex;gap:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}.modal.open{display:flex}.box{width:520px;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px}.sec{border-bottom:1px solid var(--border);padding:8px 0}.sec:last-child{border-bottom:0}.muted{color:var(--muted);font-size:10px}.badge{font:10px var(--mono);color:var(--accent)}.event{margin-top:5px;font-size:10px;color:var(--muted)}.srch{position:absolute;left:0;top:34px;width:520px;z-index:7;background:var(--surface);border:1px solid var(--border);border-radius:7px;max-height:360px;overflow:auto;display:none;box-shadow:0 18px 45px rgba(0,0,0,.6)}.srch.open{display:block}.sr{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.sr:hover{background:var(--card2)}.sr b{font:11px var(--mono);color:var(--accent)}

<script>
const CHARTS_API_URL = 'https://script.google.com/macros/s/AKfycbx65jssEWWjfjj53X6x8twwZ83kGoEwVOVA6ms_OHS7u9FDRn56U2sYbfW1SvisibwI/exec';
const GITHUB_DATA_BASE = '../data';
const FALLBACK_SYMBOLS = [
  { symbol: "20MICRONS", name: "20 Microns Limited" },{ symbol: "ABBOTINDIA", name: "Abbott India Limited" },{ symbol: "DMART", name: "Avenue Supermarts Limited" },{ symbol: "SPARC", name: "Sun Pharma Advanced Research Company Limited" },{ symbol: "SANDHAR", name: "Sandhar Technologies Limited" },{ symbol: "RELIANCE", name: "Reliance Industries Limited" },{ symbol: "TCS", name: "Tata Consultancy Services Limited" },{ symbol: "INFY", name: "Infosys Limited" },{ symbol: "HDFCBANK", name: "HDFC Bank Limited" },{ symbol: "ICICIBANK", name: "ICICI Bank Limited" }
];
let allSymbols=[...FALLBACK_SYMBOLS], currentSymbol='20MICRONS', currentName='20 Microns Limited', panelsArray=[], symbolCandleCache={}, symbolCandlePromiseCache={}, symbolCandleCacheMeta={}, symbolCandleRefreshPromise={};
let currentInterval='D', currentChartType='candle', currentRange='1Y', priceBandsMap={}, watchlists=[], activeWatchlistName='My Watchlist', paneChart=null, paneSeries=null, overlays=[];
const CANDLE_DB_NAME='MICKKK_CHART_LOCAL_CACHE_V1', CANDLE_DB_STORE='candles', CANDLE_CACHE_TTL_MS=15*60*1000;
const defaultIndicators={ema9:true,ema21:true,ema55:true,ema200:true,ribbon:true,sma20:false,sma50:false,sma200:false,bb:false,vwap:false,rsi:true,rsima:true,macd:false,volma:false,ppv:true,smart:false,inside:false,mcp:false,gap:false,wtc:false,ema9sell:false,sellclimax:false,buyclimax:false,atrext:false,info:true};
let activeIndicators={...defaultIndicators};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function bucket(s){s=String(s||'').trim().toUpperCase();return /^[A-Z]/.test(s)?s[0]:'0-9'}
function formatDateOnly(x){if(!x)return'';const s=String(x).slice(0,10);return/^\d{4}-\d{2}-\d{2}$/.test(s)?s:new Date(x).toISOString().slice(0,10)}
async function json(url){const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function loadSymbols(){try{const fetched=await json(GITHUB_DATA_BASE+'/symbols.json');if(Array.isArray(fetched)&&fetched.length){const seen=new Set();allSymbols=fetched.map(s=>({symbol:String(s.symbol||'').trim().toUpperCase(),name:String(s.name||s.symbol||'').trim()})).filter(s=>s.symbol&&!seen.has(s.symbol)&&seen.add(s.symbol)).sort((a,b)=>a.symbol.localeCompare(b.symbol));}}catch(e){console.warn('symbols.json fetch error',e)}$('count').textContent=allSymbols.length.toLocaleString()+' symbols';$('symbolSelect').innerHTML=allSymbols.map(x=>`<option value="${esc(x.symbol)}">${esc(x.symbol)} — ${esc(x.name)}</option>`).join('');renderList(allSymbols);if(allSymbols.find(x=>x.symbol===currentSymbol))await loadSymbol(currentSymbol,currentName);else if(allSymbols[0])await loadSymbol(allSymbols[0].symbol,allSymbols[0].name,-1);renderWatchlists()}
function renderList(list){$('list').innerHTML=list.map(x=>`<div data-s="${esc(x.symbol)}" class="${x.symbol===currentSymbol?'active':''}"><span class="n">${esc(x.name)}</span><span class="s">${esc(x.symbol)}</span></div>`).join('');$('list').querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>loadSymbol(e.dataset.s))}
function renderTypeahead(){const q=$('direct').value.trim().toLowerCase(),box=$('typeahead');if(!q){box.classList.remove('open');return}const matches=allSymbols.filter(x=>(x.symbol+' '+x.name).toLowerCase().includes(q)).slice(0,40);box.innerHTML=matches.map(x=>`<div class="sr" data-s="${esc(x.symbol)}"><span>${esc(x.name)}</span><b>${esc(x.symbol)}</b></div>`).join('');box.classList.toggle('open',matches.length>0);box.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{box.classList.remove('open');loadSymbol(e.dataset.s)})}
$('search').oninput=()=>{const q=$('search').value.toLowerCase().trim();renderList(allSymbols.filter(x=>(x.symbol+' '+x.name).toLowerCase().includes(q)))};$('direct').oninput=renderTypeahead;$('go').onclick=()=>{const q=$('direct').value.trim().toUpperCase();const x=allSymbols.find(s=>s.symbol===q)||allSymbols.find(s=>(s.symbol+' '+s.name).toUpperCase().includes(q));if(x){$('typeahead').classList.remove('open');loadSymbol(x.symbol,x.name)}};$('direct').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('symbolSelect').onchange=e=>{const x=allSymbols.find(s=>s.symbol===e.target.value);if(x)loadSymbol(x.symbol,x.name)};$('prev').onclick=()=>navigateSymbol(-1);$('next').onclick=()=>navigateSymbol(1);
function navigateSymbol(dir){let i=allSymbols.findIndex(x=>x.symbol===currentSymbol);if(i<0)i=0;i=(i+dir+allSymbols.length)%allSymbols.length;const x=allSymbols[i];if(x)loadSymbol(x.symbol,x.name)}
function openCandleDb(){return new Promise(resolve=>{try{if(!indexedDB)return resolve(null);const r=indexedDB.open(CANDLE_DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(CANDLE_DB_STORE))db.createObjectStore(CANDLE_DB_STORE,{keyPath:'symbol'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
async function fetchFreshCandlesFromServer(symbol){const s=String(symbol).toUpperCase(),b=bucket(s);const d=await json(`${GITHUB_DATA_BASE}/${encodeURIComponent(b)}/${encodeURIComponent(s)}.json`);const a=Array.isArray(d)?d:(d.candles||d.records||[]);return a.filter(c=>c&&c.time&&!isNaN(Number(c.close))&&Number(c.close)>0).map(c=>({time:formatDateOnly(c.time),open:Number(c.open??c.close),high:Number(c.high??c.close),low:Number(c.low??c.close),close:Number(c.close),volume:Number(c.volume||0)})).sort((a,b)=>a.time.localeCompare(b.time))}
async function fetchCandles(symbol){if(symbolCandleCache[symbol])return symbolCandleCache[symbol];if(symbolCandlePromiseCache[symbol])return symbolCandlePromiseCache[symbol];symbolCandlePromiseCache[symbol]=(async()=>{try{const db=await openCandleDb();if(db){const c=await new Promise(res=>{const r=db.transaction(CANDLE_DB_STORE,'readonly').objectStore(CANDLE_DB_STORE).get(symbol);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)});if(c&&Array.isArray(c.candles)&&c.candles.length){symbolCandleCache[symbol]=c.candles;symbolCandleCacheMeta[symbol]=c.savedAt||Date.now();return c.candles}}}catch(e){}const c=await fetchFreshCandlesFromServer(symbol);symbolCandleCache[symbol]=c;symbolCandleCacheMeta[symbol]=Date.now();return c})().finally(()=>delete symbolCandlePromiseCache[symbol]);return symbolCandlePromiseCache[symbol]}
function aggregate(a,k){if(k==='D')return a;if(!a.length)return[];const m=new Map();a.forEach(c=>{const d=new Date(c.time+'T00:00:00');let key;if(k==='W'){d.setDate(d.getDate()-((d.getDay()+6)%7));key=d.toISOString().slice(0,10)}else key=c.time.slice(0,7)+'-01';const z=m.get(key);if(!z)m.set(key,{time:key,open:+c.open,high:+c.high,low:+c.low,close:+c.close,volume:+c.volume||0});else{z.high=Math.max(z.high,+c.high);z.low=Math.min(z.low,+c.low);z.close=+c.close;z.volume+=(+c.volume||0)}});return[...m.values()]}
function ema(a,n){if(!a.length)return[];let k=2/(n+1),v=+a[0].close;return a.map(c=>({time:c.time,value:v=v+(+c.close-v)*k}))}function sma(a,n){let q=[],sum=0;return a.map(c=>{const v=+c.close;q.push(v);sum+=v;if(q.length>n)sum-=q.shift();return q.length===n?{time:c.time,value:sum/n}:null}).filter(Boolean)}function bb(a,n=20,m=2){let u=[],l=[];for(let i=n-1;i<a.length;i++){const z=a.slice(i-n+1,i+1).map(c=>+c.close),mean=z.reduce((p,v)=>p+v,0)/n,sd=Math.sqrt(z.reduce((p,v)=>p+(v-mean)**2,0)/n);u.push({time:a[i].time,value:mean+m*sd});l.push({time:a[i].time,value:mean-m*sd})}return[u,l]}function vwap(a){let pv=0,vv=0;return a.map(c=>{const v=+c.volume||0,tp=(+c.high+ +c.low+ +c.close)/3;pv+=tp*v;vv+=v;return{time:c.time,value:vv?pv/vv:tp}})}function rsi(a,n=14){if(a.length<=n)return[];let g=0,l=0;for(let i=1;i<=n;i++){const d=+a[i].close-+a[i-1].close;if(d>=0)g+=d;else l-=d}g/=n;l/=n;const o=[];for(let i=n;i<a.length;i++){if(i>n){const d=+a[i].close-+a[i-1].close;g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}const rs=l?g/l:100;o.push({time:a[i].time,value:100-(100/(1+rs))})}return o}
function setChartSeries(){if(!series)return;const data=aggregate(panelsArray[0].rawDailyCandles,currentInterval);if(currentChartType==='line')series.setData(data.map(x=>({time:x.time,value:+x.close})));else series.setData(data.map(x=>({time:x.time,open:+x.open,high:+x.high,low:+x.low,close:+x.close})));volSeries&&volSeries.setData(data.map(x=>({time:x.time,value:+x.volume||0,color:x.close>=x.open?'#00e67655':'#ff3d5a55'})))}
let series=null,volSeries=null;
function createMainChart(){if(chart)return;chart=LightweightCharts.createChart($('chart'),{layout:{background:{type:'solid',color:'#080b0f'},textColor:'#8a9ab0'},grid:{vertLines:{color:'#18212c'},horzLines:{color:'#18212c'}},rightPriceScale:{borderColor:'#1e2d3d'},timeScale:{borderColor:'#1e2d3d',timeVisible:false},handleScroll:true,handleScale:true,autoSize:true});series=chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff3d5a',borderUpColor:'#00e676',borderDownColor:'#ff3d5a',wickUpColor:'#00e676',wickDownColor:'#ff3d5a'});volSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',scaleMargins:{top:.82,bottom:0}})}
function rebuildChart(){createMainChart();setChartSeries();chart.timeScale().fitContent();renderIndicators();renderHeader()}
function renderHeader(){const p=panelsArray[0];if(!p||!p.rawDailyCandles.length)return;const last=p.rawDailyCandles[p.rawDailyCandles.length-1],prev=p.rawDailyCandles[p.rawDailyCandles.length-2]||last;const chg=+last.close-+prev.close,pct=prev.close?(chg/prev.close*100):0;$('header').innerHTML=`<span style="color:var(--accent);font-weight:700">${esc(currentSymbol)}</span> <span>${esc(currentName)}</span> <span>₹${(+last.close).toFixed(2)}</span> <span class="${chg>=0?'chg pos':'chg neg'}">${chg>=0?'+':''}${chg.toFixed(2)} (${pct>=0?'+':''}${pct.toFixed(2)}%)</span> <span class="muted">${last.time}</span>`}
function clearOverlays(){overlays.forEach(s=>{try{chart.removeSeries(s)}catch(e){}});overlays=[]}
function renderIndicators(){if(!chart||!panelsArray[0]||!panelsArray[0].rawDailyCandles.length)return;clearOverlays();const a=aggregate(panelsArray[0].rawDailyCandles,currentInterval),add=(rows,color)=>{const s=chart.addLineSeries({color,lineWidth:1,priceLineVisible:false,lastValueVisible:false});s.setData(rows);overlays.push(s)};if(activeIndicators.ema9)add(ema(a,9),'#ffffff');if(activeIndicators.ema21)add(ema(a,21),'#c58b1b');if(activeIndicators.ema55)add(ema(a,55),'#4b55a2');if(activeIndicators.ema200)add(ema(a,200),'#f87171');if(activeIndicators.sma20)add(sma(a,20),'#22c55e');if(activeIndicators.sma50)add(sma(a,50),'#f97316');if(activeIndicators.sma200)add(sma(a,200),'#ef4444');if(activeIndicators.bb){const [u,l]=bb(a);add(u,'#38bdf8');add(l,'#38bdf8')}if(activeIndicators.vwap)add(vwap(a),'#e879f9');const need=activeIndicators.rsi||activeIndicators.macd;if(!need){$('indicatorPane').classList.remove('open');$('chart').style.bottom='0';if(paneChart){paneChart.remove();paneChart=null}return}$('indicatorPane').classList.add('open');$('chart').style.bottom='165px';if(!paneChart)paneChart=LightweightCharts.createChart($('paneChart'),{layout:{background:{type:'solid',color:'#080b0f'},textColor:'#8a9ab0'},grid:{vertLines:{color:'#18212c'},horzLines:{color:'#18212c'}},rightPriceScale:{borderColor:'#1e2d3d'},timeScale:{borderColor:'#1e2d3d'},autoSize:true});if(paneSeries){try{paneChart.removeSeries(paneSeries)}catch(e){}}paneSeries=paneChart.addLineSeries({color:activeIndicators.macd?'#00d4ff':'#ffab00',lineWidth:2});paneSeries.setData(activeIndicators.macd?macd(a)[0]:rsi(a));paneChart.timeScale().fitContent()}
function macd(a){const e12=ema(a,12),e26=ema(a,26),m26=new Map(e26.map(x=>[x.time,x.value])),line=[];e12.forEach(x=>{if(m26.has(x.time))line.push({time:x.time,value:x.value-m26.get(x.time)})});let s=0,k=.2;const sig=line.map((x,i)=>({time:x.time,value:s=i? s*(1-k)+x.value*k:x.value}));return[line,sig]}
function openSymbolData(sym,name){return fetchCandles(sym).then(c=>{if(!c.length)throw Error('No candle data for '+sym);panelsArray=[{index:0,symbol:sym,symbolName:name||sym,rawDailyCandles:c}];rebuildChart()})}
async function loadSymbol(sym,name){const x=allSymbols.find(s=>s.symbol===String(sym).toUpperCase());if(!x)return;currentSymbol=x.symbol;currentName=x.name||name||x.symbol;$('symbolSelect').value=currentSymbol;$('header').textContent='Loading '+currentSymbol+'…';try{await openSymbolData(currentSymbol,currentName)}catch(e){$('header').textContent=currentSymbol+' — '+e.message}renderList(allSymbols.filter(y=>(y.symbol+' '+y.name).toLowerCase().includes(($('search').value||'').toLowerCase().trim())));renderWatchlists();}
function setType(t){currentChartType=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t));try{chart.removeSeries(series)}catch(e){}const opts=t==='line'?{color:'#00d4ff',lineWidth:2}:t==='bar'?{upColor:'#00e676',downColor:'#ff3d5a,openVisible:true,thinBars:false}:{upColor:'#00e676',downColor:'#ff3d5a',borderUpColor:'#00e676',borderDownColor:'#ff3d5a',wickUpColor:'#00e676',wickDownColor:'#ff3d5a'};series=t==='line'?chart.addLineSeries(opts):t==='bar'?chart.addBarSeries({upColor:'#00e676',downColor:'#ff3d5a',openVisible:true,thinBars:false}):chart.addCandlestickSeries(opts);setChartSeries();renderIndicators()}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('d').onclick=()=>{currentInterval='D';$('d').classList.add('active');$('w').classList.remove('active');$('m').classList.remove('active');rebuildChart()};$('w').onclick=()=>{currentInterval='W';$('w').classList.add('active');$('d').classList.remove('active');$('m').classList.remove('active');rebuildChart()};$('m').onclick=()=>{currentInterval='M';$('m').classList.add('active');$('d').classList.remove('active');$('w').classList.remove('active');rebuildChart()};$('fit').onclick=()=>chart.timeScale().fitContent();
$('indBtn').onclick=()=>{$('modal').classList.add('open')};$('close').onclick=()=>{$('modal').classList.remove('open')};document.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{activeIndicators[x.dataset.i]=x.checked;renderIndicators()});
function readWatch(){try{return JSON.parse(localStorage.getItem('MICKKK_WATCHLISTS_V2')||'[]')}catch(e){return[]}}function writeWatch(v){try{localStorage.setItem('MICKKK_WATCHLISTS_V2',JSON.stringify(v))}catch(e){}}
function ensureWatch(){let v=readWatch();if(!v.length){v=[{name:'My Watchlist',sections:[{name:'General',symbols:[]}]}];writeWatch(v)}return v}function renderWatchlists(){const v=ensureWatch();const s=$('watchSelect');if(!s)return;const old=s.value;s.innerHTML=v.map(x=>`<option>${esc(x.name)}</option>`).join('');if(v.some(x=>x.name===old))s.value=old;activeWatchlistName=s.value||v[0].name;const wl=v.find(x=>x.name===activeWatchlistName)||v[0];$('watchBody').innerHTML=(wl.sections||[]).map(sec=>`<div class="watch-section"><div class="watch-section-head"><span>${esc(sec.name)}</span><span>${(sec.symbols||[]).length}</span></div>${(sec.symbols||[]).map(sym=>{const x=allSymbols.find(q=>q.symbol===sym)||{symbol:sym,name:sym};return `<div class="watch-row" data-s="${esc(sym)}"><span class="symn">${esc(sym)}</span><span class="namen">${esc(x.name)}</span><button class="del" title="Remove">×</button></div>`}).join('')}</div>`).join('')||'<div class="muted">No symbols. Add one with ＋ Stock.</div>';$('watchBody').querySelectorAll('.watch-row').forEach(r=>{r.onclick=e=>{if(e.target.closest('.del'))return;loadSymbol(r.dataset.s)};const d=r.querySelector('.del');d.onclick=e=>{e.stopPropagation();const sym=r.dataset.s;wl.sections.forEach(sec=>sec.symbols=(sec.symbols||[]).filter(x=>x!==sym));writeWatch(v);renderWatchlists()}})}
$('watchBtn').onclick=()=>{$('watchPanel').classList.toggle('open');renderWatchlists()};$('watchClose').onclick=()=>{$('watchPanel').classList.remove('open')};$('watchSelect').onchange=renderWatchlists;$('watchAddList').onclick=()=>{const n=prompt('Watchlist name:','List '+(readWatch().length+1));if(!n||!n.trim())return;const v=ensureWatch();if(v.some(x=>x.name.toLowerCase()===n.trim().toLowerCase()))return alert('Watchlist already exists.');v.push({name:n.trim(),sections:[{name:'General',symbols:[]} ]});writeWatch(v);renderWatchlists();$('watchSelect').value=n.trim()};$('watchAddStock').onclick=()=>{const v=ensureWatch(),wl=v.find(x=>x.name===activeWatchlistName)||v[0],q=prompt('Symbol to add:',currentSymbol);if(!q)return;const x=allSymbols.find(s=>s.symbol===q.trim().toUpperCase())||allSymbols.find(s=>(s.symbol+' '+s.name).toLowerCase().includes(q.trim().toLowerCase()));if(!x)return alert('Symbol not found');let sec=wl.sections[0]||(wl.sections[0]={name:'General',symbols:[]});if(!sec.symbols.includes(x.symbol))sec.symbols.push(x.symbol);writeWatch(v);renderWatchlists()};$('watchRename').onclick=()=>{const v=ensureWatch(),wl=v.find(x=>x.name===activeWatchlistName);if(!wl)return;const n=prompt('Rename watchlist:',wl.name);if(n&&n.trim()){wl.name=n.trim();writeWatch(v);renderWatchlists()}};$('watchDelete').onclick=()=>{const v=ensureWatch();if(v.length===1)return alert('Keep at least one watchlist.');if(!confirm('Delete current watchlist?'))return;writeWatch(v.filter(x=>x.name!==activeWatchlistName));renderWatchlists()};
function loadEvents(){try{json(GITHUB_DATA_BASE+'/results.json').then(d=>{window.resultsData=d}).catch(()=>{});json(GITHUB_DATA_BASE+'/events.json').then(d=>{window.eventsData=d}).catch(()=>{});json(GITHUB_DATA_BASE+'/fii_dii.json').then(d=>{window.fiiData=d}).catch(()=>{})}catch(e){}}
$('eventsBtn').onclick=()=>{let d=window.resultsData||{};const r=d.symbolWise?.find(x=>x.symbol===currentSymbol);alert(r?`${currentSymbol}\nLast Result: ${r.lastResultDate||'—'}\nNext Result: ${r.nextResultDate||'—'}\nHistory: ${(r.resultHistory||[]).length} records`:`${currentSymbol}\nNo results data loaded yet.`)};
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT')navigateSymbol(-1);if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT')navigateSymbol(1)});
createMainChart();loadEvents();loadSymbols();
</script>
