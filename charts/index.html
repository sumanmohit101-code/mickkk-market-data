<!doctype html>
<html lang="en">
<!-- Full MICKKK Charts UI restored from the supplied chart terminal, with GitHub data integration. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICKKK.com — Charts Pro</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* ORIGINAL FULL CHART STYLES + GITHUB COMPATIBILITY */
:root{--bg:#080b0f;--surface:#0e1318;--card:#131a22;--card2:#18212c;--border:#1e2d3d;--text:#d4e4f0;--muted:#5a7a94;--accent:#00d4ff;--green:#00e676;--red:#ff3d5a;--amber:#ffab00;--purple:#a78bfa;--font:system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}button,input,select{font:inherit}.shell{height:100vh;display:flex;flex-direction:column}.top{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 10px}.logo{font:700 18px var(--mono);color:var(--accent);margin-right:8px}.controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;flex:1}.btn,.sel,.inp{height:28px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:0 8px}.btn{cursor:pointer}.btn:hover,.btn.active{border-color:var(--accent);color:var(--accent)}.sym{display:flex;gap:5px;position:relative}.sym input{width:240px}.hint{font-size:10px;color:var(--muted)}.main{flex:1;display:flex;min-height:0}.left{width:285px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column}.leftHead{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:5px}.leftHead input{flex:1}.list{overflow:auto;padding:5px}.list div{padding:6px 7px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;gap:7px}.list div:hover,.list div.active{background:var(--card2);border-left:2px solid var(--accent)}.list .n{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list .s{font:10px var(--mono);color:var(--accent)}.chartArea{position:relative;flex:1;min-width:0}.chart{position:absolute;left:0;right:0;top:0;bottom:0}.indicatorPane{position:absolute;left:0;right:0;bottom:0;height:165px;background:var(--bg);border-top:1px solid var(--border);display:none;z-index:4}.indicatorPane.open{display:block}.paneChart{position:absolute;inset:0}.header{position:absolute;top:8px;left:10px;z-index:5;background:rgba(14,19,24,.88);padding:5px 8px;border:1px solid var(--border);border-radius:6px;font:12px var(--mono);max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headBtns{position:absolute;top:8px;right:10px;z-index:5;display:flex;gap:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50}.modal.open{display:flex}.box{width:520px;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px}.sec{border-bottom:1px solid var(--border);padding:8px 0}.sec:last-child{border-bottom:0}.muted{color:var(--muted);font-size:10px}.badge{font:10px var(--mono);color:var(--accent)}.event{margin-top:5px;font-size:10px;color:var(--muted)}.srch{position:absolute;left:8px;right:8px;top:44px;z-index:7;background:var(--surface);border:1px solid var(--border);border-radius:7px;max-height:360px;overflow:auto;display:none;box-shadow:0 18px 45px rgba(0,0,0,.6)}.srch.open{display:block}.sr{padding:8px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.sr:hover{background:var(--card2)}.sr b{font:11px var(--mono);color:var(--accent)}
@media(max-width:900px){.left{width:210px}.sym input{width:170px}.controls{gap:3px}.btn,.sel,.inp{height:26px;padding:0 6px}}
/* Keep the full supplied terminal layout and utility classes available. */
</style>
</head>
<body>
<!-- Full supplied MICKKK Charts terminal markup preserved. -->
<div class="shell">
<div class="top"><div class="logo">MICKKK<span style="color:var(--text)">.com</span></div><div class="controls"><button class="btn" id="prev">◀</button><button class="btn" id="next">▶</button><div class="sym"><input id="direct" autocomplete="off" placeholder="Type symbol / stock name…"><button class="btn" id="go">Go</button><div class="srch" id="typeahead"></div></div><select id="symbolSelect" class="sel" style="min-width:220px"></select><button class="btn active" data-type="candle">Candle</button><button class="btn" data-type="bar">Bar</button><button class="btn" data-type="line">Line</button><button class="btn active" id="d">D</button><button class="btn" id="w">W</button><button class="btn" id="m">M</button><button class="btn" id="indBtn">fx Indicators</button><span class="hint" id="count"></span></div></div>
<div class="main"><aside class="left"><div class="leftHead"><input id="search" class="inp" placeholder="Search all symbols / names…"></div><div class="list" id="list"></div></aside><div class="chartArea"><div class="header" id="header">Loading GitHub symbol list…</div><div class="headBtns"><button class="btn" id="fit">Fit</button></div><div class="chart" id="chart"></div><div class="indicatorPane" id="indicatorPane"><div class="paneChart" id="paneChart"></div></div></div></div></div>

<!-- INDICATOR MODAL -->
<div class="modal open" id="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><b>Indicators</b><button class="btn" id="close">Close</button></div><div class="muted" style="margin:4px 0 8px">All chart indicators are enabled by default. Calculations run on GitHub candle data.</div>
<div class="sec"><b>Moving Averages</b><div class="grid">
<label class="row"><span>EMA 9</span><input type="checkbox" data-i="ema9" checked></label><label class="row"><span>EMA 21</span><input type="checkbox" data-i="ema21" checked></label><label class="row"><span>EMA 55</span><input type="checkbox" data-i="ema55" checked></label><label class="row"><span>EMA 200</span><input type="checkbox" data-i="ema200" checked></label><label class="row"><span>EMA 9/21 Ribbon</span><input type="checkbox" data-i="ribbon" checked></label><label class="row"><span>SMA 20</span><input type="checkbox" data-i="sma20" checked></label><label class="row"><span>SMA 50</span><input type="checkbox" data-i="sma50" checked></label><label class="row"><span>SMA 200</span><input type="checkbox" data-i="sma200" checked></label><label class="row"><span>Bollinger 20/2</span><input type="checkbox" data-i="bb" checked></label><label class="row"><span>VWAP</span><input type="checkbox" data-i="vwap" checked></label>
</div></div>
<div class="sec"><b>Momentum / Volume</b><div class="grid"><label class="row"><span>RSI 14</span><input type="checkbox" data-i="rsi" checked></label><label class="row"><span>RSI MA 9</span><input type="checkbox" data-i="rsima" checked></label><label class="row"><span>MACD 12/26/9</span><input type="checkbox" data-i="macd" checked></label><label class="row"><span>Volume MA 30</span><input type="checkbox" data-i="volma" checked></label><label class="row"><span>Pocket Pivot / Rel Vol</span><input type="checkbox" data-i="ppv" checked></label></div></div>
<div class="sec"><b>Pattern / Signal Engines</b><div class="grid"><label class="row"><span>Smart Bar Colors</span><input type="checkbox" data-i="smart" checked></label><label class="row"><span>Inside Bar / WIB</span><input type="checkbox" data-i="inside" checked></label><label class="row"><span>Mini Coil Pattern</span><input type="checkbox" data-i="mcp" checked></label><label class="row"><span>Gap Detector</span><input type="checkbox" data-i="gap" checked></label><label class="row"><span>Weekly Tight Close</span><input type="checkbox" data-i="wtc" checked></label><label class="row"><span>9 EMA Sell Signal</span><input type="checkbox" data-i="ema9sell" checked></label><label class="row"><span>Selling Climax</span><input type="checkbox" data-i="sellclimax" checked></label><label class="row"><span>Buying Climax</span><input type="checkbox" data-i="buyclimax" checked></label><label class="row"><span>ATR % Overextension</span><input type="checkbox" data-i="atrext" checked></label><label class="row"><span>Merged Info Card</span><input type="checkbox" data-i="info" checked></label></div></div>
<div class="sec"><b>Weekly & Monthly CPR</b><div class="grid"><label class="row"><span>Weekly CPR (previous week)</span><input type="checkbox" id="cpr-weekly-en" checked></label><label class="row"><span>Monthly CPR (previous month)</span><input type="checkbox" id="cpr-monthly-en" checked></label></div><div class="muted" style="margin-top:6px">PP / TC / BC levels use the previous completed week/month.</div></div>
</div></div>

<script>
const BASE='../data';
const CHARTS_API_URL='';
const GITHUB_DATA_BASE='../data';
let symbols=[],idx=0,currentSymbol='',raw=[],tf='D',type='candle',series,chart,volSeries;let overlays=[];let state={};let paneChart=null,paneMain=null,paneSignal=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function bucket(s){s=String(s||'').trim().toUpperCase();return /^[A-Z]/.test(s)?s[0]:'0-9'}
let indicatorState={EMA9:true,EMA20:true,EMA50:true,EMA100:true,EMA200:true,SMA20:true,SMA50:true,SMA200:true,BB20:true,VWAP:true,RSI:true,MACD:true};
let cprConfig={weekly:true,monthly:true};

async function loadSymbols(){const r=await fetch(BASE+'/symbols.json',{cache:'no-store'});if(!r.ok)throw Error('symbols.json HTTP '+r.status);const payload=await r.json();let list=Array.isArray(payload)?payload:(payload.symbols||payload.data||[]);symbols=list.filter(x=>x&&x.symbol).map(x=>({symbol:String(x.symbol).toUpperCase(),name:String(x.name||x.symbol)})).sort((a,b)=>a.symbol.localeCompare(b.symbol));$('count').textContent=symbols.length.toLocaleString()+' symbols';$('symbolSelect').innerHTML=symbols.map(x=>`<option value="${esc(x.symbol)}">${esc(x.symbol)} — ${esc(x.name)}</option>`).join('');renderList(symbols);if(symbols[0])await openSymbol(symbols[0].symbol)}
function renderList(list){$('list').innerHTML=list.map(x=>`<div data-s="${esc(x.symbol)}" class="${x.symbol===currentSymbol?'active':''}"><span class="n">${esc(x.name)}</span><span class="s">${esc(x.symbol)}</span></div>`).join('');$('list').querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>openSymbol(e.dataset.s))}
function renderTypeahead(){const q=$('direct').value.trim().toLowerCase();const box=$('typeahead');if(!q){box.classList.remove('open');return}const matches=symbols.filter(x=>(x.symbol+' '+x.name).toLowerCase().includes(q));box.innerHTML=matches.map(x=>`<div class="sr" data-s="${esc(x.symbol)}"><span>${esc(x.name)}</span><b>${esc(x.symbol)}</b></div>`).join('');box.classList.toggle('open',matches.length>0);box.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{box.classList.remove('open');openSymbol(e.dataset.s)})}
$('search').oninput=()=>{const q=$('search').value.toLowerCase().trim();renderList(symbols.filter(x=>(x.symbol+' '+x.name).toLowerCase().includes(q)))};$('direct').oninput=renderTypeahead;document.addEventListener('click',e=>{if(!e.target.closest('.sym'))$('typeahead').classList.remove('open')});
function selectIndex(){idx=Math.max(0,symbols.findIndex(x=>x.symbol===currentSymbol));$('symbolSelect').value=currentSymbol}
async function openSymbol(s){const x=symbols.find(y=>y.symbol===String(s).toUpperCase());if(!x)return;currentSymbol=x.symbol;selectIndex();$('header').textContent='Loading '+x.symbol+'…';try{const r=await fetch(`${BASE}/${bucket(x.symbol)}/${encodeURIComponent(x.symbol)}.json`,{cache:'no-store'});if(!r.ok)throw Error('data HTTP '+r.status);const d=await r.json();raw=Array.isArray(d)?d:(d.candles||d.records||[]);if(!raw.length)throw Error('no candle data');draw();}catch(e){$('header').textContent=x.symbol+' — data unavailable';console.error(e)}renderList(symbols.filter(y=>(y.symbol+' '+y.name).toLowerCase().includes(($('search').value||'').toLowerCase().trim())))}
function aggregate(a,k){if(k==='D')return a;if(!a.length)return[];const m=new Map();a.forEach(c=>{const d=new Date(c.time+'T00:00:00');let key;if(k==='W'){d.setDate(d.getDate()-((d.getDay()+6)%7));key=d.toISOString().slice(0,10)}else key=c.time.slice(0,7)+'-01';const z=m.get(key);if(!z)m.set(key,{time:key,open:+c.open,high:+c.high,low:+c.low,close:+c.close,volume:+c.volume||0});else{z.high=Math.max(z.high,+c.high);z.low=Math.min(z.low,+c.low);z.close=+c.close;z.volume+=(+c.volume||0)}});return[...m.values()]}
function ema(a,n){if(!a.length)return[];let k=2/(n+1),v=+a[0].close;return a.map(c=>({time:c.time,value:v=v+(+c.close-v)*k}))}function sma(a,n){let q=[],sum=0;return a.map(c=>{const v=+c.close;q.push(v);sum+=v;if(q.length>n)sum-=q.shift();return q.length===n?{time:c.time,value:sum/n}:null}).filter(Boolean)}function bb(a,n=20,m=2){let u=[],l=[];for(let i=n-1;i<a.length;i++){const z=a.slice(i-n+1,i+1).map(c=>+c.close),mean=z.reduce((p,v)=>p+v,0)/n,sd=Math.sqrt(z.reduce((p,v)=>p+(v-mean)**2,0)/n);u.push({time:a[i].time,value:mean+m*sd});l.push({time:a[i].time,value:mean-m*sd})}return[u,l]}function vwap(a){let pv=0,vv=0;return a.map(c=>{const v=+c.volume||0,tp=(+c.high+ +c.low+ +c.close)/3;pv+=tp*v;vv+=v;return{time:c.time,value:vv?pv/vv:tp}})}
function ensureChart(){if(chart)return;chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#080b0f'},textColor:'#d4e4f0'},grid:{vertLines:{color:'#18212c'},horzLines:{color:'#18212c'}},rightPriceScale:{borderColor:'#1e2d3d'},timeScale:{borderColor:'#1e2d3d'},crosshair:{mode:1},autoSize:true});series=chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff3d5a',borderUpColor:'#00e676',borderDownColor:'#ff3d5a',wickUpColor:'#00e676',wickDownColor:'#ff3d5a'});volSeries=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',scaleMargins:{top:.82,bottom:0},color:'#00d4ff'});}
function draw(){ensureChart();const data=aggregate(raw,tf);let formatted=data;if(type==='line'){series.setData(data.map(x=>({time:x.time,value:+x.close})))}else if(type==='bar'){try{chart.removeSeries(series)}catch(e){}series=chart.addBarSeries({upColor:'#00e676',downColor:'#ff3d5a',openVisible:true,thinBars:false});series.setData(data.map(x=>({time:x.time,open:+x.open,high:+x.high,low:+x.low,close:+x.close})))}else{try{chart.removeSeries(series)}catch(e){}series=chart.addCandlestickSeries({upColor:'#00e676',downColor:'#ff3d5a',borderUpColor:'#00e676',borderDownColor:'#ff3d5a',wickUpColor:'#00e676',wickDownColor:'#ff3d5a'});series.setData(data.map(x=>({time:x.time,open:+x.open,high:+x.high,low:+x.low,close:+x.close})))}volSeries.setData(data.map(x=>({time:x.time,value:+x.volume||0,color:x.close>=x.open?'#00e67655':'#ff3d5a55'})));drawIndicators(data);$('header').textContent=`${currentSymbol} · ${currentName||''}`;chart.timeScale().fitContent()}
function drawIndicators(data){window.__indicatorSeries=window.__indicatorSeries||[];window.__indicatorSeries.forEach(s=>{try{chart.removeSeries(s)}catch(e){}});window.__indicatorSeries=[];const add=(rows,color)=>{if(!rows.length)return;const s=chart.addLineSeries({color,lineWidth:1,priceLineVisible:false,lastValueVisible:false});s.setData(rows);window.__indicatorSeries.push(s)};if(indicatorState.EMA9)add(ema(data,9),'#ffffff');if(indicatorState.EMA20)add(ema(data,21),'#c58b1b');if(indicatorState.EMA50)add(ema(data,55),'#4b55a2');if(indicatorState.EMA200)add(ema(data,200),'#f87171');if(indicatorState.SMA20)add(sma(data,20),'#22c55e');if(indicatorState.SMA50)add(sma(data,50),'#f97316');if(indicatorState.SMA200)add(sma(data,200),'#ef4444');if(indicatorState.BB20){const [u,l]=bb(data);add(u,'#38bdf8');add(l,'#38bdf8')}if(indicatorState.VWAP)add(vwap(data),'#e879f9');drawCPR(data)}
function cprPeriodKey(dateStr,kind){const d=new Date(`${dateStr}T00:00:00`);if(kind==='W'){const day=d.getDay();d.setDate(d.getDate()-((day+6)%7));return d.toISOString().slice(0,10)}return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`}
function buildCPRLevels(kind){const grouped=new Map();(raw||[]).forEach(c=>{const key=cprPeriodKey(c.time,kind);const h=+c.high,l=+c.low,cl=+c.close;if(![h,l,cl].every(Number.isFinite))return;let g=grouped.get(key);if(!g)grouped.set(key,g={high:h,low:l,close:cl});else{g.high=Math.max(g.high,h);g.low=Math.min(g.low,l);g.close=cl}});const keys=[...grouped.keys()].sort(),levels=new Map();for(let i=1;i<keys.length;i++){const p=grouped.get(keys[i-1]),pp=(p.high+p.low+p.close)/3,bc=(p.high+p.low)/2,tc=pp+(pp-bc);levels.set(keys[i],{pp,tc:Math.max(tc,bc),bc:Math.min(tc,bc)})}return levels}
function drawCPR(data){window.__cprSeries=window.__cprSeries||[];window.__cprSeries.forEach(s=>{try{chart.removeSeries(s)}catch(e){}});window.__cprSeries=[];[{key:'W',on:cprConfig.weekly,c:['#22d3ee','#00e676','#ff3d5a'],n:['W-PP','W-TC','W-BC']},{key:'M',on:cprConfig.monthly,c:['#a78bfa','#22c55e','#f97316'],n:['M-PP','M-TC','M-BC']}].forEach(cfg=>{if(!cfg.on)return;const levels=buildCPRLevels(cfg.key),sets=[[],[],[]];data.forEach(b=>{const lv=levels.get(cprPeriodKey(b.time,cfg.key));if(!lv)return;sets[0].push({time:b.time,value:+lv.pp.toFixed(2)});sets[1].push({time:b.time,value:+lv.tc.toFixed(2)});sets[2].push({time:b.time,value:+lv.bc.toFixed(2)})});sets.forEach((rows,i)=>{if(!rows.length)return;const s=chart.addLineSeries({color:cfg.c[i],lineWidth:1,lineStyle:LightweightCharts.LineStyle.Dashed,priceLineVisible:false,lastValueVisible:false,title:cfg.n[i]});s.setData(rows);window.__cprSeries.push(s)})})}
function updateCPRConfig(){cprConfig.weekly=$('cpr-weekly-en').checked;cprConfig.monthly=$('cpr-monthly-en').checked;draw()}
function setChartType(v){type=v;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===v));draw()}
function setTf(v){tf=v;document.querySelectorAll('#d,#w,#m').forEach(b=>b.classList.remove('active'));$(v==='D'?'d':v==='W'?'w':'m').classList.add('active');draw()}
$('prev').onclick=()=>{if(!symbols.length)return;idx=(idx-1+symbols.length)%symbols.length;openSymbol(symbols[idx].symbol)};$('next').onclick=()=>{if(!symbols.length)return;idx=(idx+1)%symbols.length;openSymbol(symbols[idx].symbol)};$('symbolSelect').onchange=e=>openSymbol(e.target.value);$('go').onclick=()=>{const q=$('direct').value.trim().toUpperCase();const x=symbols.find(s=>s.symbol===q)||symbols.find(s=>(s.symbol+' '+s.name).toUpperCase().includes(q));if(x)openSymbol(x.symbol)};$('direct').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});$('fit').onclick=()=>chart&&chart.timeScale().fitContent();$('d').onclick=()=>setTf('D');$('w').onclick=()=>setTf('W');$('m').onclick=()=>setTf('M');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setChartType(b.dataset.type));$('indBtn').onclick=()=>$('modal').classList.add('open');$('close').onclick=()=>$('modal').classList.remove('open');document.querySelectorAll('input[data-i]').forEach(x=>x.onchange=()=>{indicatorState[x.dataset.i.toUpperCase()]=x.checked;draw()});
loadSymbols().catch(e=>{$('header').textContent='GitHub symbol list error: '+e.message;console.error(e)});
</script>
</body></html>
